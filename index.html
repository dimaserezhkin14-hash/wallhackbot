<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<title>WallRush Engine</title>
<style>
:root{
  --bg:#0b111e;--panel:#151f32;--panel2:#1c2940;--text:#eef4ff;--muted:#8b9ab3;--line:#2b3a54;
  --blue:#347fff;--blueDeep:#2455a8;--red:#e33b50;--redDeep:#a92335;--green:#39e0a1;
  --board:#eef1f7;--boardLine:#b8c0d0;--boardEdge:#aab5ca;--danger:#ff5667;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;color:inherit;border:0}
.app{width:min(100%,680px);margin:auto;padding:13px 0 102px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#3b86ff,#195bd4);box-shadow:0 7px 18px #1c61d055;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px}
.brand-mark i{background:#fff;border-radius:4px}.brand-name{font-size:24px;font-weight:950;letter-spacing:-.8px}
.resign{background:#fff;color:#1c2940;border-radius:17px;padding:13px 19px;font-weight:900;box-shadow:0 8px 25px #0002}
.turnbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.turnbar button{padding:9px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:900}
.turnbar button.active{color:#fff;background:linear-gradient(135deg,#294c8c,#1e396a);border-color:#78a9ff;box-shadow:0 0 0 2px #78a9ff33}
.players{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.player{height:76px;background:var(--panel);border:2px solid transparent;border-radius:25px;padding:9px 13px;display:flex;align-items:center;gap:10px;position:relative;transition:.18s}
.player.blue.active{border-color:#9dbdff;box-shadow:0 0 0 4px #6f9cff33,0 10px 28px #276de344}
.player.red.active{border-color:#ff8792;box-shadow:0 0 0 4px #ff566733,0 10px 28px #d72d3c44}
.player.blue{background:linear-gradient(135deg,#315b9e,#244780)}
.player.red{background:linear-gradient(135deg,#e14858,#bd263a)}
.player .ball{width:44px;height:44px;border-radius:50%;flex:none;box-shadow:inset -7px -8px 11px #0008,inset 5px 5px 10px #fff8,0 5px 12px #0008}
.ball.blue{background:radial-gradient(circle at 30% 23%,#bcdcff,#4e91ff 42%,#1646a1)}
.ball.red{background:radial-gradient(circle at 30% 23%,#ffd0d4,#ff6370 42%,#a7192b)}
.ptext{min-width:0}.pname{font-size:14px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{font-size:12px;margin-top:3px;color:#eaf1ff}.wallcount{font-size:15px;font-weight:950}.brick{font-size:16px}
.vs{position:absolute;left:50%;transform:translateX(-50%);margin-top:18px;z-index:4;background:#fff;color:#7b879b;border-radius:14px;padding:13px 10px;font-weight:950;box-shadow:0 8px 18px #0002}
.players-wrap{position:relative}
.difficulty{display:flex;align-items:center;justify-content:center;gap:13px;color:#d34a5b;font-weight:950;letter-spacing:4px;font-size:12px;margin:7px 0 17px}
.difficulty:before,.difficulty:after{content:"";height:3px;flex:1;background:linear-gradient(90deg,transparent,#d34a5b88)}
.difficulty:after{background:linear-gradient(90deg,#d34a5b88,transparent)}
.board-frame{position:relative;padding:17px;border-radius:38px;background:linear-gradient(145deg,#d7dfec,#b8c4d8);box-shadow:inset 0 0 0 2px #9eacc3,0 15px 35px #0005}
.board-shell{position:relative;aspect-ratio:1;border-radius:25px;overflow:hidden;background:var(--board);box-shadow:inset 0 0 0 6px #aeb8cc,0 0 0 5px #d3dbe8}
.board-shell:before{content:"";position:absolute;inset:0;background:
linear-gradient(to bottom,rgba(239,74,92,.34),transparent 13%),
linear-gradient(to top,rgba(64,139,255,.31),transparent 15%);pointer-events:none;z-index:0}
.board-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);z-index:1}
.cell{position:relative;border-right:2px solid #b9c1d0aa;border-bottom:2px solid #b9c1d0aa;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell:nth-child(9n){border-right:0}.cell:nth-last-child(-n+9){border-bottom:0}
.cell.legal:after{content:"";width:13px;height:13px;border-radius:50%;background:#367ddd;box-shadow:0 0 13px #367ddd88}
.cell.engine{background:#39e0a114}
.cell.engine:before{content:"";position:absolute;inset:8px;border:3px solid var(--green);border-radius:50%;box-shadow:0 0 18px #39e0a1aa}
.cell.engine:after{content:"★";position:absolute;color:#21b981;font-size:17px;text-shadow:0 0 9px #39e0a1;z-index:5}
.piece{width:54%;height:54%;border-radius:50%;z-index:6;box-shadow:inset -7px -8px 12px #0008,inset 5px 5px 10px #fff9,0 7px 13px #0008}
.piece.blue{background:radial-gradient(circle at 29% 22%,#d5e9ff,#3987ff 45%,#174ba9)}
.piece.red{background:radial-gradient(circle at 29% 22%,#ffd9dc,#e84859 45%,#9e1729)}
.wall-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.wall-slot{position:absolute;pointer-events:auto;background:transparent;border:0}
.wall-slot.h{width:calc(22.2222% + 10px);height:16px;transform:translate(-50%,-50%)}
.wall-slot.v{width:16px;height:calc(22.2222% + 10px);transform:translate(-50%,-50%)}
.wall-piece{position:absolute;border-radius:6px;background:linear-gradient(180deg,#485a79,#202d47);border:2px solid #6f81a0;box-shadow:0 5px 12px #1c294955,inset 2px 2px 3px #fff3;pointer-events:none}
.wall-piece.h{height:11px;width:calc(22.2222% - 5px);transform:translate(-50%,-50%)}
.wall-piece.v{width:11px;height:calc(22.2222% - 5px);transform:translate(-50%,-50%)}
.wall-piece.engine{background:linear-gradient(180deg,#58efb9,#168e67);border-color:#9dffe0;box-shadow:0 0 17px #39e0a1cc,0 5px 12px #0005}
.wall-piece.ghost{opacity:.72;border-style:dashed}
.wall-piece.ghost.bad{background:linear-gradient(180deg,#ff6b79,#9e1f31);border-color:#ffadb5;box-shadow:0 0 16px #ff5364aa}
.board-label{display:flex;align-items:center;gap:12px;justify-content:center;margin:17px 0 14px;color:#4382df;font-size:14px;font-weight:950;letter-spacing:5px}
.board-label:before,.board-label:after{content:"";height:3px;flex:1;background:#5d8ee688}
.dock{background:#fff;color:#1d2940;border-radius:27px;padding:12px 13px;display:grid;grid-template-columns:68px 1fr 1fr;gap:8px;box-shadow:0 11px 30px #0002;margin:0 auto;width:min(100%,470px);touch-action:none}
.dock-count{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:950;font-size:16px}
.wall-tool{height:62px;border-radius:18px;background:#f8f9fc;box-shadow:0 8px 17px #77839c33,inset 0 0 0 1px #e8ebf2;display:flex;align-items:center;justify-content:center;font-size:38px;color:#263451;cursor:grab;touch-action:none}
.wall-tool.active{box-shadow:0 0 0 3px #39e0a155,0 8px 20px #77839c44;color:#1e9b73}
.wall-tool:active{cursor:grabbing}
.hint{font-size:12px;color:#8c98ae;text-align:center;margin:10px 0 17px}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.apply{height:52px;border-radius:18px;background:linear-gradient(135deg,#3c86ff,#285bc6);color:#fff;font-weight:950;box-shadow:0 8px 18px #2768dd44}
.apply:disabled{opacity:.32;filter:grayscale(.7);box-shadow:none}
.undo{height:52px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-weight:900}
.status{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:10px;text-align:center;color:var(--muted);font-size:12px}
.status b{color:var(--text)}
.settings{position:fixed;z-index:30;left:50%;bottom:calc(13px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(260px,70vw);height:48px;border-radius:16px;background:#293858;color:#fff;box-shadow:0 12px 28px #0006;font-weight:950;display:flex;align-items:center;justify-content:center;gap:9px}
.settings span{font-size:20px}.drag-active{touch-action:none}
.modal{position:fixed;inset:0;z-index:100;background:#050a14dd;backdrop-filter:blur(12px);display:none;padding:16px}
.modal.open{display:flex}.modal-card{width:min(100%,520px);margin:auto;min-height:70vh;background:var(--panel);border:1px solid var(--line);border-radius:25px;padding:20px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0009}
.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{margin:0}.close{width:40px;height:40px;border-radius:12px;background:var(--panel2);font-size:25px}
.setting{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:4px}
.switch{width:52px;height:29px;border-radius:18px;background:#41516c;padding:3px}.switch i{display:block;width:23px;height:23px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(23px)}
.theme{display:flex;gap:7px}.theme button{padding:8px 11px;border-radius:10px;background:var(--panel2);font-size:12px}.theme button.active{outline:2px solid var(--blue)}
.creator{margin-top:auto;text-align:center;color:#718099;font-size:11px;padding-top:30px}
.light{--bg:#edf1f8;--panel:#fff;--panel2:#edf1f7;--text:#1c2940;--muted:#78869e;--line:#d5ddea}
.light .turnbar button{background:#fff}.light .player.blue{background:linear-gradient(135deg,#315b9e,#244780);color:#fff}.light .player.red{background:linear-gradient(135deg,#e14858,#bd263a);color:#fff}
.drag-tip{position:fixed;z-index:200;pointer-events:none;display:none;padding:7px 10px;border-radius:9px;background:#111b2c;color:#fff;font-size:11px;font-weight:800;box-shadow:0 5px 20px #0006}
@media(max-width:480px){
  .app{padding-top:8px}.brand-mark{width:42px;height:42px}.brand-name{font-size:22px}.resign{padding:12px 15px}
  .player{height:70px;padding:8px 10px;border-radius:23px}.player .ball{width:40px;height:40px}
  .board-frame{padding:12px;border-radius:31px}.board-shell{border-radius:20px}
  .dock{grid-template-columns:55px 1fr 1fr}.wall-tool{height:57px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-mark"><i></i><i></i><i></i><i></i></div><div class="brand-name">WallRush</div></div>
    <button class="resign" id="resign">⚑ Сдаться</button>
  </header>

  <div class="players-wrap">
    <div class="players">
      <div class="player blue active" id="pBlue"><div class="ball blue"></div><div class="ptext"><div class="pname" id="blueName">Player</div><div class="pmeta"><span class="wallcount" id="blueWalls">10</span> 🧱</div></div></div>
      <div class="player red" id="pRed"><div class="ball red"></div><div class="ptext"><div class="pname">🤖 Rival</div><div class="pmeta"><span class="wallcount" id="redWalls">10</span> 🧱</div></div></div>
    </div>

  </div>

    <button class="wall-tool" data-orient="h" id="wallH" aria-label="Горизонтальная стена">━</button>

<button class="settings" id="settings"><span>⚙</span> Настройки</button>

    <div class="setting">
      <div><b>Тема</b><small>Оформление движка</small></div>
      <div class="theme"><button id="darkBtn">Тёмная</button><button id="lightBtn">Светлая</button></div>
    </div>
    <div class="setting">
      <div><b>Звуковые эффекты</b><small>Ход и установка стены</small></div>
      <button class="switch on" id="soundSwitch"><i></i></button>
    </div>
    <div class="setting">
      <div><b>Подсказки движка</b><small>Подсвечивать лучший ход автоматически</small></div>
      <button class="switch on" id="hintSwitch"><i></i></button>
    </div>
    <div class="creator">Создатель движка: @qufpx</div>

</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
"use strict";

const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor("#0b111e");tg.setBackgroundColor("#0b111e");tg.enableClosingConfirmation()}catch(e){}
}

const SIZE=9;
const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
let state,history=[],engineMove=null,selectedWall=null,soundOn=true,hintsOn=true,theme="dark";
let audio=null,dragging=false,dragOrient=null,ghostEl=null,ghostAnchor=null;

function initialState(first="blue"){
  return {
    turn:first,
    gameOver:false,
    blue:{r:8,c:4,walls:10},
    red:{r:0,c:4,walls:10},
    walls:new Set()
  };
}
function wallKey(r,c,o){return r+","+c+","+o}
function cellKey(r,c){return r+","+c}
function cloneState(){
  return {
    turn:state.turn,gameOver:state.gameOver,
    blue:{...state.blue},red:{...state.red},
    walls:new Set(state.walls)
  };
}
function save(){history.push(cloneState());if(history.length>100)history.shift()}
function restore(s){state={turn:s.turn,gameOver:s.gameOver,blue:{...s.blue},red:{...s.red},walls:new Set(s.walls)};engineMove=null;selectedWall=null;render();computeEngine()}
function inBoard(r,c){return r>=0&&r<9&&c>=0&&c<9}

function edgeBlocked(a,b,walls=state.walls){
  const dr=b.r-a.r,dc=b.c-a.c;
  if(dr===0&&Math.abs(dc)===1){
    const c=Math.min(a.c,b.c);
    return walls.has(wallKey(a.r,c,"v"))||walls.has(wallKey(a.r-1,c,"v"));
  }
  if(dc===0&&Math.abs(dr)===1){
    const r=Math.min(a.r,b.r);
    return walls.has(wallKey(r,a.c,"h"))||walls.has(wallKey(r,a.c-1,"h"));
  }
  return true;
}

function rawNeighbors(pos,walls=state.walls){
  const out=[];
  for(const [dr,dc] of dirs){
    const n={r:pos.r+dr,c:pos.c+dc};
    if(inBoard(n.r,n.c)&&!edgeBlocked(pos,n,walls))out.push(n);
  }
  return out;
}

function legalMoves(player){
  const me=state[player],other=state[player==="blue"?"red":"blue"],out=[];
  for(const n of rawNeighbors(me)){
    if(n.r===other.r&&n.c===other.c){
      const dr=n.r-me.r,dc=n.c-me.c;
      const jump={r:other.r+dr,c:other.c+dc};
      if(inBoard(jump.r,jump.c)&&!edgeBlocked(other,jump)){
        out.push(jump);
      }else{
        const sides=[{r:other.r+dc,c:other.c-dr},{r:other.r-dc,c:other.c+dr}];
        for(const x of sides){
          if(inBoard(x.r,x.c)&&!edgeBlocked(other,x))out.push(x);
        }
      }
    }else out.push(n);
  }
  const seen=new Set();return out.filter(p=>{const k=cellKey(p.r,p.c);if(seen.has(k))return false;seen.add(k);return true});
}

function shortestPath(player,walls=state.walls,start=null){
  const s=start||state[player],goal=player==="blue"?0:8;
  const q=[s],dist=new Map([[cellKey(s.r,s.c),0]]);
  while(q.length){
    const a=q.shift(),d=dist.get(cellKey(a.r,a.c));
    if(a.r===goal)return d;
    for(const n of rawNeighbors(a,walls)){
      const k=cellKey(n.r,n.c);
      if(!dist.has(k)){dist.set(k,d+1);q.push(n)}
    }
  }
  return Infinity;
}

function pathCount(player,walls=state.walls,limit=4){
  const s=state[player],goal=player==="blue"?0:8;
  const dist=new Map([[cellKey(s.r,s.c),0]]),q=[s];
  let best=Infinity,count=0;
  while(q.length){
    const a=q.shift(),d=dist.get(cellKey(a.r,a.c));
    if(d>best)continue;
    if(a.r===goal){best=d;count++;continue}
    for(const n of rawNeighbors(a,walls)){
      const k=cellKey(n.r,n.c);
      if(!dist.has(k)){dist.set(k,d+1);q.push(n)}
    }
  }
  return Math.min(count,limit);
}

function legalWall(r,c,o,walls=state.walls){
  if(r<0||r>7||c<0||c>7)return false;
  const k=wallKey(r,c,o);
  if(walls.has(k))return false;
  if(o==="h"){
    if(walls.has(wallKey(r,c,"v")))return false;
  }else{
    if(walls.has(wallKey(r,c,"h")))return false;
  }
  const copy=new Set(walls);copy.add(k);
  return shortestPath("blue",copy)!==Infinity&&shortestPath("red",copy)!==Infinity;
}

function allWalls(){
  const a=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)for(const o of ["h","v"])if(legalWall(r,c,o))a.push({r,c,o});
  return a;
}

function wallImpact(player,w){
  const before=shortestPath(player),copy=new Set(state.walls);copy.add(wallKey(w.r,w.c,w.o));
  return shortestPath(player,copy)-before;
}

function evalPosition(forPlayer){
  const my=shortestPath(forPlayer),enemy=shortestPath(forPlayer==="blue"?"red":"blue");
  if(!isFinite(my)||!isFinite(enemy))return -100000;
  const myPaths=pathCount(forPlayer),enemyPaths=pathCount(forPlayer==="blue"?"red":"blue");
  const me=state[forPlayer],opp=state[forPlayer==="blue"?"red":"blue"];
  const center=4-Math.abs(me.c-4);
  const wallAdv=me.walls-opp.walls;
  return (enemy-my)*3+(enemyPaths-myPaths)*.18+center*.10+wallAdv*.22;
}

/*
  WallRush engine:
  - BFS guarantees a route for both players.
  - Candidate walls are scored by enemy detour minus self detour.
  - A second shallow reply search rejects "pretty" walls that give the opponent
    an even stronger response.
  - The engine also values reducing the opponent's number of shortest routes,
    centralization, and preserving its own escape routes.
*/
function simulateWallScore(w){
  const beforeB=shortestPath("blue"),beforeR=shortestPath("red");
  const pb=pathCount("blue"),pr=pathCount("red");
  const copy=new Set(state.walls);copy.add(wallKey(w.r,w.c,w.o));
  const afterB=shortestPath("blue",copy),afterR=shortestPath("red",copy);
  if(!isFinite(afterB)||!isFinite(afterR))return -1e9;
  const self=state.turn,enemy=self==="blue"?"red":"blue";
  const selfBefore=self==="blue"?beforeB:beforeR, enemyBefore=enemy==="blue"?beforeB:beforeR;
  const selfAfter=self==="blue"?afterB:afterR, enemyAfter=enemy==="blue"?afterB:afterR;
  const selfPaths=self==="blue"?pb:pathCount("red"), enemyPaths=enemy==="blue"?pb:pr;
  const enemyPathsAfter=enemy==="blue"?pathCount("blue",copy):pathCount("red",copy);
  const selfDelta=selfAfter-selfBefore,enemyDelta=enemyAfter-enemyBefore;
  let score=enemyDelta*5-selfDelta*3+(enemyPaths-enemyPathsAfter)*.7;
  score+=(4-Math.abs(w.c-3.5))*.10;
  return score;
}

function bestEngineMove(){
  if(state.gameOver)return null;
  const player="blue";
  const steps=legalMoves(player);
  let best=null,bestScore=-Infinity;

  for(const p of steps){
    const old={...state.blue};state.blue={...p};
    const d=shortestPath("blue"),e=shortestPath("red");
    const center=4-Math.abs(p.c-4);
    const score=(shortestPath("red")-d)*3+center*.22+(old.r-p.r)*.08;
    state.blue=old;
    if(score>bestScore){bestScore=score;best={type:"step",r:p.r,c:p.c,score}}
  }

  if(state.blue.walls>0){
    const candidates=allWalls();
    const scored=candidates.map(w=>({...w,score:simulateWallScore(w)})).sort((a,b)=>b.score-a.score).slice(0,18);
    for(const w of scored){
      const copy=new Set(state.walls);copy.add(wallKey(w.r,w.c,w.o));
      const enemy="red";
      const before=shortestPath(enemy),after=shortestPath(enemy,copy);
      let trap=pathCount(enemy)-pathCount(enemy,copy);
      let score=w.score+trap*.55+(after-before)*1.25;
      /* Anti-self-trap: penalize walls that leave us with very few shortest routes. */
      const ownPaths=pathCount("blue",copy);
      if(ownPaths<=1)score-=1.8;
      if(score>bestScore){bestScore=score;best={type:"wall",r:w.r,c:w.c,o:w.o,score}}
    }
  }
  return best;
}

function cellPosition(r,c){
  const grid=document.getElementById("boardGrid");
  const el=grid.children[r*9+c];
  return el;
}
function wallPosition(r,c,o){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  return {x:rect.width*(c+1)/9,y:rect.height*(r+1)/9};
}
function createWallPiece(r,c,o,extra=""){
  const el=document.createElement("div");
  el.className="wall-piece "+o+" "+extra;
  const p=wallPosition(r,c,o);el.style.left=p.x+"px";el.style.top=p.y+"px";
  return el;
}

function render(){
  const grid=document.getElementById("boardGrid"),layer=document.getElementById("wallLayer");
  grid.innerHTML="";layer.innerHTML="";
  const legal=state.gameOver?[]:legalMoves(state.turn);
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const cell=document.createElement("div");cell.className="cell";
    if(legal.some(p=>p.r===r&&p.c===c))cell.classList.add("legal");
    if(engineMove?.type==="step"&&engineMove.r===r&&engineMove.c===c&&hintsOn)cell.classList.add("engine");
    if(state.blue.r===r&&state.blue.c===c){const p=document.createElement("div");p.className="piece blue";cell.appendChild(p)}
    if(state.red.r===r&&state.red.c===c){const p=document.createElement("div");p.className="piece red";cell.appendChild(p)}
    cell.dataset.r=r;cell.dataset.c=c;cell.addEventListener("click",()=>onCell(r,c));grid.appendChild(cell);
  }
  for(const k of state.walls){
    const [r,c,o]=k.split(",");
    layer.appendChild(createWallPiece(+r,+c,o));
  }
  if(engineMove?.type==="wall"&&hintsOn)layer.appendChild(createWallPiece(engineMove.r,engineMove.c,engineMove.o,"engine"));
  updateUI();
}

function updateUI(){
  document.getElementById("blueWalls").textContent=state.blue.walls;
  document.getElementById("redWalls").textContent=state.red.walls;
  document.getElementById("dockCount").textContent=state[state.turn].walls;
  document.getElementById("pBlue").classList.toggle("active",state.turn==="blue");
  document.getElementById("pRed").classList.toggle("active",state.turn==="red");
  document.getElementById("playerLabel").textContent=state.turn==="blue"?"PLAYER":"RIVAL";
  document.getElementById("apply").disabled=!(state.turn==="blue"&&engineMove&&!state.gameOver);
  document.getElementById("status").innerHTML=state.gameOver?"🏁 <b>Игра завершена</b>":state.turn==="blue"?(engineMove?("⚡ Совет: <b>"+(engineMove.type==="step"?"сделать шаг":"поставить стену")+"</b>"):"⚡ Совет: <b>считаю…</b>"):"⏳ <b>Ход противника</b>";
  document.querySelectorAll(".wall-tool").forEach(b=>b.classList.toggle("active",b.dataset.orient===selectedWall));
}

function onCell(r,c){
  if(state.gameOver)return;
  if(state.turn==="blue"&&engineMove?.type==="step"&&engineMove.r===r&&engineMove.c===c){
    applyEngine();return;
  }
  if(legalMoves(state.turn).some(p=>p.r===r&&p.c===c)){
    save();state[state.turn].r=r;state[state.turn].c=c;playMoveSound();finishTurn();
  }
}

function placeWall(r,c,o){
  if(state.gameOver||state[state.turn].walls<=0||!legalWall(r,c,o))return false;
  save();state.walls.add(wallKey(r,c,o));state[state.turn].walls--;playWallSound();selectedWall=null;engineMove=null;finishTurn();return true;
}

function finishTurn(){
  const won=state.blue.r===0||state.red.r===8;
  if(won){state.gameOver=true;render();setTimeout(()=>alert(state.blue.r===0?"Синий победил!":"Красный победил!"),20);return}
  state.turn=state.turn==="blue"?"red":"blue";render();
  if(state.turn==="blue")computeEngine();
}

function computeEngine(){
  if(state.turn!=="blue"||state.gameOver||!hintsOn){render();return}
  document.getElementById("status").innerHTML="⚡ Совет: <b>считаю лучший ход…</b>";
  setTimeout(()=>{engineMove=bestEngineMove();render()},35);
}

function applyEngine(){
  if(state.turn!=="blue"||!engineMove)return;
  save();
  if(engineMove.type==="step"){state.blue.r=engineMove.r;state.blue.c=engineMove.c;playMoveSound()}
  else{state.walls.add(wallKey(engineMove.r,engineMove.c,engineMove.o));state.blue.walls--;playWallSound()}
  engineMove=null;finishTurn();
}

document.getElementById("apply").onclick=applyEngine;

document.getElementById("undo").onclick=()=>{
  if(history.length)restore(history.pop());
};

document.getElementById("resign").onclick=()=>{
  if(state.gameOver)return;
  if(confirm("Сдаться и начать новую игру?")){
    state=initialState("blue");history=[];engineMove=null;selectedWall=null;render();computeEngine();
  }
};

function selectWall(o){selectedWall=selectedWall===o?null:o;render()}
document.getElementById("wallH").onclick=()=>selectWall("h");
document.getElementById("wallV").onclick=()=>selectWall("v");

function boardAnchorFromPointer(x,y,o){
  const rect=document.getElementById("boardShell").getBoundingClientRect();
  const nx=Math.max(0,Math.min(.9999,(x-rect.left)/rect.width));
  const ny=Math.max(0,Math.min(.9999,(y-rect.top)/rect.height));
  if(o==="h"){
    return {r:Math.max(0,Math.min(7,Math.floor(ny*9-.5))),c:Math.max(0,Math.min(7,Math.round(nx*9-1)))};
  }
  return {r:Math.max(0,Math.min(7,Math.round(ny*9-1))),c:Math.max(0,Math.min(7,Math.floor(nx*9-.5)))};
}

function showGhostAt(x,y,o){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  const a=boardAnchorFromPointer(x,y,o);
  const p=wallPosition(a.r,a.c,o);
  if(ghostEl)ghostEl.remove();
  ghostEl=createWallPiece(a.r,a.c,o,"ghost");
  const ok=state[state.turn].walls>0&&legalWall(a.r,a.c,o);
  if(!ok)ghostEl.classList.add("bad");
  document.getElementById("wallLayer").appendChild(ghostEl);
  ghostAnchor={...a,ok};
  document.getElementById("dragTip").style.display="block";
  document.getElementById("dragTip").style.left=(x+10)+"px";
  document.getElementById("dragTip").style.top=(y+10)+"px";
}

function endDrag(x,y){
  if(!dragging)return;
  dragging=false;
  document.body.classList.remove("drag-active");
  document.getElementById("dragTip").style.display="none";
  if(ghostAnchor?.ok)placeWall(ghostAnchor.r,ghostAnchor.c,dragOrient);
  if(ghostEl){ghostEl.remove();ghostEl=null}
  ghostAnchor=null;dragOrient=null;
}

function bindWallDrag(btn){
  btn.addEventListener("pointerdown",e=>{
    if(state.gameOver)return;
    dragging=true;dragOrient=btn.dataset.orient;selectedWall=dragOrient;btn.setPointerCapture?.(e.pointerId);
    document.body.classList.add("drag-active");showGhostAt(e.clientX,e.clientY,dragOrient);e.preventDefault();
  });
  btn.addEventListener("pointermove",e=>{if(dragging)showGhostAt(e.clientX,e.clientY,dragOrient)});
  btn.addEventListener("pointerup",e=>endDrag(e.clientX,e.clientY));
  btn.addEventListener("pointercancel",()=>endDrag(0,0));
}
bindWallDrag(document.getElementById("wallH"));bindWallDrag(document.getElementById("wallV"));

document.getElementById("boardShell").addEventListener("pointermove",e=>{
  if(dragging)showGhostAt(e.clientX,e.clientY,dragOrient);
});
document.getElementById("boardShell").addEventListener("pointerup",e=>{if(dragging)endDrag(e.clientX,e.clientY)});

document.getElementById("boardShell").addEventListener("click",e=>{
  if(dragging||!selectedWall)return;
  const rect=e.currentTarget.getBoundingClientRect();
  const a=boardAnchorFromPointer(e.clientX,e.clientY,selectedWall);
  if(legalWall(a.r,a.c,selectedWall))placeWall(a.r,a.c,selectedWall);
});

function sfx(freq,dur,type="sine",vol=.035){
  if(!soundOn)return;
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(vol,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
  }catch(e){}
}
function playMoveSound(){sfx(430,.11,"sine",.035);setTimeout(()=>sfx(650,.08,"sine",.025),35)}
function playWallSound(){sfx(100,.07,"square",.03)}

const modal=document.getElementById("modal");
document.getElementById("settings").onclick=()=>modal.classList.add("open");
document.getElementById("close").onclick=()=>modal.classList.remove("open");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};

document.getElementById("soundSwitch").onclick=()=>{
  soundOn=!soundOn;
  document.getElementById("soundSwitch").classList.toggle("on",soundOn);
  try{localStorage.setItem("wr-sound",soundOn?"on":"off")}catch(e){}
};
document.getElementById("hintSwitch").onclick=()=>{
  hintsOn=!hintsOn;
  document.getElementById("hintSwitch").classList.toggle("on",hintsOn);
  try{localStorage.setItem("wr-hints",hintsOn?"on":"off")}catch(e){}
  if(hintsOn)computeEngine();else{engineMove=null;render()}
};
function setTheme(t){
  theme=t;document.body.classList.toggle("light",t==="light");
  document.getElementById("darkBtn").classList.toggle("active",t==="dark");
  document.getElementById("lightBtn").classList.toggle("active",t==="light");
  try{localStorage.setItem("wr-theme",t)}catch(e){}
}
document.getElementById("darkBtn").onclick=()=>setTheme("dark");
document.getElementById("lightBtn").onclick=()=>setTheme("light");

try{
  theme=localStorage.getItem("wr-theme")||"dark";
  soundOn=localStorage.getItem("wr-sound")!=="off";
  hintsOn=localStorage.getItem("wr-hints")!=="off";
}catch(e){}
setTheme(theme);
document.getElementById("soundSwitch").classList.toggle("on",soundOn);
document.getElementById("hintSwitch").classList.toggle("on",hintsOn);

state=initialState("blue");
render();
computeEngine();
</script>
