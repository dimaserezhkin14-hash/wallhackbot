<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<title>WallRush Engine Pro</title>
<style>
:root{
  --bg:#0b111e;--panel:#151f32;--panel2:#1c2940;--text:#eef4ff;--muted:#8b9ab3;--line:#2b3a54;
  --blue:#347fff;--blueDeep:#2455a8;--red:#e33b50;--redDeep:#a92335;--green:#39e0a1;
  --board:#111a29;--boardLine:#34445c;--boardEdge:#26344b;--danger:#ff5667;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;user-select:none}

.app{
  width:min(100%,680px);
  height:100dvh;
  margin:auto;
  padding:4px 0 4px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  gap:5px;
}

/* TOP HEADER: Logo on the left, Resign on the right (Clean & Never overflows) */
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 32px;
  height:32px;
  width:100%;
}
.brand{display:flex;align-items:center;gap:6px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#3b86ff,#195bd4);box-shadow:0 3px 8px #1c61d055;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.brand-mark i{background:#fff;border-radius:1.5px}
.brand-name{font-size:16px;font-weight:950;letter-spacing:-.4px}

.resign-btn{
  background:#261824;
  border:1px solid #5a2634;
  color:#ff7a88;
  border-radius:8px;
  padding:0 9px;
  height:28px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  transition:background .15s ease, transform .1s ease;
}
.resign-btn:active{background:#381c2b;transform:scale(0.97)}

/* CONTROLS BAR: Dedicated row for mode & match options, perfectly fit */
.control-bar{
  display:flex;
  gap:4px;
  align-items:center;
  width:100%;
  flex:0 0 28px;
  height:28px;
}

.ctrl-btn{
  background:#18243a;
  border:1px solid #2b3d58;
  color:#eef4ff;
  border-radius:8px;
  height:28px;
  padding:0 6px;
  font-size:10.5px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  flex:1 1 0;
  min-width:0;
  transition:background .15s ease, transform .1s ease;
}
.ctrl-btn:active{background:#233552;transform:scale(0.98)}

.turn-badge{
  padding:1px 4px;
  border-radius:4px;
  font-size:9px;
  font-weight:950;
}
.turn-badge.me{background:#2768dd;color:#fff}
.turn-badge.opp{background:#bd263a;color:#fff}

/* Finish container */
.finish-bar-wrap{
  flex:0 0 14px;
  height:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.finish-bar{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
}
.finish-bar.visible{
  display:flex;
  animation:popIn .25s ease;
}
.finish-line{
  flex:1;
  height:1.5px;
  background:#1e8e60;
  box-shadow:0 0 6px rgba(30, 142, 96, 0.4);
}
.finish-label{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:950;
  color:#1ebf7c;
  letter-spacing:3px;
}

.players-wrap{position:relative;flex:0 0 44px;height:44px}
.players{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;width:100%;height:100%}
.player{
  height:44px;
  width:100%;
  min-width:0;
  background:var(--panel);
  border:2px solid transparent;
  border-radius:12px;
  padding:3px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
  user-select:none;
  transition:border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.player.is-blue{background:linear-gradient(135deg,#315b9e,#244780)}
.player.is-red{background:linear-gradient(135deg,#e14858,#bd263a)}
.player.is-blue.active{border-color:#9dbdff;box-shadow:0 0 0 2.5px #6f9cff33,0 4px 12px #276de344}
.player.is-red.active{border-color:#ff8792;box-shadow:0 0 0 2.5px #ff566733,0 4px 12px #d72d3c44}

.player .ball{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -4px -5px 7px #0008,inset 3px 3px 6px #fff8,0 3px 8px #0008;transition:transform .2s ease}
.ball.blue{background:radial-gradient(circle at 30% 23%,#bcdcff,#4e91ff 42%,#1646a1)}
.ball.red{background:radial-gradient(circle at 30% 23%,#ffd0d4,#ff6370 42%,#a7192b)}
.ptext{min-width:0;flex:1 1 0;overflow:hidden}
.pname{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:10px;margin-top:1px;color:#eaf1ff}
.wallcount{font-size:11.5px;font-weight:950}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#18243a;color:#8e9bb2;border-radius:7px;padding:2px 5px;font-weight:950;font-size:8.5px;pointer-events:none}

/* Board frame */
.board-frame{
  position:relative;
  padding:0;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  overflow:hidden;
}

.board-shell{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:var(--board);
  box-shadow:inset 0 0 0 1px #26354c,0 6px 20px #0008;
  flex:0 0 auto;
}

.board-shell.mode-race:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  border-top:3px solid #2ae48f;
  box-shadow:inset 0 1px 0 #46ffaa, 0 -1px 8px rgba(42, 228, 143, 0.4);
  background:linear-gradient(to bottom, rgba(30, 191, 124, 0.22) 0%, rgba(30, 191, 124, 0.07) 12%, transparent 26%);
  border-top-left-radius:16px;
  border-top-right-radius:16px;
}

/* Edge glows */
.glow-edge{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity .35s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-edge.bottom-glow{
  background:linear-gradient(to top, rgba(57, 135, 255, 0.32) 0%, rgba(57, 135, 255, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 -10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.top-glow{
  background:linear-gradient(to bottom, rgba(227, 59, 80, 0.32) 0%, rgba(227, 59, 80, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 10px 24px rgba(227, 59, 80, 0.45);
}
.glow-edge.active{opacity:1}

.board-grid{
  position:absolute;
  inset:0;
  display:grid;
  z-index:1;
}
.cell{
  position:relative;
  border-right:1px solid #34445c;
  border-bottom:1px solid #34445c;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  touch-action:manipulation;
}
.cell.legal:after{
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:#367ddd;
  box-shadow:0 0 8px #367ddd88;
  animation:dotPop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes dotPop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}

.cell.engine{background:#39e0a11a!important;position:relative}
.cell.engine:before{content:"";position:absolute;inset:2px;border:2px solid #52e9b6;border-radius:6px;box-shadow:0 0 10px #39e0a1aa,inset 0 0 5px #39e0a133;animation:pulseBest 1.1s ease-in-out infinite;pointer-events:none}
.cell.engine:after{content:"BEST";position:absolute;right:2px;top:2px;color:#eafff7;background:#159b70;border-radius:3px;padding:1px 2.5px;font-size:5.5px;font-weight:950;letter-spacing:.4px;z-index:7}
@keyframes pulseBest{50%{transform:scale(.94);opacity:.72}}

/* Piece layer */
.piece-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.board-piece{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:inset -4px -5px 8px #0008,inset 3px 3px 6px #fff9,0 5px 10px #0009;
  transition:left .22s cubic-bezier(0.34, 1.3, 0.64, 1), top .22s cubic-bezier(0.34, 1.3, 0.64, 1);
  will-change:left, top;
}
.board-piece.blue{background:radial-gradient(circle at 29% 22%,#d5e9ff,#3987ff 45%,#174ba9)!important}
.board-piece.red{background:radial-gradient(circle at 29% 22%,#ffd9dc,#e84859 45%,#9e1729)!important}

/* Wall layer */
.wall-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.wall-piece{
  position:absolute;
  border-radius:4px;
  background:linear-gradient(180deg,#485a79,#202d47);
  border:1.5px solid #6f81a0;
  box-shadow:0 3px 8px #1c294955,inset 1px 1px 2px #fff3;
  pointer-events:none;
  animation:wallDrop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes wallDrop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.wall-piece.h{height:8px;transform:translate(-50%,-50%)}
.wall-piece.v{width:8px;transform:translate(-50%,-50%)}
.wall-piece.engine{background:linear-gradient(180deg,#58efb9,#168e67)!important;border-color:#9dffe0!important;box-shadow:0 0 12px #39e0a1cc,0 3px 8px #0005!important;z-index:15}
.wall-piece.ghost{opacity:.95;border-style:dashed;filter:drop-shadow(0 6px 6px #0009);z-index:20;animation:none}
.wall-piece.ghost.bad{background:linear-gradient(180deg,#ff6b79,#9e1f31)!important;border-color:#ffadb5!important;box-shadow:0 0 12px #ff5364aa!important}

/* Bottom container */
.bottom-container{
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:0 0 auto;
}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.apply{height:40px;border-radius:12px;background:linear-gradient(135deg,#3c86ff,#285bc6);color:#fff;font-weight:950;font-size:12.5px;box-shadow:0 4px 12px #2768dd33;cursor:pointer;transition:transform .12s}
.apply:active{transform:scale(0.98)}
.apply:disabled{opacity:.32;filter:grayscale(.7);box-shadow:none;cursor:default}
.undo{height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:12.5px;cursor:pointer;transition:transform .12s}
.undo:active{transform:scale(0.98)}

.dock{background:#121c2b;color:#dbe5f5;border-radius:13px;padding:4px 8px;display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;border:1px solid #24344c;width:100%;touch-action:none}
.dock-count{display:flex;align-items:center;justify-content:center;gap:3px;font-weight:950;font-size:13px}
.wall-tool{
  height:38px;
  border-radius:10px;
  background:#18243a;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  touch-action:none;
  transition:all .15s ease;
}
.wall-tool.active{box-shadow:0 0 0 2px #39e0a166;color:#5ee9b8}
.wall-tool:active{cursor:grabbing;transform:scale(0.98)}

.wall-icon{
  display:block;
  background:linear-gradient(180deg,#5a6e91,#283857);
  border:1px solid #8295b7;
  border-radius:2px;
  box-shadow:0 2px 4px #0004;
}
.wall-tool[data-orient="h"] .wall-icon{width:22px;height:6px}
.wall-tool[data-orient="v"] .wall-icon{width:6px;height:22px}

.settings{
  width:100%;
  height:38px;
  border-radius:12px;
  background:#18243a;
  color:#fff;
  border:1px solid #2a3b55;
  box-shadow:0 3px 10px #0005;
  font-weight:950;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  transition:transform .12s;
}
.settings:active{transform:scale(0.99)}
.settings span{font-size:14px}

.modal{position:fixed;inset:0;z-index:100;background:#050a14dd;backdrop-filter:blur(12px);display:none;padding:16px}
.modal.open{display:flex}.modal-card{width:min(100%,520px);margin:auto;min-height:44vh;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0009}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.modal-head h2{margin:0;font-size:18px}.close{width:34px;height:34px;border-radius:9px;background:var(--panel2);font-size:20px;cursor:pointer}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:2px;font-size:10.5px}
.switch{width:46px;height:26px;border-radius:16px;background:#41516c;padding:2.5px;cursor:pointer}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}
.theme{display:flex;gap:5px}.theme button{padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:11px;cursor:pointer}.theme button.active{outline:2px solid var(--blue)}

.author-box{
  margin-top:auto;
  padding-top:14px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:#9eb1d1;
  letter-spacing:.3px;
}
.author-box a{color:#52a5ff;text-decoration:none}

.light{--board:#eef1f7;--boardLine:#b8c0d0;--boardEdge:#aab5ca;--bg:#edf1f8;--panel:#fff;--panel2:#edf1f7;--text:#1c2940;--muted:#78869e;--line:#d5ddea}
.light .cell{border-right-color:#c4cddc;border-bottom-color:#c4cddc}
.light .resign-btn,.light .undo,.light .ctrl-btn{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .dock{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .wall-tool{background:#edf2f9;color:#1c2940}
.light .wall-icon{background:linear-gradient(180deg,#c8d4ec,#8da0c4);border-color:#a4b6d4}
.light .settings{background:#233554;color:#fff}
.light .author-box{color:#435574}
</style>
</head>
<body>
<div class="app">
  <!-- TOP ROW: Brand on the left, Reset on the right -->
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i><i></i></div>
      <div class="brand-name">WALLHACK</div>
    </div>
    <button class="resign-btn" id="resign" title="Сбросить партию">↻ Сброс</button>
  </header>

  <!-- DEDICATED CONTROLS ROW: Mode & match options, all in one neat row -->
  <div class="control-bar">
    <button class="ctrl-btn" id="modeToggle" title="Сменить режим">
      <span id="modeLabel">Дуэль 9×9</span>
    </button>
    <button class="ctrl-btn" id="firstTurnToggle" title="Кто делает 1-й ход">
      <span>1-й:</span>
      <span class="turn-badge me" id="firstTurnBadge">Ты</span>
    </button>
    <!-- Дополнительные кнопки для Гонки -->
    <button class="ctrl-btn" id="racePosToggle" style="display:none" title="Твоя стартовая позиция">
      <span>Ты:</span>
      <span id="racePosBadge">Справа</span>
    </button>
    <button class="ctrl-btn" id="wallsToggle" style="display:none" title="Количество стен">
      <span>Стен:</span>
      <span id="wallsBadge">15</span>
    </button>
  </div>

  <div class="finish-bar-wrap">
    <div class="finish-bar" id="finishBar">
      <div class="finish-line"></div>
      <div class="finish-label">🏁 ФИНИШ</div>
      <div class="finish-line"></div>
    </div>
  </div>

  <div class="players-wrap">
    <div class="players">
      <div class="player bottom-p is-blue active" id="pMe">
        <div class="ball blue"></div>
        <div class="ptext">
          <div class="pname">Ты (Синий)</div>
          <div class="pmeta"><span class="wallcount" id="meWalls">10</span> 🧱</div>
        </div>
      </div>
      <div class="player top-p is-red" id="pOpp">
        <div class="ball red"></div>
        <div class="ptext">
          <div class="pname">Противник (Красный)</div>
          <div class="pmeta"><span class="wallcount" id="oppWalls">10</span> 🧱</div>
        </div>
      </div>
    </div>
    <div class="vs">VS</div>
  </div>

  <main class="board-frame" id="boardFrame">
    <div class="board-shell mode-duel" id="boardShell">
      <div class="glow-edge bottom-glow active" id="glowBottom"></div>
      <div class="glow-edge top-glow" id="glowTop"></div>
      <div class="board-grid" id="boardGrid"></div>
      <div class="piece-layer" id="pieceLayer">
        <div class="board-piece blue" id="pieceMe"></div>
        <div class="board-piece red" id="pieceOpp"></div>
      </div>
      <div class="wall-layer" id="wallLayer"></div>
    </div>
  </main>

  <div class="bottom-container">
    <div class="bottom-row">
      <button class="apply" id="apply" disabled>✓ Применить совет</button>
      <button class="undo" id="undo">↩ Назад</button>
    </div>
    
    <section class="dock">
      <div class="dock-count"><span>🧱</span><span id="dockCount">10</span></div>
      <button class="wall-tool" data-orient="h" id="wallH" aria-label="Горизонтальная стена"><i class="wall-icon"></i></button>
      <button class="wall-tool" data-orient="v" id="wallV" aria-label="Вертикальная стена"><i class="wall-icon"></i></button>
    </section>
    
    <button class="settings" id="settings"><span>⚙</span> Настройки</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head"><h2>Настройки</h2><button class="close" id="close">×</button></div>
    <div class="setting">
      <div><b>Тема</b><small>Оформление движка</small></div>
      <div class="theme"><button id="darkBtn">Тёмная</button><button id="lightBtn">Светлая</button></div>
    </div>
    <div class="setting">
      <div><b>Звуковые эффекты</b><small>Ход и установка стены</small></div>
      <button class="switch on" id="soundSwitch"><i></i></button>
    </div>
    <div class="author-box">автор: <a href="https://t.me/qufpx" target="_blank" rel="noopener">@qufpx</a></div>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
"use strict";

const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor("#0b111e");tg.setBackgroundColor("#0b111e");tg.enableClosingConfirmation()}catch(e){}
}

const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
let state,history=[],engineMove=null,selectedWall=null,soundOn=true,theme="dark";
let gameMode="duel"; // 'duel' (9x9) or 'race' (9x13)
let firstTurnSetting="me"; // 'me' or 'opp'
let raceSideSetting="right"; // 'right' or 'left'
let raceWallsSetting=15; // 15 или 10
let audio=null,dragging=false,dragOrient=null,ghostEl=null,ghostAnchor=null;

function getBoardRows(){ return gameMode==="race"?13:9; }
function getBoardCols(){ return 9; }
function getGoalRow(player){
  if(gameMode==="race") return 0;
  return player==="me"?0:8;
}
function getDefaultWalls(){ 
  return gameMode==="duel" ? 10 : raceWallsSetting; 
}

function initialState(){
  const rows=getBoardRows();
  const initWalls=getDefaultWalls();
  
  let mePos, oppPos;
  if(gameMode==="race"){
    const myCol = (raceSideSetting === "right" ? 6 : 2);
    const oppCol = (raceSideSetting === "right" ? 2 : 6);
    mePos={r:rows-1, c:myCol, walls:initWalls};
    oppPos={r:rows-1, c:oppCol, walls:initWalls};
  } else {
    mePos={r:8, c:4, walls:initWalls};
    oppPos={r:0, c:4, walls:initWalls};
  }

  return {
    turn: firstTurnSetting,
    gameOver:false,
    me:mePos,
    opp:oppPos,
    walls:new Set()
  };
}

function wallKey(r,c,o){return r+","+c+","+o}
function cellKey(r,c){return r+","+c}
function cloneState(){
  return {
    turn:state.turn,gameOver:state.gameOver,
    me:{...state.me},opp:{...state.opp},
    walls:new Set(state.walls)
  };
}
function save(){history.push(cloneState());if(history.length>100)history.shift()}
function restore(s){
  state={turn:s.turn,gameOver:s.gameOver,me:{...s.me},opp:{...s.opp},walls:new Set(s.walls)};
  engineMove=null;selectedWall=null;
  render(true);
  computeEngine();
}
function inBoard(r,c){
  const rows=getBoardRows();
  return r>=0 && r<rows && c>=0 && c<9;
}

function edgeBlocked(a,b,walls=state.walls){
  const dr=b.r-a.r,dc=b.c-a.c;
  if(dr===0&&Math.abs(dc)===1){
    const c=Math.min(a.c,b.c);
    return walls.has(wallKey(a.r,c,"v"))||walls.has(wallKey(a.r-1,c,"v"));
  }
  if(dc===0&&Math.abs(dr)===1){
    const r=Math.min(a.r,b.r);
    return walls.has(wallKey(r,a.c,"h"))||walls.has(wallKey(r,a.c-1,"h"));
  }
  return true;
}

function rawNeighbors(pos,walls=state.walls){
  const out=[];
  for(let i=0;i<4;i++){
    const nr=pos.r+dirs[i][0], nc=pos.c+dirs[i][1];
    if(inBoard(nr,nc)){
      const n={r:nr,c:nc};
      if(!edgeBlocked(pos,n,walls)) out.push(n);
    }
  }
  return out;
}

function legalMoves(player, walls=state.walls, pos=null, otherPos=null){
  const me=pos||state[player];
  const other=otherPos||state[player==="me"?"opp":"me"];
  const out=[];
  const neigh=rawNeighbors(me, walls);
  for(let i=0;i<neigh.length;i++){
    const n=neigh[i];
    if(n.r===other.r&&n.c===other.c){
      const dr=n.r-me.r,dc=n.c-me.c;
      const jump={r:other.r+dr,c:other.c+dc};
      if(inBoard(jump.r,jump.c)&&!edgeBlocked(other,jump,walls)){
        out.push(jump);
      }else{
        const sides=[{r:other.r+dc,c:other.c-dr},{r:other.r-dc,c:other.c+dr}];
        for(let j=0;j<sides.length;j++){
          const x=sides[j];
          if(inBoard(x.r,x.c)&&!edgeBlocked(other,x,walls))out.push(x);
        }
      }
    }else out.push(n);
  }
  return out;
}

const maxCells=9*13;
const qArr=new Int32Array(maxCells);
const distArr=new Int8Array(maxCells);

function shortestPath(player,walls=state.walls,start=null){
  const s=start||state[player], goalRow=getGoalRow(player);
  const rows=getBoardRows(), totalCells=rows*9;
  if(s.r===goalRow)return 0;
  
  distArr.fill(-1, 0, totalCells);
  let head=0, tail=0;
  const startIdx=s.r*9+s.c;
  distArr[startIdx]=0;
  qArr[tail++]=startIdx;
  
  while(head<tail){
    const idx=qArr[head++];
    const r=(idx/9)|0, c=idx%9;
    const d=distArr[idx];
    if(r===goalRow) return d;
    
    for(let i=0;i<4;i++){
      const nr=r+dirs[i][0], nc=c+dirs[i][1];
      if(nr>=0 && nr<rows && nc>=0 && nc<9){
        const nIdx=nr*9+nc;
        if(distArr[nIdx]===-1){
          let blocked=false;
          if(dirs[i][0]===0){
            const minC=c<nc?c:nc;
            if(walls.has(wallKey(r,minC,"v"))||walls.has(wallKey(r-1,minC,"v"))) blocked=true;
          }else{
            const minR=r<nr?r:nr;
            if(walls.has(wallKey(minR,c,"h"))||walls.has(wallKey(minR,c-1,"h"))) blocked=true;
          }
          if(!blocked){
            distArr[nIdx]=d+1;
            qArr[tail++]=nIdx;
          }
        }
      }
    }
  }
  return Infinity;
}

function getPathsCount(player, walls=state.walls, start=null){
  const s=start||state[player], goalRow=getGoalRow(player);
  const dist=shortestPath(player, walls, s);
  if(!isFinite(dist)) return 0;
  let count=0;
  const q=[{...s, d:0}];
  const visited=new Set();
  while(q.length){
    const cur=q.shift();
    if(cur.d>dist) continue;
    if(cur.r===goalRow){ count++; continue; }
    for(let i=0;i<4;i++){
      const nr=cur.r+dirs[i][0], nc=cur.c+dirs[i][1];
      if(inBoard(nr,nc)){
        const n={r:nr,c:nc};
        if(!edgeBlocked(cur,n,walls)){
          const k=nr+","+nc+","+cur.d;
          if(!visited.has(k)){
            visited.add(k);
            q.push({r:nr, c:nc, d:cur.d+1});
          }
        }
      }
    }
  }
  return count;
}

function legalWall(r,c,o,walls=state.walls){
  const maxR = getBoardRows() - 2;
  if(r<0||r>maxR||c<0||c>7) return false;
  const k=wallKey(r,c,o);
  if(walls.has(k)) return false;
  
  if(o==="h"){
    if(walls.has(wallKey(r,c,"v"))) return false;
    if(walls.has(wallKey(r,c-1,"h")) || walls.has(wallKey(r,c+1,"h"))) return false;
  }else{
    if(walls.has(wallKey(r,c,"h"))) return false;
    if(walls.has(wallKey(r-1,c,"v")) || walls.has(wallKey(r+1,c,"v"))) return false;
  }
  
  const copy=new Set(walls);
  copy.add(k);
  return shortestPath("me",copy)!==Infinity && shortestPath("opp",copy)!==Infinity;
}

function allValidWalls(walls=state.walls){
  const a=[];
  const maxR = getBoardRows() - 2;
  for(let r=0;r<=maxR;r++)for(let c=0;c<8;c++)for(const o of ["h","v"]){
    if(legalWall(r,c,o,walls)) a.push({r,c,o});
  }
  return a;
}

function evaluateState(player, walls, pPos, oppPos, pWalls, oppWalls){
  const enemy=player==="me"?"opp":"me";
  const myDist=shortestPath(player, walls, pPos);
  const oppDist=shortestPath(enemy, walls, oppPos);
  
  if(myDist===0) return 999999;
  if(oppDist===0) return -999999;
  if(!isFinite(myDist)) return -999999;
  if(!isFinite(oppDist)) return 999999;

  const myPaths=getPathsCount(player, walls, pPos);
  const oppPaths=getPathsCount(enemy, walls, oppPos);

  const myCenter=(4-Math.abs(pPos.c-4))*0.8;
  const oppCenter=(4-Math.abs(oppPos.c-4))*0.8;

  return (oppDist - myDist) * 100 
       + (pWalls - oppWalls) * 8
       + (oppPaths <= 1 ? 15 : 0)
       - (myPaths <= 1 ? 25 : 0)
       + (myCenter - oppCenter);
}

function calculateBestMove(player){
  const enemy=player==="me"?"opp":"me";
  const currentMyDist=shortestPath(player);
  const currentOppDist=shortestPath(enemy);
  if(!isFinite(currentMyDist)||!isFinite(currentOppDist)) return null;

  const steps=legalMoves(player);
  for(const step of steps){
    if(shortestPath(player, state.walls, step)===0){
      return {type:"step", r:step.r, c:step.c};
    }
  }

  let candidateActions=[];
  for(const step of steps){
    candidateActions.push({type:"step", r:step.r, c:step.c});
  }

  if(state[player].walls>0){
    const validWalls=allValidWalls(state.walls);
    const scoredWalls=[];
    for(const w of validWalls){
      const copy=new Set(state.walls);
      copy.add(wallKey(w.r,w.c,w.o));
      const oppD=shortestPath(enemy, copy);
      const myD=shortestPath(player, copy);
      if(!isFinite(oppD)||!isFinite(myD)) continue;
      
      const gain=(oppD - currentOppDist)*15 - (myD - currentMyDist)*18;
      const prox=10 - (Math.abs(w.r - state[enemy].r) + Math.abs(w.c - state[enemy].c));
      scoredWalls.push({type:"wall", r:w.r, c:w.c, o:w.o, quick:gain + prox*0.5});
    }
    scoredWalls.sort((a,b)=>b.quick-a.quick);
    candidateActions=candidateActions.concat(scoredWalls.slice(0, 16));
  }

  let bestScore=-Infinity;
  let bestAction=null;

  for(const action of candidateActions){
    let nextWalls=new Set(state.walls);
    let nextPPos={...state[player]};
    let nextPWalls=state[player].walls;
    let nextOppWalls=state[enemy].walls;

    if(action.type==="step"){
      nextPPos={r:action.r, c:action.c};
    } else {
      nextWalls.add(wallKey(action.r, action.c, action.o));
      nextPWalls--;
    }

    const oppSteps=legalMoves(enemy, nextWalls, state[enemy], nextPPos);
    let worstReplyScore=Infinity;

    for(const oppStep of oppSteps){
      const s=evaluateState(player, nextWalls, nextPPos, oppStep, nextPWalls, nextOppWalls);
      if(s < worstReplyScore) worstReplyScore=s;
    }

    if(nextOppWalls>0){
      const oppWalls=allValidWalls(nextWalls);
      let checked=0;
      for(const ow of oppWalls){
        if(Math.abs(ow.r - nextPPos.r)<=2 && Math.abs(ow.c - nextPPos.c)<=2){
          const copy2=new Set(nextWalls);
          copy2.add(wallKey(ow.r, ow.c, ow.o));
          const s=evaluateState(player, copy2, nextPPos, state[enemy], nextPWalls, nextOppWalls-1);
          if(s < worstReplyScore) worstReplyScore=s;
          if(++checked > 8) break;
        }
      }
    }

    if(worstReplyScore > bestScore){
      bestScore=worstReplyScore;
      bestAction=action;
    }
  }

  return bestAction || candidateActions[0] || null;
}

function updateBoardLayout(){
  const frame=document.getElementById("boardFrame");
  const shell=document.getElementById("boardShell");
  if(!frame || !shell) return;
  
  const frameW = frame.clientWidth;
  const frameH = frame.clientHeight;
  if(frameW <= 0 || frameH <= 0) return;
  
  if(gameMode === "duel"){
    const size = Math.min(frameW, frameH);
    shell.style.width = size + "px";
    shell.style.height = size + "px";
  } else {
    let w = frameH * (9 / 13);
    let h = frameH;
    if(w > frameW){
      w = frameW;
      h = frameW * (13 / 9);
    }
    shell.style.width = w + "px";
    shell.style.height = h + "px";
  }
}

function wallPosition(r,c,o){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  const rows=getBoardRows();
  return {x:rect.width*(c+1)/9, y:rect.height*(r+1)/rows};
}

function cellCenterPosition(r,c){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  const rows=getBoardRows();
  return {x:rect.width*(c+0.5)/9, y:rect.height*(r+0.5)/rows};
}

function createWallPiece(r,c,o,extra=""){
  const el=document.createElement("div");
  el.className="wall-piece "+o+" "+extra;
  const p=wallPosition(r,c,o);
  el.style.left=p.x+"px";
  el.style.top=p.y+"px";
  
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  const rows=getBoardRows();
  if(o==="h"){
    el.style.width = (rect.width * (2/9) - 3.5) + "px";
  } else {
    el.style.height = (rect.height * (2/rows) - 3.5) + "px";
  }
  return el;
}

function updatePiecePositions(animate=true){
  const pMe=cellCenterPosition(state.me.r, state.me.c);
  const pOpp=cellCenterPosition(state.opp.r, state.opp.c);
  
  const elMe=document.getElementById("pieceMe");
  const elOpp=document.getElementById("pieceOpp");
  
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  const rows=getBoardRows();
  const pieceSize = Math.min(rect.width/9, rect.height/rows) * 0.58;
  
  if(elMe){ 
    if(!animate){ elMe.style.transition="none"; }
    elMe.style.width = pieceSize + "px";
    elMe.style.height = pieceSize + "px";
    elMe.style.left=pMe.x+"px"; elMe.style.top=pMe.y+"px";
    if(!animate){ requestAnimationFrame(()=>{ elMe.style.transition=""; }); }
  }
  if(elOpp){ 
    if(!animate){ elOpp.style.transition="none"; }
    elOpp.style.width = pieceSize + "px";
    elOpp.style.height = pieceSize + "px";
    elOpp.style.left=pOpp.x+"px"; elOpp.style.top=pOpp.y+"px";
    if(!animate){ requestAnimationFrame(()=>{ elOpp.style.transition=""; }); }
  }
}

let currentRenderedRows = -1;
function buildGridDOM(){
  const grid=document.getElementById("boardGrid");
  const rows=getBoardRows();
  if(currentRenderedRows === rows) return;
  
  currentRenderedRows = rows;
  grid.innerHTML="";
  grid.style.gridTemplateColumns = "repeat(9, 1fr)";
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  
  for(let r=0;r<rows;r++)for(let c=0;c<9;c++){
    const cell=document.createElement("div");
    cell.className="cell";
    if(c===8) cell.style.borderRight="0";
    if(r===rows-1) cell.style.borderBottom="0";
    cell.dataset.r=r;
    cell.dataset.c=c;
    cell.addEventListener("click",()=>onCell(r,c));
    grid.appendChild(cell);
  }
}

function render(animatePieces=true){
  updateBoardLayout();
  buildGridDOM();
  
  const grid=document.getElementById("boardGrid");
  const layer=document.getElementById("wallLayer");
  layer.innerHTML="";
  
  const rows=getBoardRows();
  const legal=state.gameOver?[]:legalMoves(state.turn);
  const isMyTurn = (state.turn === "me");
  
  const cells=grid.children;
  for(let i=0; i<cells.length; i++){
    const cell=cells[i];
    const r=+cell.dataset.r, c=+cell.dataset.c;
    
    const isLegal = legal.some(p=>p.r===r&&p.c===c);
    const isEngine = (isMyTurn && engineMove?.type==="step" && engineMove.r===r && engineMove.c===c);
    
    cell.classList.toggle("legal", isLegal);
    cell.classList.toggle("engine", isEngine);
  }
  
  updatePiecePositions(animatePieces);

  for(const k of state.walls){
    const [r,c,o]=k.split(",");
    layer.appendChild(createWallPiece(+r,+c,o));
  }
  if(isMyTurn && engineMove?.type==="wall"){
    layer.appendChild(createWallPiece(engineMove.r,engineMove.c,engineMove.o,"engine"));
  }
  updateUI();
}

function updateUI(){
  document.getElementById("meWalls").textContent=state.me.walls;
  document.getElementById("oppWalls").textContent=state.opp.walls;
  document.getElementById("dockCount").textContent=state[state.turn].walls;
  
  const pMeEl=document.getElementById("pMe");
  const pOppEl=document.getElementById("pOpp");
  
  pMeEl.classList.toggle("active", state.turn==="me");
  pOppEl.classList.toggle("active", state.turn==="opp");
  
  const glowBottom=document.getElementById("glowBottom");
  const glowTop=document.getElementById("glowTop");
  
  glowBottom.classList.toggle("active", state.turn==="me");
  glowTop.classList.toggle("active", state.turn==="opp");

  const firstTurnBadge=document.getElementById("firstTurnBadge");
  if(firstTurnBadge){
    firstTurnBadge.textContent = (firstTurnSetting==="me" ? "Ты" : "Противник");
    firstTurnBadge.className = "turn-badge " + (firstTurnSetting==="me" ? "me" : "opp");
  }

  // Кнопки гонки (позиция и стены) показываются ТОЛЬКО в режиме «Гонка»
  const posBtn=document.getElementById("racePosToggle");
  const posBadge=document.getElementById("racePosBadge");
  if(posBtn && posBadge){
    posBtn.style.display = (gameMode==="race" ? "flex" : "none");
    posBadge.textContent = (raceSideSetting === "right" ? "Справа" : "Слева");
  }

  const wallsBtn=document.getElementById("wallsToggle");
  const wallsBadge=document.getElementById("wallsBadge");
  if(wallsBtn && wallsBadge){
    wallsBtn.style.display = (gameMode==="race" ? "flex" : "none");
    wallsBadge.textContent = raceWallsSetting;
  }

  const modeLabel=document.getElementById("modeLabel");
  if(modeLabel) modeLabel.textContent = (gameMode==="race" ? "Гонка 9×13" : "Дуэль 9×9");
  
  const finishBar=document.getElementById("finishBar");
  if(finishBar) finishBar.classList.toggle("visible", gameMode==="race");

  const isMyTurn=(state.turn==="me");
  document.getElementById("apply").disabled=!(isMyTurn && engineMove && !state.gameOver);
  document.querySelectorAll(".wall-tool").forEach(b=>b.classList.toggle("active",b.dataset.orient===selectedWall));
}

function onCell(r,c){
  if(state.gameOver)return;
  if(legalMoves(state.turn).some(p=>p.r===r&&p.c===c)){
    save();state[state.turn].r=r;state[state.turn].c=c;playMoveSound();finishTurn();
  }
}

function placeWall(r,c,o){
  if(state.gameOver||state[state.turn].walls<=0||!legalWall(r,c,o))return false;
  save();state.walls.add(wallKey(r,c,o));state[state.turn].walls--;playWallSound();selectedWall=null;engineMove=null;finishTurn();return true;
}

function finishTurn(){
  const myGoal = getGoalRow("me");
  const oppGoal = getGoalRow("opp");
  const won = (state.me.r === myGoal) || (state.opp.r === oppGoal);
  
  if(won){
    state.gameOver=true;
    render(true);
    setTimeout(()=>alert(state.me.r===myGoal?"Ты победил!":"Противник победил!"),20);
    return;
  }
  state.turn=state.turn==="me"?"opp":"me";
  computeEngine();
}

function computeEngine(){
  if(state.gameOver){render(true);return}
  if(state.turn==="me"){
    engineMove=calculateBestMove(state.turn);
  } else {
    engineMove=null;
  }
  render(true);
}

function applyEngine(){
  if(!engineMove||state.gameOver||state.turn!=="me")return;
  save();
  if(engineMove.type==="step"){state[state.turn].r=engineMove.r;state[state.turn].c=engineMove.c;playMoveSound()}
  else{state.walls.add(wallKey(engineMove.r,engineMove.c,engineMove.o));state[state.turn].walls--;playWallSound()}
  engineMove=null;finishTurn();
}

document.getElementById("apply").onclick=applyEngine;

document.getElementById("undo").onclick=()=>{
  if(history.length)restore(history.pop());
};

document.getElementById("resign").onclick=()=>{
  if(confirm("Сбросить партию и начать заново?")){
    state=initialState();history=[];engineMove=null;selectedWall=null;computeEngine();
  }
};

function selectWall(o){selectedWall=selectedWall===o?null:o;render(true)}
document.getElementById("wallH").onclick=()=>selectWall("h");
document.getElementById("wallV").onclick=()=>selectWall("v");

function isPointerInsideBoard(pnt){
  const rect=document.getElementById("boardShell").getBoundingClientRect();
  return pnt.x >= rect.left - 15 && 
         pnt.x <= rect.right + 15 && 
         pnt.y >= rect.top - 15 && 
         pnt.y <= rect.bottom + 15;
}

function boardAnchorFromPointer(x,y,o){
  const rect=document.getElementById("boardShell").getBoundingClientRect();
  const rows=getBoardRows();
  const cellW=rect.width/9;
  const cellH=rect.height/rows;
  
  let col=Math.round((x-rect.left)/cellW)-1;
  let row=Math.round((y-rect.top)/cellH)-1;
  
  col=Math.max(0,Math.min(7,col));
  row=Math.max(0,Math.min(rows-2,row));
  return {r:row,c:col};
}

function dragPointer(x,y){
  return {x:x, y:y-65};
}

function updateGhost(x,y,o){
  const pnt=dragPointer(x,y);
  
  if(!isPointerInsideBoard(pnt)){
    if(ghostEl){ghostEl.remove(); ghostEl=null;}
    ghostAnchor=null;
    return;
  }

  const a=boardAnchorFromPointer(pnt.x,pnt.y,o);
  
  if(!ghostEl){
    ghostEl=createWallPiece(a.r,a.c,o,"ghost");
    document.getElementById("wallLayer").appendChild(ghostEl);
  }
  
  const p=wallPosition(a.r,a.c,o);
  ghostEl.style.left=p.x+"px";
  ghostEl.style.top=p.y+"px";
  ghostEl.className="wall-piece "+o+" ghost";
  
  const ok=state[state.turn].walls>0&&legalWall(a.r,a.c,o);
  if(!ok)ghostEl.classList.add("bad");
  ghostAnchor={...a,ok};
}

function endDrag(x,y){
  if(!dragging)return;
  const pnt=dragPointer(x,y);
  const inside=isPointerInsideBoard(pnt);
  
  dragging=false;
  if(ghostEl){ghostEl.remove();ghostEl=null}
  
  if(inside){
    const a=boardAnchorFromPointer(pnt.x,pnt.y,dragOrient);
    const ok=state[state.turn].walls>0&&legalWall(a.r,a.c,dragOrient);
    if(ok) placeWall(a.r,a.c,dragOrient);
  }
  
  ghostAnchor=null;
  dragOrient=null;
  selectedWall=null;
  render(true);
}

function bindWallDrag(btn){
  btn.addEventListener("pointerdown",e=>{
    if(state.gameOver||state[state.turn].walls<=0)return;
    dragging=true;dragOrient=btn.dataset.orient;selectedWall=dragOrient;
    btn.setPointerCapture?.(e.pointerId);
    updateGhost(e.clientX,e.clientY,dragOrient);
    e.preventDefault();e.stopPropagation();
  });
  btn.addEventListener("pointermove",e=>{
    if(dragging)updateGhost(e.clientX,e.clientY,dragOrient);
  });
  btn.addEventListener("pointerup",e=>endDrag(e.clientX,e.clientY));
  btn.addEventListener("pointercancel",()=>endDrag(0,0));
}
bindWallDrag(document.getElementById("wallH"));
bindWallDrag(document.getElementById("wallV"));

document.getElementById("boardShell").addEventListener("pointermove",e=>{
  if(dragging)updateGhost(e.clientX,e.clientY,dragOrient);
});
document.getElementById("boardShell").addEventListener("pointerup",e=>{if(dragging)endDrag(e.clientX,e.clientY)});

document.getElementById("boardShell").addEventListener("click",e=>{
  if(dragging||!selectedWall)return;
  const a=boardAnchorFromPointer(e.clientX,e.clientY,selectedWall);
  if(legalWall(a.r,a.c,selectedWall))placeWall(a.r,a.c,selectedWall);
});

function sfx(freq,dur,type="sine",vol=.035){
  if(!soundOn)return;
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(vol,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
  }catch(e){}
}

  if (!uid || !exp || !sign) {

      uid = cached.uid;
      exp = parseInt(cached.exp, 10);

  const now = Math.floor(Date.now() / 1000);
  let isValid = false;

  if (uid && exp && sign && exp > now) {

      const encoder = new TextEncoder();

        "raw",
        encoder.encode(SECRET),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signatureBuffer = await crypto.subtle.sign(
        "HMAC",
        key,
        encoder.encode(`${uid}:${exp}`)
      );

        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
