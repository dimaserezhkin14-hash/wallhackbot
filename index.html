<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Wall Hack Bot - Quoridor AI</title>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-panel: #1e293b;
      --board-bg: #1e2538;
      --cell-bg: #2d3748;
      --cell-highlight: #3b82f6;
      --wall-slot: #334155;
      --wall-placed: #cbd5e1;
      --wall-hint: #22c55e;
      --p1-color: #3b82f6;
      --p2-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .badge-status {
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #1e293b;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-status::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .score-panel {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .player-card {
      flex: 1;
      background: var(--bg-panel);
      padding: 8px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .player-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
    }

    .player-dot.p1 { background: var(--p1-color); }
    .player-dot.p2 { background: var(--p2-color); }

    /* Доска Quoridor */
    .board-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1 / 1;
      background: var(--board-bg);
      padding: 10px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 6px;
      position: relative;
    }

    .cell {
      background: var(--cell-bg);
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cell.hint-move::after {
      content: "";
      width: 12px;
      height: 12px;
      background: var(--wall-hint);
      border-radius: 50%;
    }

    .pawn {
      width: 70%;
      height: 70%;
      border-radius: 50%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }

    .pawn.p1 { background: var(--p1-color); }
    .pawn.p2 { background: var(--p2-color); }

    /* Стенки */
    .wall {
      position: absolute;
      background: var(--wall-placed);
      border-radius: 3px;
      z-index: 10;
      pointer-events: none;
    }

    .wall.hint {
      background: var(--wall-hint);
      box-shadow: 0 0 8px var(--wall-hint);
    }

    /* Кнопки управления */
    .controls {
      width: 100%;
      max-width: 420px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .btn {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--bg-panel);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-apply {
      background: #2563eb;
    }

    .btn-apply:disabled {
      background: #334155;
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-weight: 700; font-size: 16px;">WALL HACK PRO</div>
    <div class="badge-status" id="engineStatus">Ищем ход</div>
  </div>

  <div class="score-panel">
    <div class="player-card">
      <div class="player-dot p1"></div>
      <div>Ты (Синий): <span id="p1Walls">10</span></div>
    </div>
    <div class="player-card">
      <div class="player-dot p2"></div>
      <div>Бот (Красный): <span id="p2Walls">10</span></div>
    </div>
  </div>

  <div class="board-container" id="board"></div>

  <div class="controls">
    <button class="btn btn-apply" id="applyBtn" disabled>✔ Применить совет</button>
    <button class="btn" id="resetBtn">↺ Сброс</button>
  </div>

  <script>
    const BOARD_SIZE = 9;
    const worker = new Worker('engine.worker.js');

    // Состояние матча
    const state = {
      p1: { x: 4, y: 8, walls: 10, targetRow: 0 },
      p2: { x: 4, y: 0, walls: 10, targetRow: 8 },
      placedWalls: [],
      suggestedMove: null,
      isThinking: false
    };

    const boardEl = document.getElementById('board');
    const applyBtn = document.getElementById('applyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const p1WallsEl = document.getElementById('p1Walls');
    const p2WallsEl = document.getElementById('p2Walls');
    const engineStatusEl = document.getElementById('engineStatus');

    // Инициализация сетки ячеек
    function createBoard() {
      boardEl.innerHTML = '';
      for (let y = 0; y < BOARD_SIZE; y++) {
        for (let x = 0; x < BOARD_SIZE; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.x = x;
          cell.dataset.y = y;
          boardEl.appendChild(cell);
        }
      }
    }

    // Отрисовка фишек и стенок
    function render() {
      p1WallsEl.textContent = state.p1.walls;
      p2WallsEl.textContent = state.p2.walls;

      // Очистка ячеек
      document.querySelectorAll('.cell').forEach(cell => {
        cell.innerHTML = '';
        cell.classList.remove('hint-move');
      });

      // Очистка стенок
      document.querySelectorAll('.wall').forEach(w => w.remove());

      // Пешки
      const p1Cell = document.querySelector(`.cell[data-x="${state.p1.x}"][data-y="${state.p1.y}"]`);
      if (p1Cell) p1Cell.innerHTML = '<div class="pawn p1"></div>';

      const p2Cell = document.querySelector(`.cell[data-x="${state.p2.x}"][data-y="${state.p2.y}"]`);
      if (p2Cell) p2Cell.innerHTML = '<div class="pawn p2"></div>';

      // Установленные стенки
      state.placedWalls.forEach(wall => drawWall(wall.x, wall.y, wall.orientation, false));

      // Подсказка хода
      if (state.suggestedMove) {
        applyBtn.disabled = false;
        if (state.suggestedMove.type === 'move') {
          const hintCell = document.querySelector(`.cell[data-x="${state.suggestedMove.x}"][data-y="${state.suggestedMove.y}"]`);
          if (hintCell) hintCell.classList.add('hint-move');
        } else if (state.suggestedMove.type === 'wall') {
          drawWall(state.suggestedMove.x, state.suggestedMove.y, state.suggestedMove.orientation, true);
        }
      } else {
        applyBtn.disabled = true;
      }
    }

    // Геометрический расчёт и отрисовка стенки в CSS
    function drawWall(x, y, orientation, isHint) {
      const wall = document.createElement('div');
      wall.className = `wall ${isHint ? 'hint' : ''}`;

      const cellSize = (boardEl.clientWidth - 20 - 48) / 9; // с учётом gap и padding
      const gap = 6;
      const step = cellSize + gap;

      const top = 10 + y * step + cellSize + 1;
      const left = 10 + x * step + cellSize + 1;

      if (orientation === 'H' || orientation === 0) {
        wall.style.top = `${top - 2}px`;
        wall.style.left = `${10 + x * step}px`;
        wall.style.width = `${cellSize * 2 + gap}px`;
        wall.style.height = `4px`;
      } else {
        wall.style.top = `${10 + y * step}px`;
        wall.style.left = `${left - 2}px`;
        wall.style.width = `4px`;
        wall.style.height = `${cellSize * 2 + gap}px`;
      }

      boardEl.appendChild(wall);
    }

    // Запуск расчёта хода движком
    function requestEngineMove() {
      state.isThinking = true;
      state.suggestedMove = null;
      applyBtn.disabled = true;
      engineStatusEl.textContent = 'Ищем ход...';

      worker.postMessage({
        player: state.p1,
        opponent: state.p2,
        placedWalls: state.placedWalls,
        maxTimeMs: 400
      });
    }

    // Ответ от воркера
    worker.onmessage = function (e) {
      state.isThinking = false;
      engineStatusEl.textContent = 'Ход готов';
      state.suggestedMove = e.data.bestMove;
      render();
    };

    // Применение подсказанного хода
    applyBtn.addEventListener('click', () => {
      const move = state.suggestedMove;
      if (!move) return;

      if (move.type === 'move') {
        state.p1.x = move.x;
        state.p1.y = move.y;
      } else if (move.type === 'wall' && state.p1.walls > 0) {
        state.placedWalls.push({ x: move.x, y: move.y, orientation: move.orientation });
        state.p1.walls--;
      }

      state.suggestedMove = null;
      render();

      // Автоматический пересчёт следующего шага
      setTimeout(requestEngineMove, 150);
    });

    // Сброс партии
    resetBtn.addEventListener('click', () => {
      state.p1 = { x: 4, y: 8, walls: 10, targetRow: 0 };
      state.p2 = { x: 4, y: 0, walls: 10, targetRow: 8 };
      state.placedWalls = [];
      state.suggestedMove = null;
      render();
      requestEngineMove();
    });

    // Старт
    createBoard();
    render();
    requestEngineMove();
  </script>
</body>
</html>
