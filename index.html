<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<title>WallRush Engine Pro</title>
<style>
:root{
  --bg:#0b111e;--panel:#151f32;--panel2:#1c2940;--text:#eef4ff;--muted:#8b9ab3;--line:#2b3a54;
  --blue:#347fff;--blueDeep:#2455a8;--red:#e33b50;--redDeep:#a92335;--green:#39e0a1;
  --board:#111a29;--boardLine:#34445c;--boardEdge:#26344b;--danger:#ff5667;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);overflow:hidden}
button{font:inherit;color:inherit;border:0}
.app{width:min(100%,680px);height:100dvh;margin:auto;padding:8px 0 8px;display:flex;flex-direction:column;overflow:hidden;gap:8px}
.top{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;min-height:42px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#3b86ff,#195bd4);box-shadow:0 7px 18px #1c61d055;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:7px}
.brand-mark i{background:#fff;border-radius:3px}
.brand-name{font-size:21px;font-weight:950;letter-spacing:-.5px}
.top-actions{display:flex;gap:6px;align-items:center}
.color-toggle{background:#1e2d47;border:1px solid #364867;color:#fff;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.25s ease}
.color-dot{width:11px;height:11px;border-radius:50%;transition:all .3s ease}
.color-dot.blue{background:#3b86ff;box-shadow:0 0 8px #3b86ff}
.color-dot.red{background:#e33b50;box-shadow:0 0 8px #e33b50}
.resign{background:#18243a;color:#fff;border-radius:12px;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer}

.players-wrap{position:relative;flex:0 0 auto}
.players{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;width:100%}
.player{
  height:54px;
  width:100%;
  min-width:0;
  background:var(--panel);
  border:2px solid transparent;
  border-radius:16px;
  padding:6px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  position:relative;
  transition:all .3s cubic-bezier(0.4, 0, 0.2, 1);
  user-select:none;
}

/* Dynamic player card themes based on myColor */
.player.is-blue{background:linear-gradient(135deg,#315b9e,#244780)}
.player.is-red{background:linear-gradient(135deg,#e14858,#bd263a)}
.player.is-blue.active{border-color:#9dbdff;box-shadow:0 0 0 3px #6f9cff33,0 8px 20px #276de344}
.player.is-red.active{border-color:#ff8792;box-shadow:0 0 0 3px #ff566733,0 8px 20px #d72d3c44}

.player .ball{width:32px;height:32px;border-radius:50%;flex:none;box-shadow:inset -7px -8px 11px #0008,inset 5px 5px 10px #fff8,0 5px 12px #0008;transition:all .35s ease}
.ball.blue{background:radial-gradient(circle at 30% 23%,#bcdcff,#4e91ff 42%,#1646a1)}
.ball.red{background:radial-gradient(circle at 30% 23%,#ffd0d4,#ff6370 42%,#a7192b)}
.ptext{min-width:0;flex:1 1 0;overflow:hidden}
.pname{font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:11px;margin-top:2px;color:#eaf1ff}
.wallcount{font-size:13px;font-weight:950}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#18243a;color:#8e9bb2;border-radius:9px;padding:4px 7px;font-weight:950;font-size:10px;pointer-events:none}

.board-frame{position:relative;padding:0;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:transparent}
.board-shell{position:relative;aspect-ratio:1;width:min(100%,calc(100dvh - 250px));max-height:100%;border-radius:20px;overflow:hidden;background:var(--board);box-shadow:inset 0 0 0 1px #26354c,0 10px 28px #0008}

/* Ultra smooth glow transitions at board edges (Bottom = Me, Top = Opponent) */
.glow-edge{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity .45s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-edge.bottom-glow{
  box-shadow:inset 0 -10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.bottom-glow.blue-glow{
  background:linear-gradient(to top, rgba(57, 135, 255, 0.32) 0%, rgba(57, 135, 255, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 -10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.bottom-glow.red-glow{
  background:linear-gradient(to top, rgba(227, 59, 80, 0.32) 0%, rgba(227, 59, 80, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 -10px 24px rgba(227, 59, 80, 0.45);
}

.glow-edge.top-glow.blue-glow{
  background:linear-gradient(to bottom, rgba(57, 135, 255, 0.32) 0%, rgba(57, 135, 255, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.top-glow.red-glow{
  background:linear-gradient(to bottom, rgba(227, 59, 80, 0.32) 0%, rgba(227, 59, 80, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 10px 24px rgba(227, 59, 80, 0.45);
}
.glow-edge.active{
  opacity:1;
}

.board-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);z-index:1}
.cell{position:relative;border-right:1px solid #34445c;border-bottom:1px solid #34445c;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cell:nth-child(9n){border-right:0}.cell:nth-last-child(-n+9){border-bottom:0}
.cell.legal:after{content:"";width:12px;height:12px;border-radius:50%;background:#367ddd;box-shadow:0 0 12px #367ddd88;animation:dotFade .25s ease}
@keyframes dotFade{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}

.cell.engine{background:#39e0a11a!important;position:relative}
.cell.engine:before{content:"";position:absolute;inset:3px;border:2.5px solid #52e9b6;border-radius:9px;box-shadow:0 0 14px #39e0a1aa,inset 0 0 8px #39e0a133;animation:pulseBest 1.1s ease-in-out infinite;pointer-events:none}
.cell.engine:after{content:"BEST";position:absolute;right:3px;top:3px;color:#eafff7;background:#159b70;border-radius:5px;padding:2px 4px;font-size:7px;font-weight:950;letter-spacing:.5px;z-index:7}
@keyframes pulseBest{50%{transform:scale(.94);opacity:.72}}

/* Smooth dynamic piece transition layer */
.piece-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.board-piece{
  position:absolute;
  width:calc(100% / 9 * 0.56);
  height:calc(100% / 9 * 0.56);
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:inset -7px -8px 12px #0008,inset 5px 5px 10px #fff9,0 7px 14px #0009;
  transition:left .24s cubic-bezier(0.34, 1.3, 0.64, 1), top .24s cubic-bezier(0.34, 1.3, 0.64, 1), background .3s ease;
}
.board-piece.blue{background:radial-gradient(circle at 29% 22%,#d5e9ff,#3987ff 45%,#174ba9)!important}
.board-piece.red{background:radial-gradient(circle at 29% 22%,#ffd9dc,#e84859 45%,#9e1729)!important}

.wall-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.wall-piece{
  position:absolute;
  border-radius:6px;
  background:linear-gradient(180deg,#485a79,#202d47);
  border:2px solid #6f81a0;
  box-shadow:0 5px 12px #1c294955,inset 2px 2px 3px #fff3;
  pointer-events:none;
  animation:wallDrop .22s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes wallDrop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.wall-piece.h{height:11px;width:calc(22.2222% - 4px);transform:translate(-50%,-50%)}
.wall-piece.v{width:11px;height:calc(22.2222% - 4px);transform:translate(-50%,-50%)}
.wall-piece.engine{background:linear-gradient(180deg,#58efb9,#168e67)!important;border-color:#9dffe0!important;box-shadow:0 0 17px #39e0a1cc,0 5px 12px #0005!important;z-index:15}
.wall-piece.ghost{opacity:.95;border-style:dashed;filter:drop-shadow(0 10px 10px #0009);z-index:20;animation:none}
.wall-piece.ghost.bad{background:linear-gradient(180deg,#ff6b79,#9e1f31)!important;border-color:#ffadb5!important;box-shadow:0 0 16px #ff5364aa!important}

.bottom-container{
  display:flex;
  flex-direction:column;
  gap:10px;
  flex:0 0 auto;
  margin-top:auto;
}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.apply{height:46px;border-radius:15px;background:linear-gradient(135deg,#3c86ff,#285bc6);color:#fff;font-weight:950;font-size:14px;box-shadow:0 6px 16px #2768dd33;cursor:pointer;transition:transform .12s,filter .12s}
.apply:active{transform:scale(0.98)}
.apply:disabled{opacity:.32;filter:grayscale(.7);box-shadow:none;cursor:default}
.undo{height:46px;border-radius:15px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:14px;cursor:pointer;transition:transform .12s}
.undo:active{transform:scale(0.98)}

.dock{background:#121c2b;color:#dbe5f5;border-radius:16px;padding:8px 10px;display:grid;grid-template-columns:50px 1fr 1fr;gap:8px;border:1px solid #24344c;width:100%;touch-action:none}
.dock-count{display:flex;align-items:center;justify-content:center;gap:5px;font-weight:950;font-size:15px}
.wall-tool{
  height:46px;
  border-radius:13px;
  background:#18243a;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  touch-action:none;
  transition:all .15s;
}
.wall-tool.active{box-shadow:0 0 0 2px #39e0a166;color:#5ee9b8}
.wall-tool:active{cursor:grabbing}

.wall-icon{
  display:block;
  background:linear-gradient(180deg,#5a6e91,#283857);
  border:1px solid #8295b7;
  border-radius:3px;
  box-shadow:0 2px 5px #0004;
}
.wall-tool[data-orient="h"] .wall-icon{
  width:26px;
  height:8px;
}
.wall-tool[data-orient="v"] .wall-icon{
  width:8px;
  height:26px;
}

.settings{
  width:100%;
  height:48px;
  border-radius:15px;
  background:#18243a;
  color:#fff;
  border:1px solid #2a3b55;
  box-shadow:0 5px 14px #0005;
  font-weight:950;
  font-size:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:pointer;
  transition:transform .12s;
}
.settings:active{transform:scale(0.99)}
.settings span{font-size:18px}

.modal{position:fixed;inset:0;z-index:100;background:#050a14dd;backdrop-filter:blur(12px);display:none;padding:16px}
.modal.open{display:flex}.modal-card{width:min(100%,520px);margin:auto;min-height:48vh;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0009}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.modal-head h2{margin:0}.close{width:38px;height:38px;border-radius:11px;background:var(--panel2);font-size:24px;cursor:pointer}
.setting{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:3px}
.switch{width:52px;height:29px;border-radius:18px;background:#41516c;padding:3px;cursor:pointer}.switch i{display:block;width:23px;height:23px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(23px)}
.theme{display:flex;gap:7px}.theme button{padding:8px 12px;border-radius:10px;background:var(--panel2);font-size:12px;cursor:pointer}.theme button.active{outline:2px solid var(--blue)}

.author-box{
  margin-top:auto;
  padding-top:20px;
  text-align:center;
  font-size:15px;
  font-weight:800;
  color:#9eb1d1;
  letter-spacing:.3px;
}
.author-box a{color:#52a5ff;text-decoration:none}
.author-box a:hover{text-decoration:underline}

.light{--board:#eef1f7;--boardLine:#b8c0d0;--boardEdge:#aab5ca;--bg:#edf1f8;--panel:#fff;--panel2:#edf1f7;--text:#1c2940;--muted:#78869e;--line:#d5ddea}
.light .cell{border-right-color:#c4cddc;border-bottom-color:#c4cddc}
.light .resign,.light .undo,.light .color-toggle{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .dock{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .wall-tool{background:#edf2f9;color:#1c2940}
.light .wall-icon{background:linear-gradient(180deg,#c8d4ec,#8da0c4);border-color:#a4b6d4}
.light .settings{background:#233554;color:#fff}
.light .author-box{color:#435574}

@media(max-width:480px){
  .app{padding:6px 0 6px;gap:6px}
  .player{height:50px;padding:5px 8px;border-radius:14px;gap:6px}
  .player .ball{width:28px;height:28px}
  .pname{font-size:11px}
  .board-shell{width:min(100%,calc(100dvh - 240px))}
  .bottom-container{gap:7px}
  .bottom-row{gap:7px}
  .apply,.undo{height:42px;font-size:13px}
  .wall-tool{height:42px}
  .dock{padding:6px 8px;gap:6px}
  .settings{height:44px;font-size:13px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="brand-mark"><i></i><i></i><i></i><i></i></div><div class="brand-name">WALLHACK</div></div>
    <div class="top-actions">
      <button class="color-toggle" id="colorToggle" title="Сменить цвет">
        <span>Цвет:</span>
        <i class="color-dot blue" id="myColorDot"></i>
      </button>
      <button class="resign" id="resign">↻ Сбросить</button>
    </div>
  </header>

  <div class="players-wrap">
    <div class="players">
      <!-- Player 1: ALWAYS YOU (Bottom Side) -->
      <div class="player bottom-p is-blue active" id="pMe">
        <div class="ball blue" id="ballMe"></div>
        <div class="ptext">
          <div class="pname" id="pMeName">Ты (Синий)</div>
          <div class="pmeta"><span class="wallcount" id="meWalls">10</span> 🧱</div>
        </div>
      </div>
      <!-- Player 2: ALWAYS OPPONENT (Top Side) -->
      <div class="player top-p is-red" id="pOpp">
        <div class="ball red" id="ballOpp"></div>
        <div class="ptext">
          <div class="pname" id="pOppName">Противник (Красный)</div>
          <div class="pmeta"><span class="wallcount" id="oppWalls">10</span> 🧱</div>
        </div>
      </div>
    </div>
    <div class="vs">VS</div>
  </div>

  <main class="board-frame">
    <div class="board-shell" id="boardShell">
      <div class="glow-edge bottom-glow blue-glow active" id="glowBottom"></div>
      <div class="glow-edge top-glow red-glow" id="glowTop"></div>
      <div class="board-grid" id="boardGrid"></div>
      <div class="piece-layer" id="pieceLayer">
        <div class="board-piece blue" id="pieceMe"></div>
        <div class="board-piece red" id="pieceOpp"></div>
      </div>
      <div class="wall-layer" id="wallLayer"></div>
    </div>
  </main>

  <div class="bottom-container">
    <div class="bottom-row">
      <button class="apply" id="apply" disabled>✓ Применить совет</button>
      <button class="undo" id="undo">↩ Назад</button>
    </div>
    
    <section class="dock">
      <div class="dock-count"><span>🧱</span><span id="dockCount">10</span></div>
      <button class="wall-tool" data-orient="h" id="wallH" aria-label="Горизонтальная стена"><i class="wall-icon"></i></button>
      <button class="wall-tool" data-orient="v" id="wallV" aria-label="Вертикальная стена"><i class="wall-icon"></i></button>
    </section>
    
    <button class="settings" id="settings"><span>⚙</span> Настройки</button>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head"><h2>Настройки</h2><button class="close" id="close">×</button></div>
    <div class="setting">
      <div><b>Тема</b><small>Оформление движка</small></div>
      <div class="theme"><button id="darkBtn">Тёмная</button><button id="lightBtn">Светлая</button></div>
    </div>
    <div class="setting">
      <div><b>Звуковые эффекты</b><small>Ход и установка стены</small></div>
      <button class="switch on" id="soundSwitch"><i></i></button>
    </div>
    <div class="author-box">автор: <a href="https://t.me/qufpx" target="_blank" rel="noopener">@qufpx</a></div>
  </div>
</div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
"use strict";

const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor("#0b111e");tg.setBackgroundColor("#0b111e");tg.enableClosingConfirmation()}catch(e){}
}

const SIZE=9;
const dirs=[[-1,0],[1,0],[0,-1],[0,1]];
let state,history=[],engineMove=null,selectedWall=null,soundOn=true,theme="dark";
// myColor = 'blue' or 'red'. 
// YOU are always "me" (bottom side, row 8, goal row 0). 
// OPPONENT is always "opp" (top side, row 0, goal row 8).
// The BLUE piece ALWAYS makes Turn 1!
let myColor="blue"; 
let audio=null,dragging=false,dragOrient=null,ghostEl=null,ghostAnchor=null;

function initialState(){
  return {
    turn: (myColor==="blue" ? "me" : "opp"), // Синий цвет всегда ходит первым!
    gameOver:false,
    me:{r:8,c:4,walls:10},
    opp:{r:0,c:4,walls:10},
    walls:new Set()
  };
}
function wallKey(r,c,o){return r+","+c+","+o}
function cellKey(r,c){return r+","+c}
function cloneState(){
  return {
    turn:state.turn,gameOver:state.gameOver,
    me:{...state.me},opp:{...state.opp},
    walls:new Set(state.walls)
  };
}
function save(){history.push(cloneState());if(history.length>100)history.shift()}
function restore(s){
  state={turn:s.turn,gameOver:s.gameOver,me:{...s.me},opp:{...s.opp},walls:new Set(s.walls)};
  engineMove=null;selectedWall=null;
  computeEngine();
}
function inBoard(r,c){return r>=0&&r<9&&c>=0&&c<9}

function edgeBlocked(a,b,walls=state.walls){
  const dr=b.r-a.r,dc=b.c-a.c;
  if(dr===0&&Math.abs(dc)===1){
    const c=Math.min(a.c,b.c);
    return walls.has(wallKey(a.r,c,"v"))||walls.has(wallKey(a.r-1,c,"v"));
  }
  if(dc===0&&Math.abs(dr)===1){
    const r=Math.min(a.r,b.r);
    return walls.has(wallKey(r,a.c,"h"))||walls.has(wallKey(r,a.c-1,"h"));
  }
  return true;
}

function rawNeighbors(pos,walls=state.walls){
  const out=[];
  for(let i=0;i<4;i++){
    const dr=dirs[i][0], dc=dirs[i][1];
    const nr=pos.r+dr, nc=pos.c+dc;
    if(nr>=0&&nr<9&&nc>=0&&nc<9){
      const n={r:nr,c:nc};
      if(!edgeBlocked(pos,n,walls)) out.push(n);
    }
  }
  return out;
}

function legalMoves(player, walls=state.walls, pos=null, otherPos=null){
  const me=pos||state[player];
  const other=otherPos||state[player==="me"?"opp":"me"];
  const out=[];
  const neigh=rawNeighbors(me, walls);
  for(let i=0;i<neigh.length;i++){
    const n=neigh[i];
    if(n.r===other.r&&n.c===other.c){
      const dr=n.r-me.r,dc=n.c-me.c;
      const jump={r:other.r+dr,c:other.c+dc};
      if(inBoard(jump.r,jump.c)&&!edgeBlocked(other,jump,walls)){
        out.push(jump);
      }else{
        const sides=[{r:other.r+dc,c:other.c-dr},{r:other.r-dc,c:other.c+dr}];
        for(let j=0;j<sides.length;j++){
          const x=sides[j];
          if(inBoard(x.r,x.c)&&!edgeBlocked(other,x,walls))out.push(x);
        }
      }
    }else out.push(n);
  }
  return out;
}

// Ultra Fast BFS
const qArr=new Int32Array(81);
const distArr=new Int8Array(81);
function shortestPath(player,walls=state.walls,start=null){
  const s=start||state[player], goalRow=player==="me"?0:8;
  if(s.r===goalRow)return 0;
  
  distArr.fill(-1);
  let head=0, tail=0;
  const startIdx=s.r*9+s.c;
  distArr[startIdx]=0;
  qArr[tail++]=startIdx;
  
  while(head<tail){
    const idx=qArr[head++];
    const r=(idx/9)|0, c=idx%9;
    const d=distArr[idx];
    if(r===goalRow) return d;
    
    for(let i=0;i<4;i++){
      const nr=r+dirs[i][0], nc=c+dirs[i][1];
      if(nr>=0&&nr<9&&nc>=0&&nc<9){
        const nIdx=nr*9+nc;
        if(distArr[nIdx]===-1){
          let blocked=false;
          if(dirs[i][0]===0){
            const minC=c<nc?c:nc;
            if(walls.has(wallKey(r,minC,"v"))||walls.has(wallKey(r-1,minC,"v"))) blocked=true;
          }else{
            const minR=r<nr?r:nr;
            if(walls.has(wallKey(minR,c,"h"))||walls.has(wallKey(minR,c-1,"h"))) blocked=true;
          }
          if(!blocked){
            distArr[nIdx]=d+1;
            qArr[tail++]=nIdx;
          }
        }
      }
    }
  }
  return Infinity;
}

function getPathsCount(player, walls=state.walls, start=null){
  const s=start||state[player], goalRow=player==="me"?0:8;
  const dist=shortestPath(player, walls, s);
  if(!isFinite(dist)) return 0;
  let count=0;
  const q=[{...s, d:0}];
  const visited=new Set();
  while(q.length){
    const cur=q.shift();
    if(cur.d>dist) continue;
    if(cur.r===goalRow){ count++; continue; }
    for(let i=0;i<4;i++){
      const nr=cur.r+dirs[i][0], nc=cur.c+dirs[i][1];
      if(inBoard(nr,nc)){
        const n={r:nr,c:nc};
        if(!edgeBlocked(cur,n,walls)){
          const k=nr+","+nc+","+cur.d;
          if(!visited.has(k)){
            visited.add(k);
            q.push({r:nr, c:nc, d:cur.d+1});
          }
        }
      }
    }
  }
  return count;
}

function legalWall(r,c,o,walls=state.walls){
  if(r<0||r>7||c<0||c>7)return false;
  const k=wallKey(r,c,o);
  if(walls.has(k))return false;
  
  if(o==="h"){
    if(walls.has(wallKey(r,c,"v")))return false;
    if(walls.has(wallKey(r,c-1,"h")) || walls.has(wallKey(r,c+1,"h"))) return false;
  }else{
    if(walls.has(wallKey(r,c,"h")))return false;
    if(walls.has(wallKey(r-1,c,"v")) || walls.has(wallKey(r+1,c,"v"))) return false;
  }
  
  const copy=new Set(walls);
  copy.add(k);
  return shortestPath("me",copy)!==Infinity&&shortestPath("opp",copy)!==Infinity;
}

function allValidWalls(walls=state.walls){
  const a=[];
  for(let r=0;r<8;r++)for(let c=0;c<8;c++)for(const o of ["h","v"]){
    if(legalWall(r,c,o,walls)) a.push({r,c,o});
  }
  return a;
}

function evaluateState(player, walls, pPos, oppPos, pWalls, oppWalls){
  const enemy=player==="me"?"opp":"me";
  const myDist=shortestPath(player, walls, pPos);
  const oppDist=shortestPath(enemy, walls, oppPos);
  
  if(myDist===0) return 999999;
  if(oppDist===0) return -999999;
  if(!isFinite(myDist)) return -999999;
  if(!isFinite(oppDist)) return 999999;

  const myPaths=getPathsCount(player, walls, pPos);
  const oppPaths=getPathsCount(enemy, walls, oppPos);

  const myCenter=(4-Math.abs(pPos.c-4))*0.8;
  const oppCenter=(4-Math.abs(oppPos.c-4))*0.8;

  return (oppDist - myDist) * 100 
       + (pWalls - oppWalls) * 8
       + (oppPaths <= 1 ? 15 : 0)
       - (myPaths <= 1 ? 25 : 0)
       + (myCenter - oppCenter);
}

function calculateBestMove(player){
  const enemy=player==="me"?"opp":"me";
  const currentMyDist=shortestPath(player);
  const currentOppDist=shortestPath(enemy);
  if(!isFinite(currentMyDist)||!isFinite(currentOppDist))return null;

  const steps=legalMoves(player);
  for(const step of steps){
    if(shortestPath(player, state.walls, step)===0){
      return {type:"step", r:step.r, c:step.c};
    }
  }

  let candidateActions=[];
  for(const step of steps){
    candidateActions.push({type:"step", r:step.r, c:step.c});
  }

  if(state[player].walls>0){
    const validWalls=allValidWalls(state.walls);
    const scoredWalls=[];
    for(const w of validWalls){
      const copy=new Set(state.walls);
      copy.add(wallKey(w.r,w.c,w.o));
      const oppD=shortestPath(enemy, copy);
      const myD=shortestPath(player, copy);
      if(!isFinite(oppD)||!isFinite(myD)) continue;
      
      const gain=(oppD - currentOppDist)*15 - (myD - currentMyDist)*18;
      const prox=10 - (Math.abs(w.r - state[enemy].r) + Math.abs(w.c - state[enemy].c));
      scoredWalls.push({type:"wall", r:w.r, c:w.c, o:w.o, quick:gain + prox*0.5});
    }
    scoredWalls.sort((a,b)=>b.quick-a.quick);
    candidateActions=candidateActions.concat(scoredWalls.slice(0, 16));
  }

  let bestScore=-Infinity;
  let bestAction=null;

  for(const action of candidateActions){
    let nextWalls=new Set(state.walls);
    let nextPPos={...state[player]};
    let nextPWalls=state[player].walls;
    let nextOppWalls=state[enemy].walls;

    if(action.type==="step"){
      nextPPos={r:action.r, c:action.c};
    } else {
      nextWalls.add(wallKey(action.r, action.c, action.o));
      nextPWalls--;
    }

    const oppSteps=legalMoves(enemy, nextWalls, state[enemy], nextPPos);
    let worstReplyScore=Infinity;

    for(const oppStep of oppSteps){
      const s=evaluateState(player, nextWalls, nextPPos, oppStep, nextPWalls, nextOppWalls);
      if(s < worstReplyScore) worstReplyScore=s;
    }

    if(nextOppWalls>0){
      const oppWalls=allValidWalls(nextWalls);
      let checked=0;
      for(const ow of oppWalls){
        if(Math.abs(ow.r - nextPPos.r)<=2 && Math.abs(ow.c - nextPPos.c)<=2){
          const copy2=new Set(nextWalls);
          copy2.add(wallKey(ow.r, ow.c, ow.o));
          const s=evaluateState(player, copy2, nextPPos, state[enemy], nextPWalls, nextOppWalls-1);
          if(s < worstReplyScore) worstReplyScore=s;
          if(++checked > 8) break;
        }
      }
    }

    if(worstReplyScore > bestScore){
      bestScore=worstReplyScore;
      bestAction=action;
    }
  }

  return bestAction || candidateActions[0] || null;
}

function wallPosition(r,c,o){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  return {x:rect.width*(c+1)/9,y:rect.height*(r+1)/9};
}

function cellCenterPosition(r,c){
  const shell=document.getElementById("boardShell"),rect=shell.getBoundingClientRect();
  return {x:rect.width*(c+0.5)/9, y:rect.height*(r+0.5)/9};
}

function createWallPiece(r,c,o,extra=""){
  const el=document.createElement("div");
  el.className="wall-piece "+o+" "+extra;
  const p=wallPosition(r,c,o);el.style.left=p.x+"px";el.style.top=p.y+"px";
  return el;
}

function updatePiecePositions(){
  const pMe=cellCenterPosition(state.me.r, state.me.c);
  const pOpp=cellCenterPosition(state.opp.r, state.opp.c);
  
  const elMe=document.getElementById("pieceMe");
  const elOpp=document.getElementById("pieceOpp");
  
  if(elMe){ 
    elMe.style.left=pMe.x+"px"; elMe.style.top=pMe.y+"px";
    elMe.className = "board-piece " + (myColor==="blue" ? "blue" : "red");
  }
  if(elOpp){ 
    elOpp.style.left=pOpp.x+"px"; elOpp.style.top=pOpp.y+"px";
    elOpp.className = "board-piece " + (myColor==="blue" ? "red" : "blue");
  }
}

function render(){
  const grid=document.getElementById("boardGrid"),layer=document.getElementById("wallLayer");
  grid.innerHTML="";layer.innerHTML="";
  const legal=state.gameOver?[]:legalMoves(state.turn);
  
  // Show engine hints ONLY on YOUR turn (state.turn === "me")
  const isMyTurn = (state.turn === "me");
  
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const cell=document.createElement("div");cell.className="cell";
    if(legal.some(p=>p.r===r&&p.c===c))cell.classList.add("legal");
    if(isMyTurn&&engineMove?.type==="step"&&engineMove.r===r&&engineMove.c===c){
      cell.classList.add("engine");
    }
    cell.dataset.r=r;cell.dataset.c=c;cell.addEventListener("click",()=>onCell(r,c));
    grid.appendChild(cell);
  }
  
  updatePiecePositions();

  for(const k of state.walls){
    const [r,c,o]=k.split(",");
    layer.appendChild(createWallPiece(+r,+c,o));
  }
  if(isMyTurn&&engineMove?.type==="wall"){
    layer.appendChild(createWallPiece(engineMove.r,engineMove.c,engineMove.o,"engine"));
  }
  updateUI();
}

function updateUI(){
  document.getElementById("meWalls").textContent=state.me.walls;
  document.getElementById("oppWalls").textContent=state.opp.walls;
  document.getElementById("dockCount").textContent=state[state.turn].walls;
  
  const pMeEl=document.getElementById("pMe");
  const pOppEl=document.getElementById("pOpp");
  
  pMeEl.classList.toggle("active", state.turn==="me");
  pOppEl.classList.toggle("active", state.turn==="opp");
  
  // Update card color themes
  pMeEl.className = "player bottom-p " + (myColor==="blue"?"is-blue":"is-red") + (state.turn==="me"?" active":"");
  pOppEl.className = "player top-p " + (myColor==="blue"?"is-red":"is-blue") + (state.turn==="opp"?" active":"");
  
  // Balls
  const ballMe=document.getElementById("ballMe");
  const ballOpp=document.getElementById("ballOpp");
  ballMe.className = "ball " + (myColor==="blue"?"blue":"red");
  ballOpp.className = "ball " + (myColor==="blue"?"red":"blue");

  // Names: "Противник" вместо "Соперник"
  document.getElementById("pMeName").textContent = myColor==="blue" ? "Ты (Синий)" : "Ты (Красный)";
  document.getElementById("pOppName").textContent = myColor==="blue" ? "Противник (Красный)" : "Противник (Синий)";
  
  // Glowing edge transitions
  const glowBottom=document.getElementById("glowBottom");
  const glowTop=document.getElementById("glowTop");
  
  glowBottom.className = "glow-edge bottom-glow " + (myColor==="blue"?"blue-glow":"red-glow") + (state.turn==="me"?" active":"");
  glowTop.className = "glow-edge top-glow " + (myColor==="blue"?"red-glow":"blue-glow") + (state.turn==="opp"?" active":"");

  // Color dot on button
  const dot=document.getElementById("myColorDot");
  if(dot) dot.className="color-dot "+myColor;

  const isMyTurn=(state.turn==="me");
  document.getElementById("apply").disabled=!(isMyTurn && engineMove && !state.gameOver);
  document.querySelectorAll(".wall-tool").forEach(b=>b.classList.toggle("active",b.dataset.orient===selectedWall));
}

function onCell(r,c){
  if(state.gameOver)return;
  if(legalMoves(state.turn).some(p=>p.r===r&&p.c===c)){
    save();state[state.turn].r=r;state[state.turn].c=c;playMoveSound();finishTurn();
  }
}

function placeWall(r,c,o){
  if(state.gameOver||state[state.turn].walls<=0||!legalWall(r,c,o))return false;
  save();state.walls.add(wallKey(r,c,o));state[state.turn].walls--;playWallSound();selectedWall=null;engineMove=null;finishTurn();return true;
}

function finishTurn(){
  const won=state.me.r===0||state.opp.r===8;
  if(won){
    state.gameOver=true;
    render();
    setTimeout(()=>alert(state.me.r===0?"Ты победил!":"Противник победил!"),20);
    return;
  }
  state.turn=state.turn==="me"?"opp":"me";
  computeEngine();
}

function computeEngine(){
  if(state.gameOver){render();return}
  // Only calculate advice when it is your turn
  if(state.turn==="me"){
    engineMove=calculateBestMove(state.turn);
  } else {
    engineMove=null;
  }
  render();
}

function applyEngine(){
  if(!engineMove||state.gameOver||state.turn!=="me")return;
  save();
  if(engineMove.type==="step"){state[state.turn].r=engineMove.r;state[state.turn].c=engineMove.c;playMoveSound()}
  else{state.walls.add(wallKey(engineMove.r,engineMove.c,engineMove.o));state[state.turn].walls--;playWallSound()}
  engineMove=null;finishTurn();
}

document.getElementById("apply").onclick=applyEngine;

document.getElementById("undo").onclick=()=>{
  if(history.length)restore(history.pop());
};

document.getElementById("resign").onclick=()=>{
  if(confirm("Сбросить партию и начать заново?")){
    state=initialState();history=[];engineMove=null;selectedWall=null;computeEngine();
  }
};

// Color toggle
document.getElementById("colorToggle").onclick=()=>{
  myColor = (myColor==="blue"?"red":"blue");
  try{localStorage.setItem("wr-mycolor",myColor)}catch(e){}
  
  state=initialState();
  history=[];
  engineMove=null;
  selectedWall=null;
  computeEngine();
};

function selectWall(o){selectedWall=selectedWall===o?null:o;render()}
document.getElementById("wallH").onclick=()=>selectWall("h");
document.getElementById("wallV").onclick=()=>selectWall("v");

function boardAnchorFromPointer(x,y,o){
  const rect=document.getElementById("boardShell").getBoundingClientRect();
  const cellW=rect.width/9;
  const cellH=rect.height/9;
  
  let col=Math.round((x-rect.left)/cellW)-1;
  let row=Math.round((y-rect.top)/cellH)-1;
  
  col=Math.max(0,Math.min(7,col));
  row=Math.max(0,Math.min(7,row));
  return {r:row,c:col};
}

function dragPointer(x,y){
  return {x:x, y:y-65};
}

function updateGhost(x,y,o){
  const pnt=dragPointer(x,y);
  const a=boardAnchorFromPointer(pnt.x,pnt.y,o);
  
  if(!ghostEl){
    ghostEl=createWallPiece(a.r,a.c,o,"ghost");
    document.getElementById("wallLayer").appendChild(ghostEl);
  }
  
  const p=wallPosition(a.r,a.c,o);
  ghostEl.style.left=p.x+"px";
  ghostEl.style.top=p.y+"px";
  ghostEl.className="wall-piece "+o+" ghost";
  
  const ok=state[state.turn].walls>0&&legalWall(a.r,a.c,o);
  if(!ok)ghostEl.classList.add("bad");
  ghostAnchor={...a,ok};
}

function endDrag(x,y){
  if(!dragging)return;
  const pnt=dragPointer(x,y);
  const a=boardAnchorFromPointer(pnt.x,pnt.y,dragOrient);
  const ok=state[state.turn].walls>0&&legalWall(a.r,a.c,dragOrient);
  
  dragging=false;
  if(ok)placeWall(a.r,a.c,dragOrient);
  if(ghostEl){ghostEl.remove();ghostEl=null}
  ghostAnchor=null;dragOrient=null;
}

function bindWallDrag(btn){
  btn.addEventListener("pointerdown",e=>{
    if(state.gameOver||state[state.turn].walls<=0)return;
    dragging=true;dragOrient=btn.dataset.orient;selectedWall=dragOrient;
    btn.setPointerCapture?.(e.pointerId);
    updateGhost(e.clientX,e.clientY,dragOrient);
    e.preventDefault();e.stopPropagation();
  });
  btn.addEventListener("pointermove",e=>{
    if(dragging)updateGhost(e.clientX,e.clientY,dragOrient);
  });
  btn.addEventListener("pointerup",e=>endDrag(e.clientX,e.clientY));
  btn.addEventListener("pointercancel",()=>endDrag(0,0));
}
bindWallDrag(document.getElementById("wallH"));
bindWallDrag(document.getElementById("wallV"));

document.getElementById("boardShell").addEventListener("pointermove",e=>{
  if(dragging)updateGhost(e.clientX,e.clientY,dragOrient);
});
document.getElementById("boardShell").addEventListener("pointerup",e=>{if(dragging)endDrag(e.clientX,e.clientY)});

document.getElementById("boardShell").addEventListener("click",e=>{
  if(dragging||!selectedWall)return;
  const a=boardAnchorFromPointer(e.clientX,e.clientY,selectedWall);
  if(legalWall(a.r,a.c,selectedWall))placeWall(a.r,a.c,selectedWall);
});

function sfx(freq,dur,type="sine",vol=.035){
  if(!soundOn)return;
  try{
    audio ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(vol,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
    o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);
  }catch(e){}
}
function playMoveSound(){sfx(430,.11,"sine",.035);setTimeout(()=>sfx(650,.08,"sine",.025),35)}
function playWallSound(){sfx(100,.07,"square",.03)}

const modal=document.getElementById("modal");
document.getElementById("settings").onclick=()=>modal.classList.add("open");
document.getElementById("close").onclick=()=>modal.classList.remove("open");
modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};

document.getElementById("soundSwitch").onclick=()=>{
  soundOn=!soundOn;
  document.getElementById("soundSwitch").classList.toggle("on",soundOn);
  try{localStorage.setItem("wr-sound",soundOn?"on":"off")}catch(e){}
};
function setTheme(t){
  theme=t;document.body.classList.toggle("light",t==="light");
  document.getElementById("darkBtn").classList.toggle("active",t==="dark");
  document.getElementById("lightBtn").classList.toggle("active",t==="light");
  try{localStorage.setItem("wr-theme",t)}catch(e){}
}
document.getElementById("darkBtn").onclick=()=>setTheme("dark");
document.getElementById("lightBtn").onclick=()=>setTheme("light");

window.addEventListener("resize", updatePiecePositions);

try{
  theme=localStorage.getItem("wr-theme")||"dark";
  soundOn=localStorage.getItem("wr-sound")!=="off";
  myColor=localStorage.getItem("wr-mycolor")||"blue";
}catch(e){}
setTheme(theme);
document.getElementById("soundSwitch").classList.toggle("on",soundOn);

state=initialState();
computeEngine();
</script>
