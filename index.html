<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<title>WallRush GrandMaster Engine — Fortress</title>
<style>
:root{
  --bg:#0b111e;--panel:#151f32;--panel2:#1c2940;--text:#eef4ff;--muted:#8b9ab3;--line:#2b3a54;
  --blue:#347fff;--blueDeep:#2455a8;--red:#e33b50;--redDeep:#a92335;--green:#39e0a1;
  --board:#111a29;--boardLine:#34445c;--boardEdge:#26344b;--danger:#ff5667;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;user-select:none}

#appBlocker{
  position:fixed;
  inset:0;
  z-index:999999;
  background:#0b111e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  font-family:Inter,system-ui,sans-serif;
  color:#fff;
}

.app{
  width:min(100%,680px);
  height:100dvh;
  margin:auto;
  padding:4px 0 4px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  gap:5px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 32px;
  height:32px;
  width:100%;
}
.brand{display:flex;align-items:center;gap:6px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#3b86ff,#195bd4);box-shadow:0 3px 8px #1c61d055;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.brand-mark i{background:#fff;border-radius:1.5px}
.brand-name{font-size:16px;font-weight:950;letter-spacing:-.4px}

.resign-btn{
  background:#261824;
  border:1px solid #5a2634;
  color:#ff7a88;
  border-radius:8px;
  padding:0 9px;
  height:28px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  transition:background .15s ease, transform .1s ease;
}
.resign-btn:active{background:#381c2b;transform:scale(0.97)}

.control-bar{
  display:grid;
  grid-template-columns:1.12fr 1fr 1.08fr;
  gap:6px;
  align-items:stretch;
  width:100%;
  flex:0 0 30px;
  height:30px;
}
.ctrl-btn{
  min-width:0;
  overflow:hidden;
  background:linear-gradient(180deg,#1b2941,#172238);
  border:1px solid #30435f;
  color:#eef4ff;
  border-radius:10px;
  height:30px;
  padding:0 8px;
  font-size:10.5px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  transition:background .15s ease, transform .1s ease, border-color .15s ease;
}
.ctrl-btn > span:first-child{opacity:.9}
.ctrl-btn:active{background:#233552;transform:scale(0.98)}
.control-bar.race-mode{
  grid-template-columns:1.12fr .88fr 1.02fr 1.04fr .82fr;
  gap:5px;
}
.control-bar.race-mode .ctrl-btn{
  font-size:9.6px;
  padding:0 5px;
  border-radius:9px;
}
.control-bar.race-mode .turn-badge{font-size:8.8px;padding:2px 5px}


.turn-badge{
  padding:2px 6px;
  border-radius:4px;
  font-size:9.5px;
  font-weight:950;
}
.turn-badge.me{background:#2768dd;color:#fff}
.turn-badge.opp{background:#bd263a;color:#fff}
.turn-badge.blue{background:#2768dd;color:#fff}
.turn-badge.red{background:#bd263a;color:#fff}

.finish-bar-wrap{
  flex:0 0 14px;
  height:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.finish-bar{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
}
.finish-bar.visible{
  display:flex;
  animation:popIn .25s ease;
}
.finish-line{
  flex:1;
  height:1.5px;
  background:#1e8e60;
  box-shadow:0 0 6px rgba(30, 142, 96, 0.4);
}
.finish-label{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:950;
  color:#1ebf7c;
  letter-spacing:3px;
}

.players-wrap{position:relative;flex:0 0 44px;height:44px}
.players{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;width:100%;height:100%}
.player{
  height:44px;
  width:100%;
  min-width:0;
  background:var(--panel);
  border:2px solid transparent;
  border-radius:12px;
  padding:3px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
  user-select:none;
  transition:border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.player.is-blue{background:linear-gradient(135deg,#315b9e,#244780)}
.player.is-red{background:linear-gradient(135deg,#e14858,#bd263a)}
.player.is-blue.active{border-color:#9dbdff;box-shadow:0 0 0 2.5px #6f9cff33,0 4px 12px #276de344}
.player.is-red.active{border-color:#ff8792;box-shadow:0 0 0 2.5px #ff566733,0 4px 12px #d72d3c44}

.player .ball{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -4px -5px 7px #0008,inset 3px 3px 6px #fff8,0 3px 8px #0008;transition:transform .2s ease}
.ball.blue{background:radial-gradient(circle at 30% 23%,#bcdcff,#4e91ff 42%,#1646a1)}
.ball.red{background:radial-gradient(circle at 30% 23%,#ffd0d4,#ff6370 42%,#a7192b)}
.ptext{min-width:0;flex:1 1 0;overflow:hidden}
.pname{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:10px;margin-top:1px;color:#eaf1ff}
.wallcount{font-size:11.5px;font-weight:950}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#18243a;color:#8e9bb2;border-radius:7px;padding:2px 5px;font-weight:950;font-size:8.5px;pointer-events:none}

.board-frame{
  position:relative;
  padding:0;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  overflow:hidden;
}

.thinking-pill{
  position:absolute;
  z-index:30;
  top:10px;
  left:50%;
  transform:translate(-50%,-8px) scale(.96);
  display:flex;
  align-items:center;
  gap:7px;
  min-height:29px;
  padding:0 11px;
  border:1px solid rgba(92,115,150,.5);
  border-radius:999px;
  background:rgba(15,25,42,.82);
  color:#d9e5f8;
  box-shadow:0 6px 22px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  font-size:10px;
  font-weight:850;
  letter-spacing:.1px;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease, transform .22s ease;
}
.thinking-pill.visible{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}
.thinking-dot{
  width:7px;height:7px;border-radius:50%;
  background:#65e7bd;
  box-shadow:0 0 0 0 rgba(57,224,161,.5);
  animation:thinkingPulse 1.4s ease-in-out infinite;
}
.thinking-dots{display:flex;gap:2px;align-items:center}
.thinking-dots i{
  width:3px;height:3px;border-radius:50%;background:#9eb0ca;
  animation:thinkingDot 1.1s ease-in-out infinite;
}
.thinking-dots i:nth-child(2){animation-delay:.15s}
.thinking-dots i:nth-child(3){animation-delay:.3s}
@keyframes thinkingPulse{
  0%,100%{transform:scale(.8);box-shadow:0 0 0 0 rgba(57,224,161,.45)}
  50%{transform:scale(1.15);box-shadow:0 0 0 5px rgba(57,224,161,0)}
}
@keyframes thinkingDot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}

.board-shell{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:var(--board);
  box-shadow:inset 0 0 0 1px #26354c,0 6px 20px #0008;
  flex:0 0 auto;
}

.board-shell.mode-race:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  border-top:3px solid #2ae48f;
  box-shadow:inset 0 1px 0 #46ffaa, 0 -1px 8px rgba(42, 228, 143, 0.4);
  background:linear-gradient(to bottom, rgba(30, 191, 124, 0.22) 0%, rgba(30, 191, 124, 0.07) 12%, transparent 26%);
  border-top-left-radius:16px;
  border-top-right-radius:16px;
}

.glow-edge{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity .35s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-edge.bottom-glow{
  background:linear-gradient(to top, rgba(57, 135, 255, 0.32) 0%, rgba(57, 135, 255, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 -10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.top-glow{
  background:linear-gradient(to bottom, rgba(227, 59, 80, 0.32) 0%, rgba(227, 59, 80, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 10px 24px rgba(227, 59, 80, 0.45);
}
.glow-edge.active{opacity:1}

.board-grid{
  position:absolute;
  inset:0;
  display:grid;
  z-index:1;
}
.cell{
  position:relative;
  border-right:1px solid #34445c;
  border-bottom:1px solid #34445c;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  touch-action:manipulation;
}
.cell.legal:after{
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:#367ddd;
  box-shadow:0 0 8px #367ddd88;
  animation:dotPop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes dotPop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}

.cell.engine{background:#39e0a11a!important;position:relative}
.cell.engine:before{content:"";position:absolute;inset:2px;border:2px solid #52e9b6;border-radius:6px;box-shadow:0 0 10px #39e0a1aa,inset 0 0 5px #39e0a133;animation:pulseBest 1.1s ease-in-out infinite;pointer-events:none}
.cell.engine:after{content:"BEST";position:absolute;right:2px;top:2px;color:#eafff7;background:#159b70;border-radius:3px;padding:1px 2.5px;font-size:5.5px;font-weight:950;letter-spacing:.4px;z-index:7}
@keyframes pulseBest{50%{transform:scale(.94);opacity:.72}}

.piece-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.board-piece{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:inset -4px -5px 8px #0008,inset 3px 3px 6px #fff9,0 5px 10px #0009;
  transition:left .22s cubic-bezier(0.34, 1.3, 0.64, 1), top .22s cubic-bezier(0.34, 1.3, 0.64, 1);
  will-change:left, top;
}
.board-piece.blue{background:radial-gradient(circle at 29% 22%,#d5e9ff,#3987ff 45%,#174ba9)!important}
.board-piece.red{background:radial-gradient(circle at 29% 22%,#ffd9dc,#e84859 45%,#9e1729)!important}

.wall-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.wall-piece{
  position:absolute;
  border-radius:4px;
  background:linear-gradient(180deg,#485a79,#202d47);
  border:1.5px solid #6f81a0;
  box-shadow:0 3px 8px #1c294955,inset 1px 1px 2px #fff3;
  pointer-events:none;
  animation:wallDrop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes wallDrop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.wall-piece.h{height:8px;transform:translate(-50%,-50%)}
.wall-piece.v{width:8px;transform:translate(-50%,-50%)}
.wall-piece.engine{background:linear-gradient(180deg,#58efb9,#168e67)!important;border-color:#9dffe0!important;box-shadow:0 0 12px #39e0a1cc,0 3px 8px #0005!important;z-index:15}
.wall-piece.ghost{opacity:.95;border-style:dashed;filter:drop-shadow(0 6px 6px #0009);z-index:20;animation:none}
.wall-piece.ghost.bad{background:linear-gradient(180deg,#ff6b79,#9e1f31)!important;border-color:#ffadb5!important;box-shadow:0 0 12px #ff5364aa!important}

.bottom-container{
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:0 0 auto;
}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.apply{height:40px;border-radius:12px;background:linear-gradient(135deg,#3c86ff,#285bc6);color:#fff;font-weight:950;font-size:12.5px;box-shadow:0 4px 12px #2768dd33;cursor:pointer;transition:transform .12s}
.apply:active{transform:scale(0.98)}
.apply:disabled{opacity:.32;filter:grayscale(.7);box-shadow:none;cursor:default}
.undo{height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:12.5px;cursor:pointer;transition:transform .12s}
.undo:active{transform:scale(0.98)}

.dock{background:#121c2b;color:#dbe5f5;border-radius:13px;padding:4px 8px;display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;border:1px solid #24344c;width:100%;touch-action:none}
.dock-count{display:flex;align-items:center;justify-content:center;gap:3px;font-weight:950;font-size:13px}
.wall-tool{
  height:38px;
  border-radius:10px;
  background:#18243a;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  touch-action:none;
  transition:all .15s ease;
}
.wall-tool.active{box-shadow:0 0 0 2px #39e0a166;color:#5ee9b8}
.wall-tool:active{cursor:grabbing;transform:scale(0.98)}

.wall-icon{
  display:block;
  background:linear-gradient(180deg,#5a6e91,#283857);
  border:1px solid #8295b7;
  border-radius:2px;
  box-shadow:0 2px 4px #0004;
}
.wall-tool[data-orient="h"] .wall-icon{width:22px;height:6px}
.wall-tool[data-orient="v"] .wall-icon{width:6px;height:22px}

.settings{
  width:100%;
  height:38px;
  border-radius:12px;
  background:#18243a;
  color:#fff;
  border:1px solid #2a3b55;
  box-shadow:0 3px 10px #0005;
  font-weight:950;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  transition:transform .12s}
.settings:active{transform:scale(0.99)}
.settings span{font-size:14px}

.modal{position:fixed;inset:0;z-index:100;background:#050a14dd;backdrop-filter:blur(12px);display:none;padding:16px}
.modal.open{display:flex}.modal-card{width:min(100%,520px);margin:auto;min-height:44vh;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0009}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.modal-head h2{margin:0;font-size:18px}.close{width:34px;height:34px;border-radius:9px;background:var(--panel2);font-size:20px;cursor:pointer}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:2px;font-size:10.5px}
.switch{width:46px;height:26px;border-radius:16px;background:#41516c;padding:2.5px;cursor:pointer}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}
.theme{display:flex;gap:5px}.theme button{padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:11px;cursor:pointer}.theme button.active{outline:2px solid var(--blue)}

.author-box{
  margin-top:auto;
  padding-top:14px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:#9eb1d1;
  letter-spacing:.3px;
}
.author-box a{color:#52a5ff;text-decoration:none}

.light{--board:#eef1f7;--boardLine:#b8c0d0;--boardEdge:#aab5ca;--bg:#edf1f8;--panel:#fff;--panel2:#edf1f7;--text:#1c2940;--muted:#78869e;--line:#d5ddea}
.light .cell{border-right-color:#c4cddc;border-bottom-color:#c4cddc}
.light .resign-btn,.light .undo,.light .ctrl-btn{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .dock{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .wall-tool{background:#edf2f9;color:#1c2940}
.light .wall-icon{background:linear-gradient(180deg,#c8d4ec,#8da0c4);border-color:#a4b6d4}
.light .settings{background:#233554;color:#fff}
.light .author-box{color:#435574}
</style>
</head>
<body>

<div id="appBlocker">
  <div style="font-size:56px;margin-bottom:12px;">🔒</div>
  <h2 style="font-size:20px;font-weight:950;margin-bottom:8px;">Нет активной подписки</h2>
  <p style="color:#8b9ab3;font-size:13.5px;line-height:1.5;margin-bottom:24px;">
    Для получения доступа приобретите подписку в Telegram:<br>
    <a href="https://t.me/quf97" target="_blank" style="color:#347fff;text-decoration:none;font-weight:900;font-size:15px;display:inline-block;margin-top:6px;">@quf97</a>
  </p>
  <button onclick="window.Telegram?.WebApp?.close()" style="background:#347fff;color:#fff;border:0;padding:12px 28px;border-radius:12px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:0 4px 14px #2768dd44;">Закрыть</button>
</div>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i><i></i></div>
      <div class="brand-name">WALLHACK PRO</div>
    </div>
    <button class="resign-btn" id="resign" title="Сбросить партию">↻ Сброс</button>
  </header>

  <div class="control-bar">
    <button class="ctrl-btn" id="modeToggle" title="Сменить режим">
      <span id="modeLabel">Режим: Дуэль</span>
    </button>
    <button class="ctrl-btn" id="firstTurnToggle" title="Кто делает 1-й ход">
      <span>1-й:</span>
      <span class="turn-badge me" id="firstTurnBadge">Ты</span>
    </button>
    <button class="ctrl-btn" id="colorToggle" title="Твой цвет фишки">
      <span>Цвет:</span>
      <span class="turn-badge blue" id="colorBadge">Синий</span>
    </button>
    <button class="ctrl-btn" id="racePosToggle" style="display:none" title="Твоя стартовая позиция в гонке">
      <span>Ты:</span>
      <span id="racePosBadge">Справа</span>
    </button>
    <button class="ctrl-btn" id="wallsToggle" style="display:none" title="Количество стен">
      <span>Стен:</span>
      <span id="wallsBadge">15</span>
    </button>
  </div>

  <div class="finish-bar-wrap">
    <div class="finish-bar" id="finishBar">
      <div class="finish-line"></div>
      <div class="finish-label">🏁 ФИНИШ</div>
      <div class="finish-line"></div>
    </div>
  </div>

  <div class="players-wrap">
    <div class="players">
      <div class="player bottom-p active" id="pMe">
        <div class="ball" id="pMeBall"></div>
        <div class="ptext">
          <div class="pname" id="pMeName">Ты</div>
          <div class="pmeta"><span class="wallcount" id="meWalls">10</span> 🧱</div>
        </div>
      </div>
      <div class="player top-p" id="pOpp">
        <div class="ball" id="pOppBall"></div>
        <div class="ptext">
          <div class="pname" id="pOppName">Противник</div>
          <div class="pmeta"><span class="wallcount" id="oppWalls">10</span> 🧱</div>
        </div>
      </div>
    </div>
    <div class="vs">VS</div>
  </div>

  <main class="board-frame" id="boardFrame">
    <div class="thinking-pill" id="thinkOverlay" aria-live="polite">
      <span class="thinking-dot"></span>
      <span>Просчитывает ход</span>
      <span class="thinking-dots"><i></i><i></i><i></i></span>
    </div>
    <div class="board-shell mode-duel" id="boardShell">
      <div class="glow-edge bottom-glow active" id="glowBottom"></div>
      <div class="glow-edge top-glow" id="glowTop"></div>
      <div class="board-grid" id="boardGrid"></div>
      <div class="piece-layer" id="pieceLayer">
        <div class="board-piece" id="pieceMe"></div>
        <div class="board-piece" id="pieceOpp"></div>
      </div>
      <div class="wall-layer" id="wallLayer"></div>
    </div>
  </main>

  <div class="bottom-container">
    <div class="bottom-row">
      <button class="apply" id="apply" disabled>✓ Применить совет</button>
      <button class="undo" id="undo">↩ Назад</button>
    </div>

      <div class="dock-count"><span>🧱</span><span id="dockCount">10</span></div>

async function verifyAccessSystem() {

  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  
  let uid = params.get("uid");

  async function checkSign(testUid, testExp, testSign) {
    if (!testUid || !testExp || !testSign) return false;
    if (testExp <= Math.floor(Date.now() / 1000)) return false;
    if (tgUid && String(testUid) !== String(tgUid)) return false;

    try {
      const encoder = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw",
        encoder.encode(SECRET),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signatureBuffer = await crypto.subtle.sign(
        "HMAC",
        key,
        encoder.encode(`${testUid}:${testExp}`)
      );
      const computedSign = Array.from(new Uint8Array(signatureBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
      return computedSign === testSign;
    } catch (e) {
      return false;
    }
  }

  if (await checkSign(uid, exp, sign)) {
    try { tg?.CloudStorage?.setItem("sub_token", `${uid}:${exp}:${sign}`); } catch(e){}

// ============================================================
// ИСТИННЫЙ MINIMAX-ДВИЖОК ГЛУБОКОГО ПРОСЧЕТА ТЕМПА И СЕТОК
// ============================================================
const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
let state, history = [], engineMove = null, selectedWall = null, soundOn = true, theme = "dark";
let gameMode = "duel";
let firstTurnSetting = "me";
let myColorSetting = "blue";
let raceSideSetting = "right";
let raceWallsSetting = 15;
let audio = null, dragging = false, dragOrient = null, ghostEl = null, ghostAnchor = null;

function getBoardRows(){ return gameMode === "race" ? 13 : 9; }
function getBoardCols(){ return 9; }

// Ты ВСЕГДА снизу (ряд 8), цель ряд 0. Оппонент сверху (ряд 0), цель ряд 8.
function getGoalRow(player){
  if(gameMode === "race") return 0;
  return player === "me" ? 0 : 8;
}

function getDefaultWalls(){ 
  return gameMode === "duel" ? 10 : raceWallsSetting; 
}

function initialState(){
  const rows = getBoardRows();
  const initWalls = getDefaultWalls();
  
  let mePos, oppPos;
  if(gameMode === "race"){
    const myCol = (raceSideSetting === "right" ? 6 : 2);
    const oppCol = (raceSideSetting === "right" ? 2 : 6);
    mePos = {r:rows-1, c:myCol, walls:initWalls};
    oppPos = {r:rows-1, c:oppCol, walls:initWalls};
  } else {
    mePos = {r:8, c:4, walls:initWalls};
    oppPos = {r:0, c:4, walls:initWalls};
  }

  return {
    turn: firstTurnSetting,
    gameOver: false,
    me: mePos,
    opp: oppPos,
    walls: new Set()
  };
}

function wallKey(r,c,o){ return r+","+c+","+o; }
function cloneState(){
  return {
    turn: state.turn,
    gameOver: state.gameOver,
    me: {...state.me},
    opp: {...state.opp},
    walls: new Set(state.walls)
  };
}
function save(){ history.push(cloneState()); if(history.length>100) history.shift(); }
function restore(s){
  engineGeneration++;
  lastEngineMove = null;
  stopEngineWorker();
  state = {turn: s.turn, gameOver: s.gameOver, me: {...s.me}, opp: {...s.opp}, walls: new Set(s.walls)};
  engineMove = null; selectedWall = null;
  rebuildPositionHistory();
  render(true);
  computeEngine();
}
function inBoard(r,c){
  return r >= 0 && r < getBoardRows() && c >= 0 && c < 9;
}

function edgeBlocked(a,b,walls=state.walls){
  const dr = b.r - a.r, dc = b.c - a.c;
  if(dr === 0 && Math.abs(dc) === 1){
    const c = Math.min(a.c, b.c);
    return walls.has(wallKey(a.r, c, "v")) || walls.has(wallKey(a.r-1, c, "v"));
  }
  if(dc === 0 && Math.abs(dr) === 1){
    const r = Math.min(a.r, b.r);
    return walls.has(wallKey(r, a.c, "h")) || walls.has(wallKey(r, a.c-1, "h"));
  }
  return true;
}

function rawNeighbors(pos, walls=state.walls){
  const out = [];
  const rows = getBoardRows();
  for(let i=0; i<4; i++){
    const nr = pos.r + dirs[i][0], nc = pos.c + dirs[i][1];
    if(nr>=0 && nr<rows && nc>=0 && nc<9){
      const n = {r:nr, c:nc};
      if(!edgeBlocked(pos, n, walls)) out.push(n);
    }
  }
  return out;
}

function legalMoves(player, walls=state.walls, pos=null, otherPos=null){
  const me = pos || state[player];
  const other = otherPos || state[player === "me" ? "opp" : "me"];
  const out = [];
  const neigh = rawNeighbors(me, walls);
  for(let i=0; i<neigh.length; i++){
    const n = neigh[i];
    if(n.r === other.r && n.c === other.c){
      const dr = n.r - me.r, dc = n.c - me.c;
      const jump = {r:other.r+dr, c:other.c+dc};
      if(inBoard(jump.r, jump.c) && !edgeBlocked(other, jump, walls)){
        out.push(jump);
      } else {
        const sides = [{r:other.r+dc, c:other.c-dr}, {r:other.r-dc, c:other.c+dr}];
        for(let j=0; j<sides.length; j++){
          const x = sides[j];
          if(inBoard(x.r, x.c) && !edgeBlocked(other, x, walls)) out.push(x);
        }
      }
    } else {
      out.push(n);
    }
  }
  return out;
}

const qArr = new Int32Array(150);
const distArr = new Int8Array(150);

function shortestPath(player, walls=state.walls, start=null){
  const s = start || state[player], goalRow = getGoalRow(player);
  const rows = getBoardRows(), totalCells = rows * 9;
  if(s.r === goalRow) return 0;
  
  distArr.fill(-1, 0, totalCells);
  let head = 0, tail = 0;
  const startIdx = s.r * 9 + s.c;
  distArr[startIdx] = 0;
  qArr[tail++] = startIdx;
  
  while(head < tail){
    const idx = qArr[head++];
    const r = (idx / 9) | 0, c = idx % 9;
    const d = distArr[idx];
    if(r === goalRow) return d;
    
    for(let i=0; i<4; i++){
      const nr = r + dirs[i][0], nc = c + dirs[i][1];
      if(nr>=0 && nr<rows && nc>=0 && nc<9){
        const nIdx = nr * 9 + nc;
        if(distArr[nIdx] === -1){
          let blocked = false;
          if(dirs[i][0] === 0){
            const minC = c < nc ? c : nc;
            if(walls.has(wallKey(r, minC, "v")) || walls.has(wallKey(r-1, minC, "v"))) blocked = true;
          } else {
            const minR = r < nr ? r : nr;
            if(walls.has(wallKey(minR, c, "h")) || walls.has(wallKey(minR, c-1, "h"))) blocked = true;
          }
          if(!blocked){
            distArr[nIdx] = d + 1;
            qArr[tail++] = nIdx;
          }
        }
      }
    }
  }
  return Infinity;
}

function getOptimalPath(player, walls=state.walls, start=null){
  const s = start || state[player], goalRow = getGoalRow(player);
  const rows = getBoardRows(), totalCells = rows * 9;
  if(s.r === goalRow) return [];

  distArr.fill(-1, 0, totalCells);
  const parent = new Int16Array(totalCells).fill(-1);
  let head = 0, tail = 0;
  const startIdx = s.r * 9 + s.c;
  distArr[startIdx] = 0;
  qArr[tail++] = startIdx;
  let targetIdx = -1;

  while(head < tail){
    const idx = qArr[head++];
    const r = (idx / 9) | 0, c = idx % 9;
    const d = distArr[idx];
    if(r === goalRow){ targetIdx = idx; break; }

    for(let i=0; i<4; i++){
      const nr = r + dirs[i][0], nc = c + dirs[i][1];
      if(nr>=0 && nr<rows && nc>=0 && nc<9){
        const nIdx = nr * 9 + nc;
        if(distArr[nIdx] === -1){
          let blocked = false;
          if(dirs[i][0] === 0){
            const minC = c < nc ? c : nc;
            if(walls.has(wallKey(r, minC, "v")) || walls.has(wallKey(r-1, minC, "v"))) blocked = true;
          } else {
            const minR = r < nr ? r : nr;
            if(walls.has(wallKey(minR, c, "h")) || walls.has(wallKey(minR, c-1, "h"))) blocked = true;
          }
          if(!blocked){
            distArr[nIdx] = d + 1;
            parent[nIdx] = idx;
            qArr[tail++] = nIdx;
          }
        }
      }
    }
  }

  const path = [];
  if(targetIdx !== -1){
    let cur = targetIdx;
    while(cur !== startIdx && cur !== -1){
      path.push({r: (cur/9)|0, c: cur%9});
      cur = parent[cur];
    }
    path.reverse();
  }
  return path;
}

function legalWall(r,c,o,walls=state.walls){
  const maxR = getBoardRows() - 2;
  if(r<0 || r>maxR || c<0 || c>7) return false;
  const k = wallKey(r,c,o);
  if(walls.has(k)) return false;
  
  if(o === "h"){
    if(walls.has(wallKey(r,c,"v"))) return false;
  } else {
    if(walls.has(wallKey(r,c,"h"))) return false;
  }
  
  const copy = new Set(walls);
  copy.add(k);
  return shortestPath("me", copy) !== Infinity && shortestPath("opp", copy) !== Infinity;
}

function allValidWalls(walls=state.walls){
  const a = [];
  const maxR = getBoardRows() - 2;
  for(let r=0; r<=maxR; r++) for(let c=0; c<8; c++) for(const o of ["h","v"]){
    if(legalWall(r,c,o,walls,state.me,state.opp)) a.push({r,c,o});
  }
  return a;
}

// Полноценная оценочная функция Quoridor Master
function evaluateStateFull(player, walls, myPos, oppPos, myWalls, oppWalls){
  const myGoal = getGoalRow(player);
  const oppGoal = getGoalRow(player === "me" ? "opp" : "me");

  if(myPos.r === myGoal) return 1000000;
  if(oppPos.r === oppGoal) return -1000000;

  const myDist = shortestPath(player, walls, myPos);
  const oppDist = shortestPath(player === "me" ? "opp" : "me", walls, oppPos);

  if(!isFinite(myDist)) return -1000000;
  if(!isFinite(oppDist)) return 1000000;

  // Базовый вес дистанции
  let score = (oppDist - myDist) * 1000;

  // Оценка запаса стенок
  score += (myWalls - oppWalls) * 60;

  // Оценка центрального контроля
  const myCenter = 4 - Math.abs(myPos.c - 4);
  const oppCenter = 4 - Math.abs(oppPos.c - 4);
  score += (myCenter - oppCenter) * 10;

  return score;
}

// Генератор умных ходов для альфа-бета
function getSortedCandidateMoves(turnPlayer, walls, myPos, oppPos, myWalls, oppWalls){
  const enemy = (turnPlayer === "me" ? "opp" : "me");
  const pPos = (turnPlayer === "me" ? myPos : oppPos);
  const ePos = (turnPlayer === "me" ? oppPos : myPos);
  const pWalls = (turnPlayer === "me" ? myWalls : oppWalls);
  const curPDist = shortestPath(turnPlayer, walls, pPos);
  const curEDist = shortestPath(enemy, walls, ePos);
  const goalRow = getGoalRow(turnPlayer);

  const moves = [];

  // Шаги
  const steps = legalMoves(turnPlayer, walls, pPos, ePos);
  for(const step of steps){
    if(step.r === goalRow){
      return [{type:"step", r:step.r, c:step.c, priority: 999999}];
    }
    const d = shortestPath(turnPlayer, walls, step);
    const progress = curPDist - d;
    moves.push({type:"step", r:step.r, c:step.c, priority: progress * 200});
  }

  // Стенки
  if(pWalls > 0){
    const ePath = getOptimalPath(enemy, walls, ePos);
    const validWalls = allValidWalls(walls);
    const scoredWalls = [];

    for(const w of validWalls){
      const copy = new Set(walls);
      copy.add(wallKey(w.r, w.c, w.o));

      const newED = shortestPath(enemy, copy, ePos);
      const newPD = shortestPath(turnPlayer, copy, pPos);

      if(!isFinite(newED) || !isFinite(newPD)) continue;

      const eGain = newED - curEDist;
      const pLoss = newPD - curPDist;

      // Стенка не должна вредить нашему пути!
      if(pLoss > 0 && eGain <= pLoss) continue;

      // Если стенка наносит урон траектории соперника
      if(eGain >= 2 || (eGain >= 1 && curEDist <= 4)){
        const onPath = ePath.some(pt => Math.abs(pt.r - w.r) <= 1 && Math.abs(pt.c - w.c) <= 1);
        const prio = (eGain * 300) - (pLoss * 400) + (onPath ? 100 : 0);
        scoredWalls.push({type:"wall", r:w.r, c:w.c, o:w.o, priority: prio});
      }
    }

    scoredWalls.sort((a,b) => b.priority - a.priority);
    for(let i=0; i<Math.min(scoredWalls.length, 12); i++){
      moves.push(scoredWalls[i]);
    }
  }

  moves.sort((a,b) => b.priority - a.priority);
  return moves;
}

// Alpha-Beta Minimax глубиной 3-4 полухода
function minimax(depth, isMax, walls, myPos, oppPos, myWalls, oppWalls, alpha, beta){
  const myGoal = getGoalRow("me");
  const oppGoal = getGoalRow("opp");

  if(myPos.r === myGoal) return 1000000;
  if(oppPos.r === oppGoal) return -1000000;
  if(depth === 0) return evaluateStateFull("me", walls, myPos, oppPos, myWalls, oppWalls);

  const turnPlayer = isMax ? "me" : "opp";
  const candidates = getSortedCandidateMoves(turnPlayer, walls, myPos, oppPos, myWalls, oppWalls);

  if(candidates.length === 0) return evaluateStateFull("me", walls, myPos, oppPos, myWalls, oppWalls);

  if(isMax){
    let maxVal = -Infinity;
    for(const m of candidates){
      let nextWalls = new Set(walls);
      let nextMyPos = {...myPos};
      let nextMyWalls = myWalls;

      if(m.type === "step"){
        nextMyPos = {r:m.r, c:m.c};
      } else {
        nextWalls.add(wallKey(m.r, m.c, m.o));
        nextMyWalls--;
      }

      const val = minimax(depth - 1, false, nextWalls, nextMyPos, oppPos, nextMyWalls, oppWalls, alpha, beta);
      maxVal = Math.max(maxVal, val);
      alpha = Math.max(alpha, val);
      if(beta <= alpha) break;
    }
    return maxVal;
  } else {
    let minVal = Infinity;
    for(const m of candidates){
      let nextWalls = new Set(walls);
      let nextOppPos = {...oppPos};
      let nextOppWalls = oppWalls;

      if(m.type === "step"){
        nextOppPos = {r:m.r, c:m.c};
      } else {
        nextWalls.add(wallKey(m.r, m.c, m.o));
        nextOppWalls--;
      }

      const val = minimax(depth - 1, true, nextWalls, myPos, nextOppPos, myWalls, nextOppWalls, alpha, beta);
      minVal = Math.min(minVal, val);
      beta = Math.min(beta, val);
      if(beta <= alpha) break;
    }
    return minVal;
  }
}

function moveKey(m){
  if(!m) return "";
  return m.type === "step" ? ("s:" + m.r + "," + m.c) : ("w:" + m.r + "," + m.c + "," + m.o);
}

let forbiddenMoveKey = null;

function calculateBestMove(player){
  const myPos = state.me;
  const oppPos = state.opp;
  const myWalls = state.me.walls;
  const oppWalls = state.opp.walls;

  const rawCandidates = getSortedCandidateMoves("me", state.walls, myPos, oppPos, myWalls, oppWalls);
  if(rawCandidates.length === 0) return null;

  // Защита от бессмысленного возврата на клетку предыдущего хода.
  // Если это единственный допустимый вариант, всё равно разрешаем его.
  let candidates = rawCandidates;
  if(forbiddenMoveKey){
    const filtered = rawCandidates.filter(m => moveKey(m) !== forbiddenMoveKey);
    if(filtered.length) candidates = filtered;
  }

  // Если есть мгновенный выигрыш
  if(candidates[0].priority === 999999) return candidates[0];

  let bestMove = candidates[0];
  let bestScore = -Infinity;
  const depth = 3; // 3 полухода Alpha-Beta глубокого анализа

  for(const m of candidates){
    let nextWalls = new Set(state.walls);
    let nextMyPos = {...myPos};
    let nextMyWalls = myWalls;

    if(m.type === "step"){
      nextMyPos = {r:m.r, c:m.c};
    } else {
      nextWalls.add(wallKey(m.r, m.c, m.o));
      nextMyWalls--;
    }

    const score = minimax(depth - 1, false, nextWalls, nextMyPos, oppPos, nextMyWalls, oppWalls, -Infinity, Infinity);
    if(score > bestScore){
      bestScore = score;
      bestMove = m;
    }
  }

  return bestMove;
}

function getOppColor(){
  return myColorSetting === "blue" ? "red" : "blue";
}

function updateBoardLayout(){
  const frame = document.getElementById("boardFrame");
  const shell = document.getElementById("boardShell");
  if(!frame || !shell) return;
  
  const frameW = frame.clientWidth;
  const frameH = frame.clientHeight;
  if(frameW <= 0 || frameH <= 0) return;
  
  if(gameMode === "duel"){
    const size = Math.min(frameW, frameH);
    shell.style.width = size + "px";
    shell.style.height = size + "px";
  } else {
    let w = frameH * (9 / 13);
    let h = frameH;
    if(w > frameW){
      w = frameW;
      h = frameW * (13 / 9);
    }
    shell.style.width = w + "px";
    shell.style.height = h + "px";
  }
}

function wallPosition(r,c,o){
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  return {x: rect.width * (c + 1) / 9, y: rect.height * (r + 1) / rows};
}

function cellCenterPosition(r,c){
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  return {x: rect.width * (c + 0.5) / 9, y: rect.height * (r + 0.5) / rows};
}

function createWallPiece(r,c,o,extra=""){
  const el = document.createElement("div");
  el.className = "wall-piece " + o + " " + extra;
  const p = wallPosition(r,c,o);
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  if(o === "h"){
    el.style.width = (rect.width * (2/9) - 3.5) + "px";
  } else {
    el.style.height = (rect.height * (2/rows) - 3.5) + "px";
  }
  return el;
}

function updatePiecePositions(animate=true){
  const pMe = cellCenterPosition(state.me.r, state.me.c);
  const pOpp = cellCenterPosition(state.opp.r, state.opp.c);
  
  const elMe = document.getElementById("pieceMe");
  const elOpp = document.getElementById("pieceOpp");
  const oppColor = getOppColor();
  
  if(elMe) elMe.className = "board-piece " + myColorSetting;
  if(elOpp) elOpp.className = "board-piece " + oppColor;

  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  const pieceSize = Math.min(rect.width/9, rect.height/rows) * 0.58;
  
  if(elMe){ 
    if(!animate){ elMe.style.transition = "none"; }
    elMe.style.width = pieceSize + "px";
    elMe.style.height = pieceSize + "px";
    elMe.style.left = pMe.x + "px"; elMe.style.top = pMe.y + "px";
    if(!animate){ requestAnimationFrame(()=>{ elMe.style.transition = ""; }); }
  }
  if(elOpp){ 
    if(!animate){ elOpp.style.transition = "none"; }
    elOpp.style.width = pieceSize + "px";
    elOpp.style.height = pieceSize + "px";
    elOpp.style.left = pOpp.x + "px"; elOpp.style.top = pOpp.y + "px";
    if(!animate){ requestAnimationFrame(()=>{ elOpp.style.transition = ""; }); }
  }
}

let currentRenderedRows = -1;
function buildGridDOM(){
  const grid = document.getElementById("boardGrid");
  const rows = getBoardRows();
  if(currentRenderedRows === rows) return;
  
  currentRenderedRows = rows;
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = "repeat(9, 1fr)";
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  
  for(let r=0; r<rows; r++) for(let c=0; c<9; c++){
    const cell = document.createElement("div");
    cell.className = "cell";
    if(c === 8) cell.style.borderRight = "0";
    if(r === rows - 1) cell.style.borderBottom = "0";
    cell.dataset.r = r;
    cell.dataset.c = c;
    cell.addEventListener("click", ()=>onCell(r,c));
    grid.appendChild(cell);
  }
}

function render(animatePieces=true){
  updateBoardLayout();
  buildGridDOM();
  
  const grid = document.getElementById("boardGrid");
  const layer = document.getElementById("wallLayer");
  layer.innerHTML = "";
  
  const legal = state.gameOver ? [] : legalMoves(state.turn);
  const isMyTurn = (state.turn === "me");
  
  const cells = grid.children;
  for(let i=0; i<cells.length; i++){
    const cell = cells[i];
    const r = +cell.dataset.r, c = +cell.dataset.c;
    
    const isLegal = legal.some(p => p.r === r && p.c === c);
    const isEngine = (isMyTurn && engineMove?.type === "step" && engineMove.r === r && engineMove.c === c);
    
    cell.classList.toggle("legal", isLegal);
    cell.classList.toggle("engine", isEngine);
  }
  
  updatePiecePositions(animatePieces);

  for(const k of state.walls){
    const [r,c,o] = k.split(",");
    layer.appendChild(createWallPiece(+r, +c, o));
  }
  if(isMyTurn && engineMove?.type === "wall"){
    layer.appendChild(createWallPiece(engineMove.r, engineMove.c, engineMove.o, "engine"));
  }
  updateUI();
}

    racePosBtn.style.display = (gameMode === "race" ? "flex" : "none");

  const wallsBtn = document.getElementById("wallsToggle");
  const wallsBadge = document.getElementById("wallsBadge");
  if(wallsBtn && wallsBadge){
    wallsBtn.style.display = (gameMode === "race" ? "flex" : "none");
    wallsBadge.textContent = raceWallsSetting;
  }

  const modeLabel = document.getElementById("modeLabel");
  if(modeLabel) modeLabel.textContent = (gameMode === "race" ? "Режим: Гонка" : "Режим: Дуэль");
  const controlBar = document.querySelector(".control-bar");
  if(controlBar) controlBar.classList.toggle("race-mode", gameMode === "race");
  
  const finishBar = document.getElementById("finishBar");
  if(finishBar) finishBar.classList.toggle("visible", gameMode === "race");

  const isMyTurn = (state.turn === "me");
  document.getElementById("apply").disabled = !(isMyTurn && engineMove && !state.gameOver);
  document.querySelectorAll(".wall-tool").forEach(b => b.classList.toggle("active", b.dataset.orient === selectedWall));
}

function onCell(r,c){
  if(state.gameOver || engineBusy) return;
  if(legalMoves(state.turn).some(p => p.r === r && p.c === c)){
    save(); state[state.turn].r = r; state[state.turn].c = c; playMoveSound(); lastEngineMove = null; finishTurn();
  }
}

function placeWall(r,c,o){
  if(state.gameOver || engineBusy || state[state.turn].walls <= 0 || !legalWall(r,c,o)) return false;
  save(); state.walls.add(wallKey(r,c,o)); state[state.turn].walls--; playWallSound(); selectedWall = null; engineMove = null; lastEngineMove = null; finishTurn(); return true;
}

function finishTurn(){
  const myGoal = getGoalRow("me");
  const oppGoal = getGoalRow("opp");
  const won = (state.me.r === myGoal) || (state.opp.r === oppGoal);
  
  if(won){
    state.gameOver = true;
    render(true);
    setTimeout(()=>alert(state.me.r === myGoal ? "Ты победил!" : "Противник победил!"), 20);
    return;
  }
  state.turn = (state.turn === "me" ? "opp" : "me");
  recordPosition();

  // Немедленно показываем новый ход. Только после отрисованного кадра
  // запускаем расчёт, поэтому UI не выглядит зависшим.
  render(true);
  scheduleEngine();
}

let engineWorker = null;
let engineWorkerUrl = null;

/* Engine core lives in engine.worker.js. Keeping it external makes the repository debuggable and the Worker cacheable. */

function createEngineWorker(){
  if(typeof Worker === "undefined") return null;
  try{
    if(engineWorker) engineWorker.terminate();
    if(engineWorkerUrl){ try{ URL.revokeObjectURL(engineWorkerUrl); }catch(e){} engineWorkerUrl=null; }
    const w = new Worker("engine.worker.js?v=20260820-2205");
    w.onmessage = e=>{
      const d = e.data || {};
      if(d.id !== engineGeneration) return;
      engineBusy = false;
      setThinking(false);
      if(d.error){
        console.error("Engine worker:", d.error);
        engineMove = null;
        render(true);
        return;
      }
      const move = d.move || null;
      if(aiPlayerAtRequest === "opp" && move && state.turn === "opp" && !state.gameOver){
        save();
        const from = {r:state.opp.r,c:state.opp.c};
        if(move.type === "step"){ state.opp.r=move.r; state.opp.c=move.c; playMoveSound(); }
        else { state.walls.add(wallKey(move.r,move.c,move.o)); state.opp.walls--; playWallSound(); }
        lastEngineMove = {type:move.type,from:from,to:move.type === "step" ? {r:move.r,c:move.c}:null,r:move.r,c:move.c,o:move.o};
        engineMove = null;
        state.turn = "me";
        recordPosition();
        render(true);
        requestAnimationFrame(()=>scheduleEngine());
        return;
      }
      engineMove = move;
      if(engineMove){
        const fromPlayer = aiPlayerAtRequest === "opp" ? state.opp : state.me;
        lastEngineMove = {type:engineMove.type,from:{r:fromPlayer.r,c:fromPlayer.c},to:engineMove.type === "step" ? {r:engineMove.r,c:engineMove.c}:null,r:engineMove.r,c:engineMove.c,o:engineMove.o};
      }
      render(true);
    };
    w.onerror = err=>{
      console.error("Engine worker failed:", err);
      engineBusy = false;
      setThinking(false);
      engineMove = null;
      render(true);
    };
    return w;
  }catch(err){
    console.error("Worker init failed:", err);
    return null;
  }
}
let engineTimer = null;
let engineBusy = false;
let engineGeneration = 0;
let lastEngineMove = null;
let positionHistoryKeys = [];
let aiPlayerAtRequest = "me";
function currentPositionKey(){
  const walls = Array.from(state.walls).sort().join(";");
  return state.turn+"|"+state.me.r+","+state.me.c+"|"+state.opp.r+","+state.opp.c+"|"+state.me.walls+","+state.opp.walls+"|"+walls;
}
function recordPosition(){
  const k=currentPositionKey();
  positionHistoryKeys.push(k);
  if(positionHistoryKeys.length>24) positionHistoryKeys.shift();
}
function rebuildPositionHistory(){ positionHistoryKeys=[currentPositionKey()]; }

function getEngineAvoidMoveKey(){
  if(!lastEngineMove || lastEngineMove.type !== "step") return null;
  return "s:" + lastEngineMove.from.r + "," + lastEngineMove.from.c;
}

function engineAntiOscillationSelfTest(){
  if(moveKey({type:"step",r:4,c:4}) !== "s:4,4") throw new Error("moveKey failed");
  lastEngineMove={type:"step",from:{r:4,c:4},to:{r:5,c:4}};
  if(getEngineAvoidMoveKey() !== "s:4,4") throw new Error("reverse guard failed");
  lastEngineMove=null;
}

function setThinking(on){
  engineBusy = on;
  const overlay = document.getElementById("thinkOverlay");
  if(overlay) overlay.classList.toggle("visible", !!on);
  const apply = document.getElementById("apply");
  if(apply) apply.disabled = true;
}

function stopEngineWorker(){
  if(engineWorker){
    try{ engineWorker.terminate(); }catch(e){}
    engineWorker = null;
  }
  if(engineWorkerUrl){
    try{ URL.revokeObjectURL(engineWorkerUrl); }catch(e){}
    engineWorkerUrl = null;
  }
}

function scheduleEngine(){
  if(engineTimer) clearTimeout(engineTimer);
  engineTimer = null;

  if(state.gameOver){
    setThinking(false);
    render(true);
    return;
  }

  // ВАЖНО: никакого тяжёлого расчёта в UI-потоке.
  // Сначала браузер рисует уже сделанный ход, затем worker считает параллельно.
  render(true);
  setThinking(true);

  const generation = ++engineGeneration;

  aiPlayerAtRequest = state.turn;

  if(!engineWorker) engineWorker = createEngineWorker();

  if(!engineWorker){
    // Редкий fallback для окружений без Worker.
    // Даём браузеру один кадр перед расчётом.
    engineTimer = setTimeout(()=>{
      engineTimer = null;
      if(generation !== engineGeneration || state.gameOver) return;
      engineMove = calculateBestMove("me");
      if(generation !== engineGeneration) return;
      if(aiPlayerAtRequest === "opp" && engineMove && state.turn === "opp"){
        save();
        if(engineMove.type === "step"){ state.opp.r=engineMove.r; state.opp.c=engineMove.c; playMoveSound(); }
        else { state.walls.add(wallKey(engineMove.r,engineMove.c,engineMove.o)); state.opp.walls--; playWallSound(); }
        engineMove=null; render(true); setThinking(false); finishTurn(); return;
      }
      if(engineMove){
        const fp=aiPlayerAtRequest === "opp" ? state.opp : state.me;
        lastEngineMove = {type:engineMove.type, from:{r:fp.r,c:fp.c}, to:engineMove.type === "step" ? {r:engineMove.r,c:engineMove.c} : null, r:engineMove.r,c:engineMove.c,o:engineMove.o};
      }
      setThinking(false);
      render(true);
    }, 80);
    return;
  }

  engineWorker.postMessage({
    id:generation,
    aiPlayer:aiPlayerAtRequest,
    gameMode,
    raceWallsSetting,
    turn:state.turn,
    gameOver:state.gameOver,
    me:{...state.me},
    opp:{...state.opp},
    walls:Array.from(state.walls),
    avoidMoveKey:getEngineAvoidMoveKey(),
    recentPositionKeys:positionHistoryKeys.slice(-24)
  });
}

function computeEngine(){
  scheduleEngine();
}

function applyEngine(){
  if(!engineMove || state.gameOver || state.turn !== "me") return;
  save();
  if(engineMove.type === "step"){
    state[state.turn].r = engineMove.r; state[state.turn].c = engineMove.c; playMoveSound();
  } else {
    state.walls.add(wallKey(engineMove.r, engineMove.c, engineMove.o)); state[state.turn].walls--; playWallSound();
  }
  engineMove = null; finishTurn();
}

document.getElementById("apply").onclick = applyEngine;

document.getElementById("undo").onclick = ()=>{
  if(history.length) restore(history.pop());
};

document.getElementById("resign").onclick = ()=>{

    engineGeneration++;
    stopEngineWorker();

    engineTimer = null;
    engineBusy = false;
    setThinking(false);
    state = initialState(); history = []; engineMove = null; selectedWall = null; lastEngineMove = null; rebuildPositionHistory(); computeEngine();
  }
};

function selectWall(o){ selectedWall = (selectedWall === o ? null : o); render(true); }

function isPointerInsideBoard(pnt){
  const rect = document.getElementById("boardShell").getBoundingClientRect();
  return pnt.x >= rect.left - 15 && 
         pnt.x <= rect.right + 15 && 
         pnt.y >= rect.top - 15 && 
         pnt.y <= rect.bottom + 15;
}

function boardAnchorFromPointer(x,y,o){
  const rect = document.getElementById("boardShell").getBoundingClientRect();
  const rows = getBoardRows();
  const cellW = rect.width / 9;
  const cellH = rect.height / rows;
  
  let col = Math.round((x - rect.left) / cellW) - 1;
  let row = Math.round((y - rect.top) / cellH) - 1;
  
  col = Math.max(0, Math.min(7, col));
  row = Math.max(0, Math.min(rows - 2, row));
  return {r:row, c:col};
}

function dragPointer(x,y){
  return {x:x, y:y-65};
}

function updateGhost(x,y,o){
  const pnt = dragPointer(x,y);
  
  if(!isPointerInsideBoard(pnt)){
    if(ghostEl){ ghostEl.remove(); ghostEl = null; }
    ghostAnchor = null;
    return;
  }

  const a = boardAnchorFromPointer(pnt.x, pnt.y, o);
  
  if(!ghostEl){
    ghostEl = createWallPiece(a.r, a.c, o, "ghost");
    document.getElementById("wallLayer").appendChild(ghostEl);
  }
  
  const p = wallPosition(a.r, a.c, o);
  ghostEl.style.left = p.x + "px";
  ghostEl.style.top = p.y + "px";
  ghostEl.className = "wall-piece " + o + " ghost";
  
  const ok = state[state.turn].walls > 0 && legalWall(a.r, a.c, o);
  if(!ok) ghostEl.classList.add("bad");
  ghostAnchor = {...a, ok};
}

function endDrag(x,y){
  if(!dragging) return;
  const pnt = dragPointer(x,y);
  const inside = isPointerInsideBoard(pnt);
  
  dragging = false;
  if(ghostEl){ ghostEl.remove(); ghostEl = null; }
  
  if(inside){
    const a = boardAnchorFromPointer(pnt.x, pnt.y, dragOrient);
    const ok = state[state.turn].walls > 0 && legalWall(a.r, a.c, dragOrient);
    if(ok) placeWall(a.r, a.c, dragOrient);
  }
  
  ghostAnchor = null;
  dragOrient = null;
  selectedWall = null;
  render(true);
}

function bindWallDrag(btn){
  btn.addEventListener("pointerdown", e=>{
    if(state.gameOver || state[state.turn].walls <= 0) return;
    dragging = true; dragOrient = btn.dataset.orient; selectedWall = dragOrient;
    btn.setPointerCapture?.(e.pointerId);
    updateGhost(e.clientX, e.clientY, dragOrient);
    e.preventDefault(); e.stopPropagation();
  });
  btn.addEventListener("pointermove", e=>{
    if(dragging) updateGhost(e.clientX, e.clientY, dragOrient);
  });
  btn.addEventListener("pointerup", e=>endDrag(e.clientX, e.clientY));
  btn.addEventListener("pointercancel", ()=>endDrag(0,0));
}
bindWallDrag(document.getElementById("wallH"));
bindWallDrag(document.getElementById("wallV"));

document.getElementById("boardShell").addEventListener("pointermove", e=>{
  if(dragging) updateGhost(e.clientX, e.clientY, dragOrient);
});
document.getElementById("boardShell").addEventListener("pointerup", e=>{ if(dragging) endDrag(e.clientX, e.clientY); });

document.getElementById("boardShell").addEventListener("click", e=>{
  if(dragging || !selectedWall) return;
  const a = boardAnchorFromPointer(e.clientX, e.clientY, selectedWall);
  if(legalWall(a.r, a.c, selectedWall)) placeWall(a.r, a.c, selectedWall);
});

function sfx(freq,dur,type="sine",vol=.035){
  if(!soundOn) return;
  try{
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}
function playMoveSound(){ sfx(430, .11, "sine", .035); setTimeout(()=>sfx(650, .08, "sine", .025), 35); }
function playWallSound(){ sfx(100, .07, "square", .03); }

const shellInit = document.getElementById("boardShell");
shellInit.className = "board-shell " + (gameMode === "race" ? "mode-race" : "mode-duel");

if(finishBarInit) finishBarInit.classList.toggle("visible", gameMode === "race");

rebuildPositionHistory();
try{ engineAntiOscillationSelfTest(); }catch(e){ console.error("Engine self-test failed:",e); }
render(false);
computeEngine();
