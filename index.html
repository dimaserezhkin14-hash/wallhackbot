<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WallRush Engine Helper</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111e;
      --card: #151f32;
      --card-inner: #0d1524;
      --grid-gap: #1e2c45;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      
      --p1: #2563eb;
      --p1-grad: radial-gradient(circle at 35% 35%, #93c5fd, #2563eb 60%, #1e3a8a);
      --p1-glow: rgba(37, 99, 235, 0.5);
      
      --p2: #dc2626;
      --p2-grad: radial-gradient(circle at 35% 35%, #fca5a5, #dc2626 60%, #7f1d1d);
      --p2-glow: rgba(220, 38, 38, 0.5);
      
      --wall-color: #b45309;
      --wall-border: #78350f;
      --hint: #10b981;
      --hint-glow: rgba(16, 185, 129, 0.6);
      --danger: #ef4444;
      
      --shadow: 0 8px 24px rgba(0,0,0,0.5);
      --border-color: #24344d;
    }

    body.light-theme {
      --bg: #f1f5f9;
      --card: #ffffff;
      --card-inner: #f8fafc;
      --grid-gap: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 8px 24px rgba(0,0,0,0.1);
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 8px 12px;
      overflow-x: hidden;
      touch-action: none;
    }

    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .logo {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-reset {
      background: var(--card);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .turn-selector {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }
    .turn-opt {
      flex: 1;
      text-align: center;
      padding: 6px 8px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .turn-opt.active-p1 {
      background: var(--p1);
      color: #fff;
      box-shadow: 0 2px 8px var(--p1-glow);
    }
    .turn-opt.active-p2 {
      background: var(--p2);
      color: #fff;
      box-shadow: 0 2px 8px var(--p2-glow);
    }

    .players-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .p-badge {
      flex: 1;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .p-badge.active-turn-1 {
      border-color: var(--p1);
      box-shadow: 0 0 16px var(--p1-glow);
      background: rgba(37, 99, 235, 0.12);
    }
    .p-badge.active-turn-2 {
      border-color: var(--p2);
      box-shadow: 0 0 16px var(--p2-glow);
      background: rgba(220, 38, 38, 0.12);
    }
    .p-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .p1-avatar { background: var(--p1-grad); }
    .p2-avatar { background: var(--p2-grad); }
    .p-info { display: flex; flex-direction: column; }
    .p-title { font-size: 13px; font-weight: 800; }
    .p-walls-left { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .vs-sign { font-weight: 900; font-size: 12px; color: var(--text-muted); }
    .board-frame {
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1;
      background: var(--card);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 8px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }
    .goal-top {
      position: absolute; top: 0; left: 0; right: 0; height: 35px;
      background: linear-gradient(to bottom, rgba(220,38,38,0.25), transparent);
      pointer-events: none; z-index: 1;
    }
    .goal-bottom {
      position: absolute; bottom: 0; left: 0; right: 0; height: 35px;
      background: linear-gradient(to top, rgba(37,99,235,0.25), transparent);
      pointer-events: none; z-index: 1;
    }

    #board-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(9, 1fr 6px) 1fr;
      grid-template-rows: repeat(9, 1fr 6px) 1fr;
      position: relative;
      z-index: 2;
    }

    .cell {
      background: var(--card-inner);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .light-theme .cell { border-color: rgba(0,0,0,0.05); }

    .pawn {
      width: 80%;
      height: 80%;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      z-index: 5;
      pointer-events: none;
    }
    .p1-pawn { background: var(--p1-grad); }
    .p2-pawn { background: var(--p2-grad); }

    .move-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--p2);
      box-shadow: 0 0 10px var(--p2);
      cursor: pointer;
      z-index: 6;
      animation: pulse 1.2s infinite;
    }
    .move-dot.blue-dot {
      background: var(--p1);
      box-shadow: 0 0 10px var(--p1);
    }

    .cell.best-move {
      background: rgba(16, 185, 129, 0.25) !important;
      border: 2px solid var(--hint) !important;
      box-shadow: inset 0 0 12px var(--hint-glow), 0 0 12px var(--hint-glow);
      animation: pulse 1.2s infinite;
    }
    .best-move-icon {
      font-size: 16px;
      color: var(--hint);
      font-weight: 900;
      pointer-events: none;
      z-index: 7;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    .wall-slot-h, .wall-slot-v {
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      z-index: 3;
      border-radius: 2px;
    }
    .wall-slot-dot { background: transparent; }

    .wall-placed-h, .wall-placed-v {
      background: var(--wall-color) !important;
      border: 1px solid var(--wall-border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      border-radius: 3px;
      z-index: 10;
    }

    .wall-best-hint {
      background: var(--hint) !important;
      box-shadow: 0 0 12px var(--hint) !important;
      z-index: 9;
      animation: pulse 1.2s infinite;
    }

    .bottom-dock {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      box-shadow: var(--shadow);
    }
    .dock-walls-count {
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .wall-btn {
      background: var(--card-inner);
      border: 2px solid transparent;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .wall-btn.active-tap {
      border-color: var(--hint);
      background: rgba(16, 185, 129, 0.15);
    }
    .shape-h { width: 32px; height: 8px; background: var(--wall-color); border-radius: 2px; border: 1px solid var(--wall-border); }
    .shape-v { width: 8px; height: 32px; background: var(--wall-color); border-radius: 2px; border: 1px solid var(--wall-border); }

    .action-controls {
      width: 100%;
      max-width: 400px;
      margin-top: 8px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
    }
    .btn-apply-best {
      background: #16a34a;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-apply-best:disabled {
      background: #334155;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-undo {
      background: var(--card);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 12px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .hint-label {
      width: 100%;
      max-width: 400px;
      margin-top: 6px;
      background: var(--card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      box-shadow: var(--shadow);
    }
    .hint-label b { color: var(--hint); }

    .btn-settings {
      position: fixed;
      bottom: 14px;
      right: 14px;
      background: var(--card);
      border: 1px solid var(--border-color);
      width: 46px;
      height: 46px;
      border-radius: 23px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      cursor: pointer;
      z-index: 50;
    }

    .settings-modal {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 100;
      padding: 20px;
      display: none;
      flex-direction: column;
    }
    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .settings-header h2 { font-size: 24px; font-weight: 800; }
    .btn-close-set {
      background: var(--card);
      border: 1px solid var(--border-color);
      width: 40px;
      height: 40px;
      border-radius: 20px;
      font-size: 20px;
      color: var(--text);
      cursor: pointer;
    }
    .set-row {
      background: var(--card);
      border: 1px solid var(--border-color);
      padding: 16px 18px;
      border-radius: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
    }
    .author-note {
      margin-top: auto;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      padding-bottom: 20px;
    }

    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background-color: var(--grid-gap);
      transition: .2s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
      background-color: #fff; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--p1); }
    input:checked + .slider:before { transform: translateX(20px); }

    #drag-ghost {
      position: fixed;
      pointer-events: none;
      display: none;
      z-index: 1000;
      border-radius: 3px;
      transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo"><span style="color:var(--p1)">■</span> WallRush Engine</div>
    <button class="btn-reset" onclick="confirmReset()">Сброс</button>
  </div>

  <div class="turn-selector">
    <div id="first-p1" class="turn-opt active-p1" onclick="setStartingTurn(1)">Первый ход: Я (Синий)</div>
    <div id="first-p2" class="turn-opt" onclick="setStartingTurn(2)">Враг (Красный)</div>
  </div>

  <div class="players-bar">
    <div id="badge-p1" class="p-badge active-turn-1" onclick="selectTurn(1)">
      <div class="p-avatar p1-avatar"></div>
      <div class="p-info">
        <div class="p-title">Вы (Низ)</div>
        <div class="p-walls-left">🧱 <span id="p1-walls-cnt">10</span></div>
      </div>
    </div>
    <div class="vs-sign">VS</div>
    <div id="badge-p2" class="p-badge" onclick="selectTurn(2)">
      <div class="p-avatar p2-avatar"></div>
      <div class="p-info">
        <div class="p-title">Враг (Верх)</div>
        <div class="p-walls-left">🧱 <span id="p2-walls-cnt">10</span></div>
      </div>
    </div>
  </div>
  <div class="board-frame" id="board-frame">
    <div class="goal-top"></div>
    <div id="board-grid"></div>
    <div class="goal-bottom"></div>
  </div>

  <div class="bottom-dock">
    <div class="dock-walls-count">🧱 Стен: <span id="dock-walls-val">10</span></div>
    <div id="dock-h" class="wall-btn" onpointerdown="startDragWall('h', event)" onclick="toggleWallTapMode('h')">
      <div class="shape-h"></div>
    </div>
    <div id="dock-v" class="wall-btn" onpointerdown="startDragWall('v', event)" onclick="toggleWallTapMode('v')">
      <div class="shape-v"></div>
    </div>
  </div>

  <div class="action-controls">
    <button id="btn-apply" class="btn-apply-best" onclick="applySuggestedMove()">✓ Применить ход</button>
    <button class="btn-undo" onclick="undoMove()">↩ Назад</button>
  </div>

  <div class="hint-label" id="hint-status">⚡ Совет: <b>Расчёт...</b></div>

  <button class="btn-settings" onclick="openSettings()">⚙️</button>

  <div class="settings-modal" id="settings-modal">
    <div class="settings-header">
      <h2>Настройки</h2>
      <button class="btn-close-set" onclick="closeSettings()">✕</button>
    </div>
    <div class="set-row">
      <span>Тёмная тема</span>
      <label class="switch">
        <input type="checkbox" id="theme-toggle" checked onchange="handleThemeToggle()">
        <span class="slider"></span>
      </label>
    </div>
    <div class="set-row">
      <span>Звуковые эффекты</span>
      <label class="switch">
        <input type="checkbox" id="sound-toggle" checked onchange="handleSoundToggle()">
        <span class="slider"></span>
      </label>
    </div>
    <div class="author-note">Создатель движка: @qufpx</div>
  </div>

  <div id="drag-ghost"></div>

<script>
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let soundOn = true;

  function playSound(type) {
    if (!soundOn) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      if (type === 'move') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      } else if (type === 'wall') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.12);
      }
    } catch(e){}
  }

  let state = {
    turn: 1, // 1 = Синий (Вы), 2 = Красный (Враг)
    p1: { r: 8, c: 4, walls: 10 },
    p2: { r: 0, c: 4, walls: 10 },
    hWalls: Array(8).fill(0).map(() => Array(8).fill(false)),
    vWalls: Array(8).fill(0).map(() => Array(8).fill(false))
  };

  let history = [];
  let bestEngineAction = null;
  let activeTapWallMode = null;

  function setStartingTurn(player) {
    state.turn = player;
    document.getElementById('first-p1').className = 'turn-opt ' + (player === 1 ? 'active-p1' : '');
    document.getElementById('first-p2').className = 'turn-opt ' + (player === 2 ? 'active-p2' : '');
    recalcAndRender();
  }

  function selectTurn(player) {
    state.turn = player;
    recalcAndRender();
  }

  function confirmReset() {
    if (confirm("Сбросить положение на доске?")) {
      state = {
        turn: 1,
        p1: { r: 8, c: 4, walls: 10 },
        p2: { r: 0, c: 4, walls: 10 },
        hWalls: Array(8).fill(0).map(() => Array(8).fill(false)),
        vWalls: Array(8).fill(0).map(() => Array(8).fill(false))
      };
      history = [];
      activeTapWallMode = null;
      document.getElementById('first-p1').className = 'turn-opt active-p1';
      document.getElementById('first-p2').className = 'turn-opt';
      recalcAndRender();
    }
  }

  function undoMove() {
    if (history.length > 0) {
      state = history.pop();
      activeTapWallMode = null;
      playSound('move');
      recalcAndRender();
    }
  }

  function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
  function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
  function handleThemeToggle() {
    const isDark = document.getElementById('theme-toggle').checked;
    if (isDark) document.body.classList.remove('light-theme');
    else document.body.classList.add('light-theme');
  }
  function handleSoundToggle() { soundOn = document.getElementById('sound-toggle').checked; }

  function hasWallBetween(r1, c1, r2, c2, hW = state.hWalls, vW = state.vWalls) {
    if (r1 === r2) {
      const minC = Math.min(c1, c2);
      if (minC >= 0 && minC < 8) {
        if (vW[r1][minC] || (r1 > 0 && vW[r1 - 1][minC])) return true;
      }
    } else if (c1 === c2) {
      const minR = Math.min(r1, r2);
      if (minR >= 0 && minR < 8) {
        if (hW[minR][c1] || (c1 > 0 && hW[minR][c1 - 1])) return true;
      }
    }
    return false;
  }
  function bfs(startR, startC, targetR, hW, vW) {
    let q = [{ r: startR, c: startC, d: 0 }];
    let visited = Array(9).fill(0).map(() => Array(9).fill(false));
    visited[startR][startC] = true;

    while (q.length > 0) {
      let { r, c, d } = q.shift();
      if (r === targetR) return d;
      const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
      for (let [dr, dc] of dirs) {
        let nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9 && !visited[nr][nc]) {
          if (!hasWallBetween(r, c, nr, nc, hW, vW)) {
            visited[nr][nc] = true;
            q.push({ r: nr, c: nc, d: d + 1 });
          }
        }
      }
    }
    return Infinity;
  }

  function isValidWall(r, c, type) {
    if (r < 0 || r >= 8 || c < 0 || c >= 8) return false;
    if (state.hWalls[r][c] || state.vWalls[r][c]) return false;
    if (type === 'h' && ((c > 0 && state.hWalls[r][c - 1]) || (c < 7 && state.hWalls[r][c + 1]))) return false;
    if (type === 'v' && ((r > 0 && state.vWalls[r - 1][c]) || (r < 7 && state.vWalls[r + 1][c]))) return false;

    let testH = state.hWalls.map(row => [...row]);
    let testV = state.vWalls.map(row => [...row]);
    if (type === 'h') testH[r][c] = true; else testV[r][c] = true;

    if (bfs(state.p1.r, state.p1.c, 0, testH, testV) === Infinity) return false;
    if (bfs(state.p2.r, state.p2.c, 8, testH, testV) === Infinity) return false;

    return true;
  }

  function getLegalMoves(player) {
    const me = player === 1 ? state.p1 : state.p2;
    const opp = player === 1 ? state.p2 : state.p1;
    let moves = [];
    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];

    for (let [dr, dc] of dirs) {
      let nr = me.r + dr, nc = me.c + dc;
      if (nr >= 0 && nr < 9 && nc >= 0 && nc < 9 && !hasWallBetween(me.r, me.c, nr, nc)) {
        if (nr === opp.r && nc === opp.c) {
          let jnr = nr + dr, jnc = nc + dc;
          if (jnr >= 0 && jnr < 9 && jnc >= 0 && jnc < 9 && !hasWallBetween(nr, nc, jnr, jnc)) {
            moves.push({ r: jnr, c: jnc });
          } else {
            const sideDirs = dr === 0 ? [[-1,0],[1,0]] : [[0,-1],[0,1]];
            for (let [sdr, sdc] of sideDirs) {
              let snr = nr + sdr, snc = nc + sdc;
              if (snr >= 0 && snr < 9 && snc >= 0 && snc < 9 && !hasWallBetween(nr, nc, snr, snc)) {
                moves.push({ r: snr, c: snc });
              }
            }
          }
        } else {
          moves.push({ r: nr, c: nc });
        }
      }
    }
    return moves;
  }

  function computeBestMoveForBlue() {
    if (state.p1.r === 0 || state.p2.r === 8) return null;

    let bestScore = -Infinity;
    let best = null;

    let moves = getLegalMoves(1);
    for (let m of moves) {
      let d1 = bfs(m.r, m.c, 0, state.hWalls, state.vWalls);
      let d2 = bfs(state.p2.r, state.p2.c, 8, state.hWalls, state.vWalls);
      let score = (d2 - d1) * 30 + (8 - m.r) * 5 + (4 - Math.abs(4 - m.c)) * 2;
      if (score > bestScore) {
        bestScore = score;
        best = { type: 'move', r: m.r, c: m.c };
      }
    }

    if (state.p1.walls > 0) {
      const baseD1 = bfs(state.p1.r, state.p1.c, 0, state.hWalls, state.vWalls);
      const baseD2 = bfs(state.p2.r, state.p2.c, 8, state.hWalls, state.vWalls);

      for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
          if (isValidWall(r, c, 'h')) {
            state.hWalls[r][c] = true;
            let nd1 = bfs(state.p1.r, state.p1.c, 0, state.hWalls, state.vWalls);
            let nd2 = bfs(state.p2.r, state.p2.c, 8, state.hWalls, state.vWalls);
            state.hWalls[r][c] = false;

            let diff = (nd2 - baseD2) - (nd1 - baseD1);
            if (diff >= 2) {
              let score = (nd2 - nd1) * 30 + diff * 15;
              if (score > bestScore) {
                bestScore = score;
                best = { type: 'wall_h', r, c };
              }
            }
          }
          if (isValidWall(r, c, 'v')) {
            state.vWalls[r][c] = true;
            let nd1 = bfs(state.p1.r, state.p1.c, 0, state.hWalls, state.vWalls);
            let nd2 = bfs(state.p2.r, state.p2.c, 8, state.hWalls, state.vWalls);
            state.vWalls[r][c] = false;

            let diff = (nd2 - baseD2) - (nd1 - baseD1);
            if (diff >= 2) {
              let score = (nd2 - nd1) * 30 + diff * 15;
              if (score > bestScore) {
                bestScore = score;
                best = { type: 'wall_v', r, c };
              }
            }
          }
        }
      }
    }

    return best;
  }

  function applySuggestedMove() {
    if (state.turn !== 1 || !bestEngineAction) return;
    if (bestEngineAction.type === 'move') {
      executeMove(bestEngineAction.r, bestEngineAction.c);
    } else if (bestEngineAction.type === 'wall_h') {
      executeWall(bestEngineAction.r, bestEngineAction.c, 'h');
    } else if (bestEngineAction.type === 'wall_v') {
      executeWall(bestEngineAction.r, bestEngineAction.c, 'v');
    }
  }

  function executeMove(r, c) {
    history.push(JSON.parse(JSON.stringify(state)));
    if (state.turn === 1) {
      state.p1.r = r; state.p1.c = c; state.turn = 2;
    } else {
      state.p2.r = r; state.p2.c = c; state.turn = 1;
    }
    playSound('move');
    activeTapWallMode = null;
    recalcAndRender();
  }

  function executeWall(r, c, type) {
    history.push(JSON.parse(JSON.stringify(state)));
    if (type === 'h') state.hWalls[r][c] = true;
    else state.vWalls[r][c] = true;

    if (state.turn === 1) {
      state.p1.walls--; state.turn = 2;
    } else {
      state.p2.walls--; state.turn = 1;
    }
    playSound('wall');
    activeTapWallMode = null;
    recalcAndRender();
  }
  function toggleWallTapMode(type) {
    if (activeTapWallMode === type) activeTapWallMode = null;
    else activeTapWallMode = type;
    render();
  }

  function recalcAndRender() {
    const applyBtn = document.getElementById('btn-apply');
    if (state.turn === 1) {
      bestEngineAction = computeBestMoveForBlue();
      const statusEl = document.getElementById('hint-status');
      if (bestEngineAction) {
        applyBtn.disabled = false;
        if (bestEngineAction.type === 'move') {
          statusEl.innerHTML = `⚡ Совет: <b>Шаг фишкой (${bestEngineAction.r + 1}, ${bestEngineAction.c + 1})</b>`;
        } else if (bestEngineAction.type === 'wall_h') {
          statusEl.innerHTML = `⚡ Совет: <b>Стена Гориз. (ряд ${bestEngineAction.r + 1})</b>`;
        } else {
          statusEl.innerHTML = `⚡ Совет: <b>Стена Верт. (кол. ${bestEngineAction.c + 1})</b>`;
        }
      } else {
        applyBtn.disabled = true;
      }
    } else {
      bestEngineAction = null;
      applyBtn.disabled = true;
      document.getElementById('hint-status').innerHTML = `⏳ <b>Ход противника</b> (укажите ход)`;
    }
    render();
  }

  function render() {
    const grid = document.getElementById('board-grid');
    grid.innerHTML = '';

    document.getElementById('p1-walls-cnt').innerText = state.p1.walls;
    document.getElementById('p2-walls-cnt').innerText = state.p2.walls;
    document.getElementById('dock-walls-val').innerText = state.turn === 1 ? state.p1.walls : state.p2.walls;

    document.getElementById('badge-p1').className = 'p-badge ' + (state.turn === 1 ? 'active-turn-1' : '');
    document.getElementById('badge-p2').className = 'p-badge ' + (state.turn === 2 ? 'active-turn-2' : '');

    document.getElementById('dock-h').className = 'wall-btn ' + (activeTapWallMode === 'h' ? 'active-tap' : '');
    document.getElementById('dock-v').className = 'wall-btn ' + (activeTapWallMode === 'v' ? 'active-tap' : '');

    const legalMoves = getLegalMoves(state.turn);

    for (let r = 0; r < 17; r++) {
      for (let c = 0; c < 17; c++) {
        const isCellRow = (r % 2 === 0);
        const isCellCol = (c % 2 === 0);

        if (isCellRow && isCellCol) {
          const cellR = r / 2;
          const cellC = c / 2;
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (state.p1.r === cellR && state.p1.c === cellC) {
            const p = document.createElement('div');
            p.className = 'pawn p1-pawn';
            cell.appendChild(p);
          } else if (state.p2.r === cellR && state.p2.c === cellC) {
            const p = document.createElement('div');
            p.className = 'pawn p2-pawn';
            cell.appendChild(p);
          }

          const isLegal = legalMoves.some(m => m.r === cellR && m.c === cellC);
          const isBest = (state.turn === 1 && bestEngineAction?.type === 'move' && bestEngineAction.r === cellR && bestEngineAction.c === cellC);

          if (isBest) {
            cell.classList.add('best-move');
            const icon = document.createElement('div');
            icon.className = 'best-move-icon';
            icon.innerText = '★';
            cell.appendChild(icon);
            cell.onclick = () => executeMove(cellR, cellC);
          } else if (isLegal) {
            const dot = document.createElement('div');
            dot.className = 'move-dot ' + (state.turn === 1 ? 'blue-dot' : '');
            cell.appendChild(dot);
            cell.onclick = () => executeMove(cellR, cellC);
          }

          grid.appendChild(cell);
        } else if (!isCellRow && isCellCol) {
          const wallR = (r - 1) / 2;
          const wallC = c / 2;
          const slot = document.createElement('div');
          slot.className = 'wall-slot-h';

          const isPlaced = state.hWalls[wallR]?.[wallC] || (wallC > 0 && state.hWalls[wallR]?.[wallC - 1]);
          const isBestWall = (state.turn === 1 && bestEngineAction?.type === 'wall_h' && bestEngineAction.r === wallR && (bestEngineAction.c === wallC || bestEngineAction.c === wallC - 1));

          if (isPlaced) slot.classList.add('wall-placed-h');
          if (isBestWall) slot.classList.add('wall-best-hint');

          slot.onclick = () => {
            if (activeTapWallMode === 'h') {
              let targetC = wallC < 8 ? wallC : wallC - 1;
              if (isValidWall(wallR, targetC, 'h')) executeWall(wallR, targetC, 'h');
            }
          };
          grid.appendChild(slot);
        } else if (isCellRow && !isCellCol) {
          const wallR = r / 2;
          const wallC = (c - 1) / 2;
          const slot = document.createElement('div');
          slot.className = 'wall-slot-v';

          const isPlaced = state.vWalls[wallR]?.[wallC] || (wallR > 0 && state.vWalls[wallR - 1]?.[wallC]);
          const isBestWall = (state.turn === 1 && bestEngineAction?.type === 'wall_v' && bestEngineAction.c === wallC && (bestEngineAction.r === wallR || bestEngineAction.r === wallR - 1));

          if (isPlaced) slot.classList.add('wall-placed-v');
          if (isBestWall) slot.classList.add('wall-best-hint');

          slot.onclick = () => {
            if (activeTapWallMode === 'v') {
              let targetR = wallR < 8 ? wallR : wallR - 1;
              if (isValidWall(targetR, wallC, 'v')) executeWall(targetR, wallC, 'v');
            }
          };
          grid.appendChild(slot);
        } else {
          const dot = document.createElement('div');
          dot.className = 'wall-slot-dot';
          grid.appendChild(dot);
        }
      }
    }
  }

  let draggingType = null;
  const ghost = document.getElementById('drag-ghost');
  const boardFrame = document.getElementById('board-frame');

  function startDragWall(type, e) {
    const curWalls = state.turn === 1 ? state.p1.walls : state.p2.walls;
    if (curWalls <= 0) return;

    draggingType = type;
    ghost.style.display = 'block';
    ghost.style.background = 'var(--wall-color)';
    ghost.style.width = type === 'h' ? '60px' : '10px';
    ghost.style.height = type === 'h' ? '10px' : '60px';
    ghost.style.boxShadow = '0 0 14px rgba(245, 158, 11, 0.8)';

    document.addEventListener('pointermove', onDragMove, { passive: false });
    document.addEventListener('pointerup', onDragEnd);
    onDragMove(e);
  }

  function onDragMove(e) {
    if (!draggingType) return;
    if (e.cancelable) e.preventDefault();

    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';

    const rect = boardFrame.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      const cellW = rect.width / 9;
      const cellH = rect.height / 9;
      let c = Math.round((e.clientX - rect.left) / cellW) - 1;
      let r = Math.round((e.clientY - rect.top) / cellH) - 1;
      c = Math.max(0, Math.min(7, c));
      r = Math.max(0, Math.min(7, r));

      const valid = isValidWall(r, c, draggingType);
      ghost.style.background = valid ? 'var(--hint)' : 'var(--danger)';
      ghost.style.boxShadow = valid ? '0 0 16px var(--hint)' : '0 0 16px var(--danger)';
    } else {
      ghost.style.background = 'var(--wall-color)';
      ghost.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
    }
  }

  function onDragEnd(e) {
    if (!draggingType) return;
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);

    const rect = boardFrame.getBoundingClientRect();
    if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
      const cellW = rect.width / 9;
      const cellH = rect.height / 9;
      let c = Math.round((e.clientX - rect.left) / cellW) - 1;
      let r = Math.round((e.clientY - rect.top) / cellH) - 1;
      c = Math.max(0, Math.min(7, c));
      r = Math.max(0, Math.min(7, r));

      if (isValidWall(r, c, draggingType)) {
        executeWall(r, c, draggingType);
      }
    }

    ghost.style.display = 'none';
    draggingType = null;
  }

  recalcAndRender();
</script>
</body>
