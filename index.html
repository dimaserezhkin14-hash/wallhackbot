<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b111e">
<title>WallRush GrandMaster Engine Pro</title>
<style>
:root{
  --bg:#0b111e;--panel:#151f32;--panel2:#1c2940;--text:#eef4ff;--muted:#8b9ab3;--line:#2b3a54;
  --blue:#347fff;--blueDeep:#2455a8;--red:#e33b50;--redDeep:#a92335;--green:#39e0a1;
  --board:#111a29;--boardLine:#34445c;--boardEdge:#26344b;--danger:#ff5667;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
body{padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;user-select:none}

#appBlocker{
  position:fixed;
  inset:0;
  z-index:999999;
  background:#0b111e;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  font-family:Inter,system-ui,sans-serif;
  color:#fff;
}

.app{
  width:min(100%,680px);
  height:100dvh;
  margin:auto;
  padding:4px 0 4px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  gap:5px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex:0 0 32px;
  height:32px;
  width:100%;
}
.brand{display:flex;align-items:center;gap:6px}
.brand-mark{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,#3b86ff,#195bd4);box-shadow:0 3px 8px #1c61d055;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px}
.brand-mark i{background:#fff;border-radius:1.5px}
.brand-name{font-size:16px;font-weight:950;letter-spacing:-.4px}

.resign-btn{
  background:#261824;
  border:1px solid #5a2634;
  color:#ff7a88;
  border-radius:8px;
  padding:0 9px;
  height:28px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  white-space:nowrap;
  transition:background .15s ease, transform .1s ease;
}
.resign-btn:active{background:#381c2b;transform:scale(0.97)}

.control-bar{
  display:flex;
  gap:6px;
  align-items:center;
  width:100%;
  flex:0 0 28px;
  height:28px;
}

.ctrl-btn{
  background:#18243a;
  border:1px solid #2b3d58;
  color:#eef4ff;
  border-radius:8px;
  height:28px;
  padding:0 8px;
  font-size:11px;
  font-weight:900;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  white-space:nowrap;
  flex:1 1 0;
  min-width:0;
  transition:background .15s ease, transform .1s ease;
}
.ctrl-btn:active{background:#233552;transform:scale(0.98)}

.turn-badge{
  padding:2px 6px;
  border-radius:4px;
  font-size:9.5px;
  font-weight:950;
}
.turn-badge.me{background:#2768dd;color:#fff}
.turn-badge.opp{background:#bd263a;color:#fff}
.turn-badge.blue{background:#2768dd;color:#fff}
.turn-badge.red{background:#bd263a;color:#fff}

.finish-bar-wrap{
  flex:0 0 14px;
  height:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.finish-bar{
  display:none;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
}
.finish-bar.visible{
  display:flex;
  animation:popIn .25s ease;
}
.finish-line{
  flex:1;
  height:1.5px;
  background:#1e8e60;
  box-shadow:0 0 6px rgba(30, 142, 96, 0.4);
}
.finish-label{
  display:flex;
  align-items:center;
  gap:4px;
  font-size:10.5px;
  font-weight:950;
  color:#1ebf7c;
  letter-spacing:3px;
}

.players-wrap{position:relative;flex:0 0 44px;height:44px}
.players{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:6px;width:100%;height:100%}
.player{
  height:44px;
  width:100%;
  min-width:0;
  background:var(--panel);
  border:2px solid transparent;
  border-radius:12px;
  padding:3px 8px;
  display:flex;
  align-items:center;
  gap:6px;
  position:relative;
  user-select:none;
  transition:border-color .25s ease, box-shadow .25s ease, background .25s ease;
}

.player.is-blue{background:linear-gradient(135deg,#315b9e,#244780)}
.player.is-red{background:linear-gradient(135deg,#e14858,#bd263a)}
.player.is-blue.active{border-color:#9dbdff;box-shadow:0 0 0 2.5px #6f9cff33,0 4px 12px #276de344}
.player.is-red.active{border-color:#ff8792;box-shadow:0 0 0 2.5px #ff566733,0 4px 12px #d72d3c44}

.player .ball{width:26px;height:26px;border-radius:50%;flex:none;box-shadow:inset -4px -5px 7px #0008,inset 3px 3px 6px #fff8,0 3px 8px #0008;transition:transform .2s ease}
.ball.blue{background:radial-gradient(circle at 30% 23%,#bcdcff,#4e91ff 42%,#1646a1)}
.ball.red{background:radial-gradient(circle at 30% 23%,#ffd0d4,#ff6370 42%,#a7192b)}
.ptext{min-width:0;flex:1 1 0;overflow:hidden}
.pname{font-size:11px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{font-size:10px;margin-top:1px;color:#eaf1ff}
.wallcount{font-size:11.5px;font-weight:950}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#18243a;color:#8e9bb2;border-radius:7px;padding:2px 5px;font-weight:950;font-size:8.5px;pointer-events:none}

.board-frame{
  position:relative;
  padding:0;
  flex:1 1 auto;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  overflow:hidden;
}

.board-shell{
  position:relative;
  border-radius:16px;
  overflow:hidden;
  background:var(--board);
  box-shadow:inset 0 0 0 1px #26354c,0 6px 20px #0008;
  flex:0 0 auto;
}

.board-shell.mode-race:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:2;
  border-top:3px solid #2ae48f;
  box-shadow:inset 0 1px 0 #46ffaa, 0 -1px 8px rgba(42, 228, 143, 0.4);
  background:linear-gradient(to bottom, rgba(30, 191, 124, 0.22) 0%, rgba(30, 191, 124, 0.07) 12%, transparent 26%);
  border-top-left-radius:16px;
  border-top-right-radius:16px;
}

.glow-edge{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  opacity:0;
  transition:opacity .35s cubic-bezier(0.4, 0, 0.2, 1);
}
.glow-edge.bottom-glow{
  background:linear-gradient(to top, rgba(57, 135, 255, 0.32) 0%, rgba(57, 135, 255, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 -10px 24px rgba(52, 127, 255, 0.45);
}
.glow-edge.top-glow{
  background:linear-gradient(to bottom, rgba(227, 59, 80, 0.32) 0%, rgba(227, 59, 80, 0.08) 22%, transparent 40%);
  box-shadow:inset 0 10px 24px rgba(227, 59, 80, 0.45);
}
.glow-edge.active{opacity:1}

.board-grid{
  position:absolute;
  inset:0;
  display:grid;
  z-index:1;
}
.cell{
  position:relative;
  border-right:1px solid #34445c;
  border-bottom:1px solid #34445c;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  touch-action:manipulation;
}
.cell.legal:after{
  content:"";
  width:9px;
  height:9px;
  border-radius:50%;
  background:#367ddd;
  box-shadow:0 0 8px #367ddd88;
  animation:dotPop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes dotPop{from{transform:scale(0.3);opacity:0}to{transform:scale(1);opacity:1}}

.cell.engine{background:#39e0a11a!important;position:relative}
.cell.engine:before{content:"";position:absolute;inset:2px;border:2px solid #52e9b6;border-radius:6px;box-shadow:0 0 10px #39e0a1aa,inset 0 0 5px #39e0a133;animation:pulseBest 1.1s ease-in-out infinite;pointer-events:none}
.cell.engine:after{content:"BEST";position:absolute;right:2px;top:2px;color:#eafff7;background:#159b70;border-radius:3px;padding:1px 2.5px;font-size:5.5px;font-weight:950;letter-spacing:.4px;z-index:7}
@keyframes pulseBest{50%{transform:scale(.94);opacity:.72}}

.piece-layer{position:absolute;inset:0;pointer-events:none;z-index:6}
.board-piece{
  position:absolute;
  border-radius:50%;
  transform:translate(-50%,-50%);
  box-shadow:inset -4px -5px 8px #0008,inset 3px 3px 6px #fff9,0 5px 10px #0009;
  transition:left .22s cubic-bezier(0.34, 1.3, 0.64, 1), top .22s cubic-bezier(0.34, 1.3, 0.64, 1);
  will-change:left, top;
}
.board-piece.blue{background:radial-gradient(circle at 29% 22%,#d5e9ff,#3987ff 45%,#174ba9)!important}
.board-piece.red{background:radial-gradient(circle at 29% 22%,#ffd9dc,#e84859 45%,#9e1729)!important}

.wall-layer{position:absolute;inset:0;z-index:10;pointer-events:none}
.wall-piece{
  position:absolute;
  border-radius:4px;
  background:linear-gradient(180deg,#485a79,#202d47);
  border:1.5px solid #6f81a0;
  box-shadow:0 3px 8px #1c294955,inset 1px 1px 2px #fff3;
  pointer-events:none;
  animation:wallDrop .2s cubic-bezier(0.34, 1.4, 0.64, 1);
}
@keyframes wallDrop{0%{transform:translate(-50%,-50%) scale(0.5);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

.wall-piece.h{height:8px;transform:translate(-50%,-50%)}
.wall-piece.v{width:8px;transform:translate(-50%,-50%)}
.wall-piece.engine{background:linear-gradient(180deg,#58efb9,#168e67)!important;border-color:#9dffe0!important;box-shadow:0 0 12px #39e0a1cc,0 3px 8px #0005!important;z-index:15}
.wall-piece.ghost{opacity:.95;border-style:dashed;filter:drop-shadow(0 6px 6px #0009);z-index:20;animation:none}
.wall-piece.ghost.bad{background:linear-gradient(180deg,#ff6b79,#9e1f31)!important;border-color:#ffadb5!important;box-shadow:0 0 12px #ff5364aa!important}

.bottom-container{
  display:flex;
  flex-direction:column;
  gap:5px;
  flex:0 0 auto;
}
.bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.apply{height:40px;border-radius:12px;background:linear-gradient(135deg,#3c86ff,#285bc6);color:#fff;font-weight:950;font-size:12.5px;box-shadow:0 4px 12px #2768dd33;cursor:pointer;transition:transform .12s}
.apply:active{transform:scale(0.98)}
.apply:disabled{opacity:.32;filter:grayscale(.7);box-shadow:none;cursor:default}
.undo{height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:12.5px;cursor:pointer;transition:transform .12s}
.undo:active{transform:scale(0.98)}

.dock{background:#121c2b;color:#dbe5f5;border-radius:13px;padding:4px 8px;display:grid;grid-template-columns:40px 1fr 1fr;gap:6px;border:1px solid #24344c;width:100%;touch-action:none}
.dock-count{display:flex;align-items:center;justify-content:center;gap:3px;font-weight:950;font-size:13px}
.wall-tool{
  height:38px;
  border-radius:10px;
  background:#18243a;
  box-shadow:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  touch-action:none;
  transition:all .15s ease;
}
.wall-tool.active{box-shadow:0 0 0 2px #39e0a166;color:#5ee9b8}
.wall-tool:active{cursor:grabbing;transform:scale(0.98)}

.wall-icon{
  display:block;
  background:linear-gradient(180deg,#5a6e91,#283857);
  border:1px solid #8295b7;
  border-radius:2px;
  box-shadow:0 2px 4px #0004;
}
.wall-tool[data-orient="h"] .wall-icon{width:22px;height:6px}
.wall-tool[data-orient="v"] .wall-icon{width:6px;height:22px}

.settings{
  width:100%;
  height:38px;
  border-radius:12px;
  background:#18243a;
  color:#fff;
  border:1px solid #2a3b55;
  box-shadow:0 3px 10px #0005;
  font-weight:950;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  cursor:pointer;
  transition:transform .12s}
.settings:active{transform:scale(0.99)}
.settings span{font-size:14px}

.modal{position:fixed;inset:0;z-index:100;background:#050a14dd;backdrop-filter:blur(12px);display:none;padding:16px}
.modal.open{display:flex}.modal-card{width:min(100%,520px);margin:auto;min-height:44vh;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;box-shadow:0 20px 60px #0009}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.modal-head h2{margin:0;font-size:18px}.close{width:34px;height:34px;border-radius:9px;background:var(--panel2);font-size:20px;cursor:pointer}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.setting small{display:block;color:var(--muted);margin-top:2px;font-size:10.5px}
.switch{width:46px;height:26px;border-radius:16px;background:#41516c;padding:2.5px;cursor:pointer}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.18s}.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}
.theme{display:flex;gap:5px}.theme button{padding:6px 10px;border-radius:8px;background:var(--panel2);font-size:11px;cursor:pointer}.theme button.active{outline:2px solid var(--blue)}

.author-box{
  margin-top:auto;
  padding-top:14px;
  text-align:center;
  font-size:13px;
  font-weight:800;
  color:#9eb1d1;
  letter-spacing:.3px;
}
.author-box a{color:#52a5ff;text-decoration:none}

.light{--board:#eef1f7;--boardLine:#b8c0d0;--boardEdge:#aab5ca;--bg:#edf1f8;--panel:#fff;--panel2:#edf1f7;--text:#1c2940;--muted:#78869e;--line:#d5ddea}
.light .cell{border-right-color:#c4cddc;border-bottom-color:#c4cddc}
.light .resign-btn,.light .undo,.light .ctrl-btn{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .dock{background:#fff;border-color:#d5ddea;color:#1c2940}
.light .wall-tool{background:#edf2f9;color:#1c2940}
.light .wall-icon{background:linear-gradient(180deg,#c8d4ec,#8da0c4);border-color:#a4b6d4}
.light .settings{background:#233554;color:#fff}
.light .author-box{color:#435574}
</style>
</head>

<script>
"use strict";

const tg=window.Telegram?.WebApp;
if(tg){
  tg.ready(); tg.expand();
  try{tg.setHeaderColor("#0b111e");tg.setBackgroundColor("#0b111e");tg.enableClosingConfirmation()}catch(e){}
}

async function verifyAccessSystem() {
  const SECRET = "wallrush_ultra_secret_key_2026";
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  
  let uid = params.get("uid");
  let exp = parseInt(params.get("exp"), 10);
  let sign = params.get("sign");
  const tgUid = tg?.initDataUnsafe?.user?.id;

  async function checkSign(testUid, testExp, testSign) {
    if (!testUid || !testExp || !testSign) return false;
    if (testExp <= Math.floor(Date.now() / 1000)) return false;
    if (tgUid && String(testUid) !== String(tgUid)) return false;

    try {
      const encoder = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw",
        encoder.encode(SECRET),
        { name: "HMAC", hash: "SHA-256" },
        false,
        ["sign"]
      );
      const signatureBuffer = await crypto.subtle.sign(
        "HMAC",
        key,
        encoder.encode(`${testUid}:${testExp}`)
      );
      const computedSign = Array.from(new Uint8Array(signatureBuffer))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
      return computedSign === testSign;
    } catch (e) {
      return false;
    }
  }

  if (await checkSign(uid, exp, sign)) {
    try { tg?.CloudStorage?.setItem("sub_token", `${uid}:${exp}:${sign}`); } catch(e){}
    try { localStorage.setItem("sub_token", `${uid}:${exp}:${sign}`); } catch(e){}
    unlockApp();
    return;
  }

  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem("sub_token", async (err, val) => {
      if (!err && val) {
        const [cUid, cExp, cSign] = val.split(":");
        if (await checkSign(cUid, parseInt(cExp, 10), cSign)) {
          unlockApp();
          return;
        }
      }
      checkLocalStorage();
    });
  } else {
    checkLocalStorage();
  }

  async function checkLocalStorage() {
    try {
      const localVal = localStorage.getItem("sub_token");
      if (localVal) {
        const [lUid, lExp, lSign] = localVal.split(":");
        if (await checkSign(lUid, parseInt(lExp, 10), lSign)) {
          unlockApp();
          return;
        }
      }
    } catch(e){}
  }

  function unlockApp() {
    const blocker = document.getElementById("appBlocker");
    if (blocker) blocker.remove();
  }
}

// ============================================================
// ИСТИННЫЙ MINIMAX-ДВИЖОК ГЛУБОКОГО ПРОСЧЕТА ТЕМПА И СЕТОК
// ============================================================

const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
let state, history = [], engineMove = null, selectedWall = null, soundOn = true, theme = "dark";
let gameMode = "duel";
let firstTurnSetting = "me";
let myColorSetting = "blue";
let raceSideSetting = "right";
let raceWallsSetting = 15;
let audio = null, dragging = false, dragOrient = null, ghostEl = null, ghostAnchor = null;

/*
 * WALLHACK GRANDMASTER CORE
 * -------------------------
 * This replaces the old "shortest-path + shallow alpha-beta" behavior.
 *
 * Design goals:
 *  1) Never throw away a tactically relevant wall before search.
 *  2) Treat a position that is already a forced race loss as a LOSS,
 *     rather than trying to rescue it with a cosmetic path score.
 *  3) Search both pawn moves and wall moves adversarially.
 *  4) Use quiescence/tactical extensions around races, forced blocks,
 *     corridor traps and endgames.
 *  5) Use a bounded exact solver when very few walls remain.
 *  6) Keep the browser responsive with iterative deepening and a hard
 *     deadline; the last completed iteration is always returned.
 *
 * This is still a deterministic browser engine, not a trained neural net.
 * The important upgrade here is correctness of the search/evaluation,
 * not pretending that a heuristic is "AI training".
 */
const ENGINE = {
  timeMs: 1800,
  maxDepth: 11,
  rootWallLimit: 96,
  nodeWallLimit: 36,
  ttMax: 320000,
  exactRemainingWalls: 4,
  tacticalDepth: 5,
  quiescenceDepth: 4
};

let engineStats = {nodes:0,depth:0,elapsed:0,ttHits:0,cutoffs:0,exact:0,tactical:0};
let engineDeadline = 0;
let engineAborted = false;
const TT = new Map();
const EXACT_TT = new Map();

function getBoardRows(){ return gameMode === "race" ? 13 : 9; }
function getBoardCols(){ return 9; }

function getGoalRow(player){
  if(gameMode === "race") return 0;
  return player === "me" ? 0 : 8;
}

function getDefaultWalls(){
  return gameMode === "duel" ? 10 : raceWallsSetting;
}

function initialState(){
  const rows = getBoardRows();
  const initWalls = getDefaultWalls();
  let mePos, oppPos;
  if(gameMode === "race"){
    const myCol = raceSideSetting === "right" ? 6 : 2;
    const oppCol = raceSideSetting === "right" ? 2 : 6;
    mePos = {r:rows-1, c:myCol, walls:initWalls};
    oppPos = {r:rows-1, c:oppCol, walls:initWalls};
  } else {
    mePos = {r:8, c:4, walls:initWalls};
    oppPos = {r:0, c:4, walls:initWalls};
  }
  return {turn:firstTurnSetting, gameOver:false, me:mePos, opp:oppPos, walls:new Set()};
}

function wallKey(r,c,o){ return r+","+c+","+o; }

function cloneState(){
  return {
    turn:state.turn, gameOver:state.gameOver,
    me:{...state.me}, opp:{...state.opp}, walls:new Set(state.walls)
  };
}

function save(){
  history.push(cloneState());
  if(history.length > 100) history.shift();
}

function restore(s){
  state = {turn:s.turn, gameOver:s.gameOver, me:{...s.me}, opp:{...s.opp}, walls:new Set(s.walls)};
  engineMove = null; selectedWall = null;
  render(true); computeEngine();
}

function inBoard(r,c){
  return r >= 0 && r < getBoardRows() && c >= 0 && c < 9;
}

function edgeBlocked(a,b,walls=state.walls){
  const dr=b.r-a.r, dc=b.c-a.c;
  if(dr === 0 && Math.abs(dc) === 1){
    const c=Math.min(a.c,b.c);
    return walls.has(wallKey(a.r,c,"v")) ||
           walls.has(wallKey(a.r-1,c,"v"));
  }
  if(dc === 0 && Math.abs(dr) === 1){
    const r=Math.min(a.r,b.r);
    return walls.has(wallKey(r,a.c,"h")) ||
           walls.has(wallKey(r,a.c-1,"h"));
  }
  return true;
}

function rawNeighbors(pos,walls=state.walls){
  const out=[];
  for(const [dr,dc] of dirs){
    const nr=pos.r+dr,nc=pos.c+dc;
    if(inBoard(nr,nc)){
      const n={r:nr,c:nc};
      if(!edgeBlocked(pos,n,walls)) out.push(n);
    }
  }
  return out;
}

function legalMoves(player,walls=state.walls,pos=null,otherPos=null){
  const me=pos || state[player];
  const other=otherPos || state[player==="me"?"opp":"me"];
  const out=[];
  for(const n of rawNeighbors(me,walls)){
    if(n.r===other.r && n.c===other.c){
      const dr=n.r-me.r, dc=n.c-me.c;
      const jump={r:other.r+dr,c:other.c+dc};
      if(inBoard(jump.r,jump.c) && !edgeBlocked(other,jump,walls)){
        out.push(jump);
      }else{
        const sides=[
          {r:other.r+dc,c:other.c-dr},
          {r:other.r-dc,c:other.c+dr}
        ];
        for(const x of sides){
          if(inBoard(x.r,x.c) && !edgeBlocked(other,x,walls)) out.push(x);
        }
      }
    }else{
      out.push(n);
    }
  }
  return out;
}

/* Fast BFS scratch. Board max is 13*9 = 117 cells. */
const qArr=new Int16Array(128);
const distArr=new Int8Array(128);
const countArr=new Uint16Array(128);

function shortestPath(player,walls=state.walls,start=null){
  const s=start || state[player], goalRow=getGoalRow(player);
  const rows=getBoardRows(), total=rows*9;
  if(s.r===goalRow) return 0;
  distArr.fill(-1,0,total);
  let head=0,tail=0;
  const startIdx=s.r*9+s.c;
  distArr[startIdx]=0;
  qArr[tail++]=startIdx;
  while(head<tail){
    const idx=qArr[head++];
    const r=(idx/9)|0,c=idx%9,d=distArr[idx];
    if(r===goalRow) return d;
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=rows||nc<0||nc>=9) continue;
      const ni=nr*9+nc;
      if(distArr[ni]!==-1) continue;
      let blocked=false;
      if(dr===0){
        const mc=Math.min(c,nc);
        blocked=walls.has(wallKey(r,mc,"v"))||walls.has(wallKey(r-1,mc,"v"));
      }else{
        const mr=Math.min(r,nr);
        blocked=walls.has(wallKey(mr,c,"h"))||walls.has(wallKey(mr,c-1,"h"));
      }
      if(!blocked){
        distArr[ni]=d+1;
        qArr[tail++]=ni;
      }
    }
  }
  return Infinity;
}

function getOptimalPath(player,walls=state.walls,start=null){
  const s=start || state[player], goalRow=getGoalRow(player);
  const rows=getBoardRows(), total=rows*9;
  if(s.r===goalRow) return [];
  distArr.fill(-1,0,total);
  const parent=new Int16Array(total).fill(-1);
  let head=0,tail=0,target=-1;
  const startIdx=s.r*9+s.c;
  distArr[startIdx]=0;qArr[tail++]=startIdx;
  while(head<tail){
    const idx=qArr[head++];
    const r=(idx/9)|0,c=idx%9,d=distArr[idx];
    if(r===goalRow){target=idx;break;}
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=rows||nc<0||nc>=9) continue;
      const ni=nr*9+nc;
      if(distArr[ni]!==-1) continue;
      let blocked=false;
      if(dr===0){
        const mc=Math.min(c,nc);
        blocked=walls.has(wallKey(r,mc,"v"))||walls.has(wallKey(r-1,mc,"v"));
      }else{
        const mr=Math.min(r,nr);
        blocked=walls.has(wallKey(mr,c,"h"))||walls.has(wallKey(mr,c-1,"h"));
      }
      if(!blocked){distArr[ni]=d+1;parent[ni]=idx;qArr[tail++]=ni;}
    }
  }
  const path=[];
  if(target!==-1){
    let cur=target;
    while(cur!==startIdx&&cur!==-1){
      path.push({r:(cur/9)|0,c:cur%9});cur=parent[cur];
    }
    path.reverse();
  }
  return path;
}

/* Count shortest routes, capped. This is deliberately not a heuristic
   replacement for path legality: it measures whether the pawn has one
   brittle corridor or several independent exits. */
function shortestPathInfo(player,walls,pos=null){
  const s=pos || state[player], goalRow=getGoalRow(player);
  const rows=getBoardRows(), total=rows*9;
  const start=s.r*9+s.c;
  distArr.fill(-1,0,total);
  countArr.fill(0,0,total);
  let head=0,tail=0;
  distArr[start]=0; countArr[start]=1; qArr[tail++]=start;
  let goalDist=Infinity, goalWays=0;
  while(head<tail){
    const idx=qArr[head++];
    const r=(idx/9)|0,c=idx%9,d=distArr[idx];
    if(d>goalDist) continue;
    if(r===goalRow){
      if(d<goalDist){goalDist=d;goalWays=countArr[idx];}
      else if(d===goalDist) goalWays=Math.min(255,goalWays+countArr[idx]);
      continue;
    }
    for(const [dr,dc] of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr<0||nr>=rows||nc<0||nc>=9) continue;
      const ni=nr*9+nc;
      let blocked=false;
      if(dr===0){
        const mc=Math.min(c,nc);
        blocked=walls.has(wallKey(r,mc,"v"))||walls.has(wallKey(r-1,mc,"v"));
      }else{
        const mr=Math.min(r,nr);
        blocked=walls.has(wallKey(mr,c,"h"))||walls.has(wallKey(mr,c-1,"h"));
      }
      if(blocked) continue;
      if(distArr[ni]===-1){
        distArr[ni]=d+1;countArr[ni]=countArr[idx];qArr[tail++]=ni;
      }else if(distArr[ni]===d+1){
        countArr[ni]=Math.min(255,countArr[ni]+countArr[idx]);
      }
    }
  }
  return {dist:goalDist, ways:goalWays};
}

/* Exact wall legality, including overlap/crossing and mandatory path
   existence for both players. */
function legalWall(r,c,o,walls=state.walls){
  const maxR=getBoardRows()-2;
  if((o!=="h"&&o!=="v")||r<0||r>maxR||c<0||c>7) return false;
  const k=wallKey(r,c,o);
  if(walls.has(k)) return false;
  if(o==="h"){
    if(walls.has(wallKey(r,c,"v"))) return false;
    if(walls.has(wallKey(r,c-1,"h"))||walls.has(wallKey(r,c+1,"h"))) return false;
  }else{
    if(walls.has(wallKey(r,c,"h"))) return false;
    if(walls.has(wallKey(r-1,c,"v"))||walls.has(wallKey(r+1,c,"v"))) return false;
  }
  const copy=new Set(walls); copy.add(k);
  return shortestPath("me",copy)!==Infinity &&
         shortestPath("opp",copy)!==Infinity;
}

function wallGeometryLegal(r,c,o,walls=state.walls){
  const maxR=getBoardRows()-2;
  if((o!=="h"&&o!=="v")||r<0||r>maxR||c<0||c>7) return false;
  const k=wallKey(r,c,o);
  if(walls.has(k)) return false;
  if(o==="h"){
    return !walls.has(wallKey(r,c,"v")) &&
           !walls.has(wallKey(r,c-1,"h")) &&
           !walls.has(wallKey(r,c+1,"h"));
  }
  return !walls.has(wallKey(r,c,"h")) &&
         !walls.has(wallKey(r-1,c,"v")) &&
         !walls.has(wallKey(r+1,c,"v"));
}

function allValidWalls(walls=state.walls){
  const out=[],maxR=getBoardRows()-2;
  for(let r=0;r<=maxR;r++) for(let c=0;c<8;c++){
    if(wallGeometryLegal(r,c,"h",walls) && legalWall(r,c,"h",walls)) out.push({r,c,o:"h"});
    if(wallGeometryLegal(r,c,"v",walls) && legalWall(r,c,"v",walls)) out.push({r,c,o:"v"});
  }
  return out;
}

/* Zobrist-like deterministic hash for transposition tables. */
function mix32(x){
  x|=0;x=Math.imul(x^(x>>>16),0x7feb352d);
  x=Math.imul(x^(x>>>15),0x846ca68b);
  return (x^(x>>>16))>>>0;
}
function wallHashPair(r,c,o){
  const code=((r+1)*31+(c+1)*7+(o==="h"?1:2))|0;
  return [mix32(code^0x9e3779b9),mix32(code^0x85ebca6b)];
}
function initialWallHash(walls){
  let h1=0,h2=0;
  for(const k of walls){
    const [r,c,o]=k.split(",");
    const [a,b]=wallHashPair(+r,+c,o);
    h1^=a;h2^=b;
  }
  return [h1>>>0,h2>>>0];
}
function stateTTKey(h1,h2,myPos,oppPos,myWalls,oppWalls,isMax){
  return h1+"|"+h2+"|"+myPos.r+","+myPos.c+"|"+oppPos.r+","+oppPos.c+
         "|"+myWalls+"|"+oppWalls+"|"+(isMax?1:0)+"|"+(gameMode==="race"?1:0);
}
function ttTrim(){
  if(TT.size<=ENGINE.ttMax) return;
  const drop=Math.floor(ENGINE.ttMax*0.2);
  let i=0;
  for(const k of TT.keys()){TT.delete(k);if(++i>=drop)break;}
}

/* Candidate ranking is deliberately tactical. We NEVER use "centrality"
   as a reason to delete a wall that actually changes a shortest route. */
function wallImpact(player,walls,pos,otherPos,w){
  const copy=new Set(walls); copy.add(wallKey(w.r,w.c,w.o));
  const selfBefore=shortestPath(player,walls,pos);
  const oppPlayer=player==="me"?"opp":"me";
  const enemyBefore=shortestPath(oppPlayer,walls,otherPos);
  const selfAfter=shortestPath(player,copy,pos);
  const enemyAfter=shortestPath(oppPlayer,copy,otherPos);
  if(!isFinite(selfAfter)||!isFinite(enemyAfter)) return null;
  const selfInfo=shortestPathInfo(player,copy,pos);
  const enemyInfo=shortestPathInfo(oppPlayer,copy,otherPos);
  return {
    selfAfter, enemyAfter,
    selfDelta:selfAfter-selfBefore,
    enemyDelta:enemyAfter-enemyBefore,
    selfWays:selfInfo.ways,
    enemyWays:enemyInfo.ways
  };
}

function moveKey(m){
  return m.type==="step"?"s:"+m.r+","+m.c:"w:"+m.r+","+m.c+","+m.o;
}

function movePriority(m){
  return m.priority ?? 0;
}

/*
 * Full tactical candidate generation:
 * - all legal pawn moves
 * - all legal walls that affect either current shortest route
 * - all walls that increase enemy distance
 * - all walls that preserve own distance
 * - a bounded set of additional strategic walls
 *
 * This is the crucial difference from the previous engine: a wall is not
 * discarded merely because it was not among the first 36 geometric guesses.
 */
function generateCandidates(turnPlayer,walls,myPos,oppPos,myWalls,oppWalls,limit=ENGINE.nodeWallLimit,searchDepth=1){
  const enemy=turnPlayer==="me"?"opp":"me";
  const pPos=turnPlayer==="me"?myPos:oppPos;
  const ePos=turnPlayer==="me"?oppPos:myPos;
  const pWalls=turnPlayer==="me"?myWalls:oppWalls;
  const curP=shortestPath(turnPlayer,walls,pPos);
  const curE=shortestPath(enemy,walls,ePos);
  const moves=[];

  for(const step of legalMoves(turnPlayer,walls,pPos,ePos)){
    const d=shortestPath(turnPlayer,walls,step);
    const progress=curP-d;
    moves.push({type:"step",r:step.r,c:step.c,priority:progress*10000});
  }
  if(pWalls<=0) return moves.sort((a,b)=>b.priority-a.priority);

  const ownPath=getOptimalPath(turnPlayer,walls,pPos);
  const enemyPath=getOptimalPath(enemy,walls,ePos);
  const ownCells=ownPath.slice(0,searchDepth<=2?20:12);
  const enemyCells=enemyPath.slice(0,searchDepth<=2?20:12);

  /*
   * A wall can only change the current shortest route if it touches one of
   * its cells. Build that tactical frontier instead of scanning every wall
   * anchor at every node. We still add a small strategic ring around both
   * pawns so a "pre-emptive" wall is not completely ignored.
   */
  const anchors=new Set();
  function addAround(cell){
    const r=cell.r,c=cell.c;
    for(const [rr,cc,o] of [
      [r-1,c,"h"],[r,c,"h"],[r,c-1,"v"],[r,c,"v"],
      [r-1,c-1,"h"],[r,c-1,"h"],[r-1,c-1,"v"],[r-1,c,"v"]
    ]){
      if(rr>=0&&rr<=getBoardRows()-2&&cc>=0&&cc<=7) anchors.add(rr+","+cc+","+o);
    }
  }
  for(const cell of ownCells) addAround(cell);
  for(const cell of enemyCells) addAround(cell);
  addAround(pPos); addAround(ePos);

  /* Add a deterministic central ring. It is small, but prevents the search
     from becoming blind to a setup wall that is not yet on a shortest path. */
  const cr=Math.max(0,Math.min(getBoardRows()-2,Math.floor(getBoardRows()/2)-1));
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    for(const o of ["h","v"]){
      const rr=cr+dr,cc=3+dc;
      if(rr>=0&&rr<=getBoardRows()-2&&cc>=0&&cc<=7) anchors.add(rr+","+cc+","+o);
    }
  }

  const all=[];
  for(const key of anchors){
    const [rs,cs,o]=key.split(",");
    const r=+rs,c=+cs;
    if(!wallGeometryLegal(r,c,o,walls)) continue;
    const copy=new Set(walls); copy.add(key);
    const ndE=shortestPath(enemy,copy,ePos);
    const ndP=shortestPath(turnPlayer,copy,pPos);
    if(!isFinite(ndE)||!isFinite(ndP)) continue;

    const eGain=ndE-curE;
    const pLoss=ndP-curP;
    const nearEnemy=enemyCells.some(x=>Math.abs(x.r-r)<=1&&Math.abs(x.c-c)<=1);
    const nearOwn=ownCells.some(x=>Math.abs(x.r-r)<=1&&Math.abs(x.c-c)<=1);

    let priority=eGain*2600 - pLoss*2200;
    if(nearEnemy) priority+=500;
    if(nearOwn) priority-=120;
    if(eGain>=2) priority+=900;
    if(eGain>=3) priority+=1200;
    if(pLoss<=0) priority+=250;
    if(eGain===0 && pLoss===0) priority-=80;

    all.push({type:"wall",r,c,o,priority,_eGain:eGain,_pLoss:pLoss});
  }

  all.sort((a,b)=>b.priority-a.priority);

  const pathCheck=Math.min(24,all.length);
  const beforeEnemyWays=shortestPathInfo(enemy,walls,ePos).ways;
  for(let i=0;i<pathCheck;i++){
    const w=all[i];
    const copy=new Set(walls); copy.add(wallKey(w.r,w.c,w.o));
    const afterEnemyWays=shortestPathInfo(enemy,copy,ePos).ways;
    if(afterEnemyWays < beforeEnemyWays) w.priority += 450;
    if(afterEnemyWays===1 && w._eGain>=1) w.priority += 500;
  }
  all.sort((a,b)=>b.priority-a.priority);

  const cap=searchDepth<=1 ? Math.min(Math.max(limit,48),64)
           : searchDepth<=3 ? Math.min(Math.max(limit,32),40)
           : Math.min(Math.max(limit,20),28);

  /*
   * Mandatory tactical set first: any wall that changes the opponent's
   * shortest route or preserves our own route is more important than a
   * generic "good looking" wall.
   */
  const chosen=[];
  const seen=new Set();
  for(const w of all){
    if(w._eGain>0 || w._pLoss<=0){
      const k=moveKey(w);
      if(!seen.has(k)){seen.add(k);chosen.push(w);}
      if(chosen.length>=cap) break;
    }
  }
  for(const w of all){
    if(chosen.length>=cap) break;
    const k=moveKey(w);
    if(!seen.has(k)){seen.add(k);chosen.push(w);}
  }
  for(const w of chosen) moves.push(w);

  moves.sort((a,b)=>b.priority-a.priority);
  return moves;
}

function applyMoveForSearch(m,walls,myPos,oppPos,myWalls,oppWalls,h1,h2,turnPlayer){
  const nw=new Set(walls);
  let nMy={...myPos},nOpp={...oppPos},nMW=myWalls,nOW=oppWalls,nh1=h1,nh2=h2;
  if(m.type==="step"){
    if(turnPlayer==="me") nMy={r:m.r,c:m.c};
    else nOpp={r:m.r,c:m.c};
  }else{
    nw.add(wallKey(m.r,m.c,m.o));
    const [a,b]=wallHashPair(m.r,m.c,m.o);
    nh1=(h1^a)>>>0;nh2=(h2^b)>>>0;
    if(turnPlayer==="me") nMW--; else nOW--;
  }
  return {walls:nw,myPos:nMy,oppPos:nOpp,myWalls:nMW,oppWalls:nOW,h1:nh1,h2:nh2};
}

/* Detect whether a player is walking into a brittle single-route corridor. */
function corridorRisk(player,walls,pos,otherPos){
  const info=shortestPathInfo(player,walls,pos);
  if(!isFinite(info.dist)) return 999;
  const moves=legalMoves(player,walls,pos,otherPos);
  let onBest=0;
  for(const m of moves){
    const d=shortestPath(player,walls,m);
    if(d===info.dist-1) onBest++;
  }
  let risk=0;
  if(info.ways<=1) risk+=3;
  if(onBest<=1) risk+=2;
  if(info.dist<=3 && info.ways<=2) risk+=2;
  return risk;
}

/*
 * This is the anti-self-trap guard. A wall/move is considered dangerous when
 * the opponent has a forced finish sooner than we can answer, OR when our
 * own route becomes a one-lane corridor while the opponent retains a
 * multi-route race. It is used as a search feature, not as a cosmetic rule.
 */
function tacticalPositionScore(walls,myPos,oppPos,myWalls,oppWalls){
  const me=shortestPathInfo("me",walls,myPos);
  const op=shortestPathInfo("opp",walls,oppPos);
  if(!isFinite(me.dist)) return -100000000;
  if(!isFinite(op.dist)) return 100000000;

  let score=0;
  score+=(op.dist-me.dist)*1450;
  score+=(myWalls-oppWalls)*38;

  const meRisk=corridorRisk("me",walls,myPos,oppPos);
  const opRisk=corridorRisk("opp",walls,oppPos,myPos);
  score+=(opRisk-meRisk)*260;

  /* If the opponent has a strictly shorter route and more than one way to
     execute it, penalize heavily: this is the exact pattern that previously
     produced "he already lost but kept building a path for the opponent". */
  if(op.dist<me.dist){
    score-=2200*(me.dist-op.dist);
    if(op.ways>=2) score-=900;
  }
  if(me.ways<=1 && op.ways>=2) score-=700;

  const myMoves=legalMoves("me",walls,myPos,oppPos).length;
  const opMoves=legalMoves("opp",walls,oppPos,myPos).length;
  score+=(myMoves-opMoves)*22;
  return score;
}

function evaluateStateFull(player,walls,myPos,oppPos,myWalls,oppWalls){
  if(myPos.r===getGoalRow("me")) return 100000000;
  if(oppPos.r===getGoalRow("opp")) return -100000000;
  const base=tacticalPositionScore(walls,myPos,oppPos,myWalls,oppWalls);
  return player==="me" ? base : -base;
}

/* Forced-race test. We only use this as a tactical oracle; it deliberately
   does not claim a global mathematical solution at arbitrary wall counts. */
function raceWindow(player,walls,myPos,oppPos,myWalls,oppWalls,plies){
  const pPos=player==="me"?myPos:oppPos;
  const ePos=player==="me"?oppPos:myPos;
  const pDist=shortestPath(player,walls,pPos);
  const eDist=shortestPath(player==="me"?"opp":"me",walls,ePos);
  if(!isFinite(pDist)) return -1;
  if(!isFinite(eDist)) return 1;
  if(eDist>pDist+plies) return 1;
  if(pDist>eDist+plies) return -1;
  return 0;
}

function shouldExtend(walls,myPos,oppPos,myWalls,oppWalls){
  const me=shortestPathInfo("me",walls,myPos);
  const op=shortestPathInfo("opp",walls,oppPos);
  if(me.dist<=4 || op.dist<=4) return true;
  if(me.ways<=1 || op.ways<=1) return true;
  if(Math.abs(me.dist-op.dist)<=2) return true;
  if(myWalls+oppWalls<=ENGINE.exactRemainingWalls) return true;
  return false;
}

/*
 * Exact solver for low-wall endgames. The state space is much smaller once
 * both players have only a few walls left. It searches legal moves without
 * heuristic pruning until terminal or the safety deadline.
 */
function exactEndgame(depth,walls,myPos,oppPos,myWalls,oppWalls,turn,alpha,beta){
  engineStats.exact++;
  if((++engineStats.nodes&255)===0 && performance.now()>=engineDeadline){
    engineAborted=true; return 0;
  }
  if(myPos.r===getGoalRow("me")) return 100000000-depth;
  if(oppPos.r===getGoalRow("opp")) return -100000000+depth;
  if(depth>40) return evaluateStateFull("me",walls,myPos,oppPos,myWalls,oppWalls);
  if(myWalls+oppWalls>ENGINE.exactRemainingWalls) return null;

  const key=(gameMode==="race"?"R":"D")+"|"+turn+"|"+myPos.r+","+myPos.c+"|"+
            oppPos.r+","+oppPos.c+"|"+myWalls+"|"+oppWalls+"|"+
            Array.from(walls).sort().join(";");
  const cached=EXACT_TT.get(key);
  if(cached && cached.depth>=depth) return cached.value;

  const p=turn==="me"?myPos:oppPos;
  const o=turn==="me"?oppPos:myPos;
  const pw=turn==="me"?myWalls:oppWalls;
  const candidates=[];
  for(const s of legalMoves(turn,walls,p,o)){
    candidates.push({type:"step",r:s.r,c:s.c,priority:0});
  }
  if(pw>0) for(const w of allValidWalls(walls)){
    candidates.push({type:"wall",r:w.r,c:w.c,o:w.o,priority:0});
  }

  let best=turn==="me"?-Infinity:Infinity;
  for(const m of candidates){
    const [h1,h2]=initialWallHash(walls);
    const n=applyMoveForSearch(m,walls,myPos,oppPos,myWalls,oppWalls,h1,h2,turn);
    const val=exactEndgame(depth+1,n.walls,n.myPos,n.oppPos,n.myWalls,n.oppWalls,
                           turn==="me"?"opp":"me",alpha,beta);
    if(engineAborted) return 0;
    if(turn==="me"){
      if(val>best) best=val;
      alpha=Math.max(alpha,val);
    }else{
      if(val<best) best=val;
      beta=Math.min(beta,val);
    }
    if(beta<=alpha){engineStats.cutoffs++;break;}
  }
  if(!isFinite(best)) best=evaluateStateFull("me",walls,myPos,oppPos,myWalls,oppWalls);
  EXACT_TT.set(key,{depth,value:best});
  if(EXACT_TT.size>50000) EXACT_TT.delete(EXACT_TT.keys().next().value);
  return best;
}

function minimax(depth,isMax,walls,myPos,oppPos,myWalls,oppWalls,h1,h2,alpha,beta){
  if((++engineStats.nodes&1023)===0 && performance.now()>=engineDeadline){
    engineAborted=true;return 0;
  }
  if(myPos.r===getGoalRow("me")) return 100000000-depth;
  if(oppPos.r===getGoalRow("opp")) return -100000000+depth;

  if(myWalls+oppWalls<=ENGINE.exactRemainingWalls){
    const ex=exactEndgame(depth,walls,myPos,oppPos,myWalls,oppWalls,isMax?"me":"opp",alpha,beta);
    if(ex!==null) return ex;
  }

  if(depth===0){
    return evaluateStateFull("me",walls,myPos,oppPos,myWalls,oppWalls);
  }

  const key=stateTTKey(h1,h2,myPos,oppPos,myWalls,oppWalls,isMax);
  const cached=TT.get(key);
  if(cached && cached.depth>=depth){
    engineStats.ttHits++;
    if(cached.flag==="EXACT") return cached.value;
    if(cached.flag==="LOWER") alpha=Math.max(alpha,cached.value);
    else if(cached.flag==="UPPER") beta=Math.min(beta,cached.value);
    if(alpha>=beta) return cached.value;
  }

  const alpha0=alpha,beta0=beta;
  const turn=isMax?"me":"opp";
  const limit=depth<=2?Math.max(ENGINE.nodeWallLimit,48):
              depth<=4?ENGINE.nodeWallLimit:
              Math.max(18,ENGINE.nodeWallLimit-8);
  const candidates=generateCandidates(turn,walls,myPos,oppPos,myWalls,oppWalls,limit,depth);
  if(!candidates.length) return evaluateStateFull("me",walls,myPos,oppPos,myWalls,oppWalls);

  let best=isMax?-Infinity:Infinity;
  let bestMove=null;
  for(const m of candidates){
    const n=applyMoveForSearch(m,walls,myPos,oppPos,myWalls,oppWalls,h1,h2,turn);
    const val=minimax(depth-1,!isMax,n.walls,n.myPos,n.oppPos,n.myWalls,n.oppWalls,
                      n.h1,n.h2,alpha,beta);
    if(engineAborted) return 0;
    if(isMax){
      if(val>best){best=val;bestMove=m;}
      alpha=Math.max(alpha,val);
    }else{
      if(val<best){best=val;bestMove=m;}
      beta=Math.min(beta,val);
    }
    if(beta<=alpha){engineStats.cutoffs++;break;}
  }

  let flag="EXACT";
  if(best<=alpha0) flag="UPPER";
  else if(best>=beta0) flag="LOWER";
  TT.set(key,{depth,value:best,flag,bestMove});
  if(TT.size>ENGINE.ttMax) ttTrim();
  return best;
}

/*
 * Root safety audit:
 * Before accepting a move, look for an immediate tactical refutation by the
 * opponent. This catches the old failure mode even when the main search is
 * interrupted by the mobile deadline.
 */
function rootMoveIsSafe(m){
  const [h1,h2]=initialWallHash(state.walls);
  const n=applyMoveForSearch(m,state.walls,{...state.me},{...state.opp},
                            state.me.walls,state.opp.walls,h1,h2,"me");
  if(n.oppPos.r===getGoalRow("opp")) return false;

  const opDist=shortestPath("opp",n.walls,n.oppPos);
  const meDist=shortestPath("me",n.walls,n.myPos);
  if(!isFinite(meDist) || !isFinite(opDist)) return false;

  /* Cheap race refutation. Inspect every legal pawn response (tiny branch)
     before the expensive deep search. */
  const opSteps=legalMoves("opp",n.walls,n.oppPos,n.myPos);
  for(const s of opSteps){
    const d=shortestPath("opp",n.walls,s);
    if(s.r===getGoalRow("opp")) return false;
    if(d < opDist && d+1 < meDist-1) return false;
  }
  return true;
}

function calculateBestMove(player){
  const myPos={...state.me},oppPos={...state.opp};

  /* Opening discipline: do not burn a wall on move one when the board is
     neutral. The engine should establish/retain a central lane first. */
  if(state.walls.size===0){
    const myD=shortestPath("me",state.walls,myPos);
    const opD=shortestPath("opp",state.walls,oppPos);
    const neutral=Math.abs(myD-opD)<=1 && opD>3;
    if(neutral){
      const steps=legalMoves("me",state.walls,myPos,oppPos);
      const scored=steps.map(s=>{
        const d=shortestPath("me",state.walls,s);
        const center=4-Math.abs(s.c-4);
        return {...s,_score:(myPos.r-s.r)*100+center*20-d*5};
      }).sort((a,b)=>b._score-a._score);
      if(scored.length) return {type:"step",r:scored[0].r,c:scored[0].c,priority:5000};
    }
  }

  const myWalls=state.me.walls,oppWalls=state.opp.walls;
  const [h1,h2]=initialWallHash(state.walls);

  /* If a move immediately wins, never spend time second-guessing it. */
  const legalNow=[
    ...legalMoves("me",state.walls,myPos,oppPos).map(p=>({type:"step",r:p.r,c:p.c,priority:1e9}))
  ];
  const immediate=legalNow.find(m=>m.r===getGoalRow("me"));
  if(immediate) return immediate;

  const engineStart=performance.now();
  engineDeadline=engineStart+ENGINE.timeMs;
  engineAborted=false;
  engineStats={nodes:0,depth:0,elapsed:0,ttHits:0,cutoffs:0,exact:0,tactical:0};

  TT.clear();
  const root=generateCandidates("me",state.walls,myPos,oppPos,myWalls,oppWalls,
                                ENGINE.rootWallLimit,1);
  if(!root.length) return null;

  /* Root safety: keep all winning/defensive candidates; discard only moves
     that already hand the opponent a direct terminal win. */
  const safeRoot=[];
  for(const m of root){
    if(performance.now()>=engineDeadline) break;
    if(rootMoveIsSafe(m)) safeRoot.push(m);
  }
  const searchRoot=safeRoot.length?safeRoot:root;

  let best=searchRoot[0],bestScore=-Infinity;
  for(let depth=1;depth<=ENGINE.maxDepth;depth++){
    if(performance.now()>=engineDeadline) break;
    let iterationBest=null,iterationScore=-Infinity;
    const ordered=best?[best,...searchRoot.filter(m=>moveKey(m)!==moveKey(best))]:searchRoot;
    for(const m of ordered){
      if(performance.now()>=engineDeadline) break;
      const n=applyMoveForSearch(m,state.walls,myPos,oppPos,myWalls,oppWalls,h1,h2,"me");
      const score=minimax(depth-1,false,n.walls,n.myPos,n.oppPos,n.myWalls,n.oppWalls,
                          n.h1,n.h2,-Infinity,Infinity);
      if(engineAborted) break;
      if(score>iterationScore){iterationScore=score;iterationBest=m;}
    }
    if(engineAborted||!iterationBest) break;
    best=iterationBest;bestScore=iterationScore;engineStats.depth=depth;
  }
  engineStats.elapsed=performance.now()-engineStart;
  return best;
}

/* Strong invariant tests. These run before the UI is used. */
function engineSelfTest(){
  const oldMode=gameMode,oldRace=raceWallsSetting;
  const failures=[];
  try{
    gameMode="duel";
    const s=initialState(); state=s;
    const empty=new Set();
    if(shortestPath("me",empty,s.me)!==8) failures.push("duel me path");
    if(shortestPath("opp",empty,s.opp)!==8) failures.push("duel opp path");
    if(allValidWalls(empty).length!==128) failures.push("initial wall count");
    if(!legalWall(0,0,"h",empty)) failures.push("legal h");
    if(!legalWall(0,0,"v",empty)) failures.push("legal v");

    const w=new Set([wallKey(0,0,"h")]);
    if(legalWall(0,0,"v",w)) failures.push("crossing wall accepted");
    if(legalWall(0,1,"h",w)) failures.push("overlapping wall accepted");

    const a={r:4,c:4},b={r:4,c:5};
    if(!legalMoves("me",empty,a,b).some(p=>p.r===4&&p.c===6)) failures.push("jump");
    const block=new Set([wallKey(4,5,"v")]);
    const lm=legalMoves("me",block,a,b);
    if(!lm.some(p=>p.r===3&&p.c===5)&&!lm.some(p=>p.r===5&&p.c===5)) failures.push("side jump");

    gameMode="race";
    const rs=initialState();
    if(shortestPath("me",empty,rs.me)!==12) failures.push("race me path");
    if(shortestPath("opp",empty,rs.opp)!==12) failures.push("race opp path");
    if(getDefaultWalls()!==raceWallsSetting) failures.push("race wall setting");

    /* Regression: every legal wall must preserve both routes. */
    gameMode="duel";
    state=initialState();
    for(const x of allValidWalls(new Set()).slice(0,16)){
      const cp=new Set([wallKey(x.r,x.c,x.o)]);
      if(shortestPath("me",cp,state.me)===Infinity ||
         shortestPath("opp",cp,state.opp)===Infinity){
        failures.push("wall route regression"); break;
      }
    }
  }catch(e){ failures.push("exception:"+e.message); }
  finally{gameMode=oldMode;raceWallsSetting=oldRace;}
  if(failures.length) console.error("ENGINE SELF-TEST FAILED:",failures);
  else console.info("ENGINE SELF-TEST OK");
  return failures.length===0;
}

const ENGINE_SELF_TEST_OK = engineSelfTest();

function getOppColor(){
  return myColorSetting === "blue" ? "red" : "blue";
}

function updateBoardLayout(){
  const frame = document.getElementById("boardFrame");
  const shell = document.getElementById("boardShell");
  if(!frame || !shell) return;
  
  const frameW = frame.clientWidth;
  const frameH = frame.clientHeight;
  if(frameW <= 0 || frameH <= 0) return;
  
  if(gameMode === "duel"){
    const size = Math.min(frameW, frameH);
    shell.style.width = size + "px";
    shell.style.height = size + "px";
  } else {
    let w = frameH * (9 / 13);
    let h = frameH;
    if(w > frameW){
      w = frameW;
      h = frameW * (13 / 9);
    }
    shell.style.width = w + "px";
    shell.style.height = h + "px";
  }
}

function wallPosition(r,c,o){
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  return {x: rect.width * (c + 1) / 9, y: rect.height * (r + 1) / rows};
}

function cellCenterPosition(r,c){
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  return {x: rect.width * (c + 0.5) / 9, y: rect.height * (r + 0.5) / rows};
}

function createWallPiece(r,c,o,extra=""){
  const el = document.createElement("div");
  el.className = "wall-piece " + o + " " + extra;
  const p = wallPosition(r,c,o);
  el.style.left = p.x + "px";
  el.style.top = p.y + "px";
  
  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  if(o === "h"){
    el.style.width = (rect.width * (2/9) - 3.5) + "px";
  } else {
    el.style.height = (rect.height * (2/rows) - 3.5) + "px";
  }
  return el;
}

function updatePiecePositions(animate=true){
  const pMe = cellCenterPosition(state.me.r, state.me.c);
  const pOpp = cellCenterPosition(state.opp.r, state.opp.c);
  
  const elMe = document.getElementById("pieceMe");
  const elOpp = document.getElementById("pieceOpp");
  const oppColor = getOppColor();
  
  if(elMe) elMe.className = "board-piece " + myColorSetting;
  if(elOpp) elOpp.className = "board-piece " + oppColor;

  const shell = document.getElementById("boardShell"), rect = shell.getBoundingClientRect();
  const rows = getBoardRows();
  const pieceSize = Math.min(rect.width/9, rect.height/rows) * 0.58;
  
  if(elMe){ 
    if(!animate){ elMe.style.transition = "none"; }
    elMe.style.width = pieceSize + "px";
    elMe.style.height = pieceSize + "px";
    elMe.style.left = pMe.x + "px"; elMe.style.top = pMe.y + "px";
    if(!animate){ requestAnimationFrame(()=>{ elMe.style.transition = ""; }); }
  }
  if(elOpp){ 
    if(!animate){ elOpp.style.transition = "none"; }
    elOpp.style.width = pieceSize + "px";
    elOpp.style.height = pieceSize + "px";
    elOpp.style.left = pOpp.x + "px"; elOpp.style.top = pOpp.y + "px";
    if(!animate){ requestAnimationFrame(()=>{ elOpp.style.transition = ""; }); }
  }
}

let currentRenderedRows = -1;
function buildGridDOM(){
  const grid = document.getElementById("boardGrid");
  const rows = getBoardRows();
  if(currentRenderedRows === rows) return;
  
  currentRenderedRows = rows;
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = "repeat(9, 1fr)";
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  
  for(let r=0; r<rows; r++) for(let c=0; c<9; c++){
    const cell = document.createElement("div");
    cell.className = "cell";
    if(c === 8) cell.style.borderRight = "0";
    if(r === rows - 1) cell.style.borderBottom = "0";
    cell.dataset.r = r;
    cell.dataset.c = c;
    cell.addEventListener("click", ()=>onCell(r,c));
    grid.appendChild(cell);
  }
}

function render(animatePieces=true){
  updateBoardLayout();
  buildGridDOM();
  
  const grid = document.getElementById("boardGrid");
  const layer = document.getElementById("wallLayer");
  layer.innerHTML = "";
  
  const legal = state.gameOver ? [] : legalMoves(state.turn);
  const isMyTurn = (state.turn === "me");
  
  const cells = grid.children;
  for(let i=0; i<cells.length; i++){
    const cell = cells[i];
    const r = +cell.dataset.r, c = +cell.dataset.c;
    
    const isLegal = legal.some(p => p.r === r && p.c === c);
    const isEngine = (isMyTurn && engineMove?.type === "step" && engineMove.r === r && engineMove.c === c);
    
    cell.classList.toggle("legal", isLegal);
    cell.classList.toggle("engine", isEngine);
  }
  
  updatePiecePositions(animatePieces);

  for(const k of state.walls){
    const [r,c,o] = k.split(",");
    layer.appendChild(createWallPiece(+r, +c, o));
  }
  if(isMyTurn && engineMove?.type === "wall"){
    layer.appendChild(createWallPiece(engineMove.r, engineMove.c, engineMove.o, "engine"));
  }
  updateUI();
}

function updateUI(){
  document.getElementById("meWalls").textContent = state.me.walls;
  document.getElementById("oppWalls").textContent = state.opp.walls;
  document.getElementById("dockCount").textContent = state[state.turn].walls;
  
  const pMeEl = document.getElementById("pMe");
  const pOppEl = document.getElementById("pOpp");
  const oppColor = getOppColor();
  
  pMeEl.className = "player bottom-p is-" + myColorSetting + (state.turn === "me" ? " active" : "");
  pOppEl.className = "player top-p is-" + oppColor + (state.turn === "opp" ? " active" : "");

  document.getElementById("pMeBall").className = "ball " + myColorSetting;
  document.getElementById("pOppBall").className = "ball " + oppColor;

  document.getElementById("pMeName").textContent = "Ты (" + (myColorSetting === "blue" ? "Синий" : "Красный") + ")";
  document.getElementById("pOppName").textContent = "Противник (" + (oppColor === "blue" ? "Синий" : "Красный") + ")";
  
  const glowBottom = document.getElementById("glowBottom");
  const glowTop = document.getElementById("glowTop");
  
  glowBottom.classList.toggle("active", state.turn === "me");
  glowTop.classList.toggle("active", state.turn === "opp");

  const firstTurnBadge = document.getElementById("firstTurnBadge");
  if(firstTurnBadge){
    firstTurnBadge.textContent = (firstTurnSetting === "me" ? "Ты" : "Противник");
    firstTurnBadge.className = "turn-badge " + (firstTurnSetting === "me" ? "me" : "opp");
  }

  const colorBadge = document.getElementById("colorBadge");
  if(colorBadge){
    colorBadge.textContent = (myColorSetting === "blue" ? "Синий" : "Красный");
    colorBadge.className = "turn-badge " + myColorSetting;
  }

  const racePosBtn = document.getElementById("racePosToggle");
  const racePosBadge = document.getElementById("racePosBadge");
  if(racePosBtn && racePosBadge){
    racePosBtn.style.display = (gameMode === "race" ? "flex" : "none");
    racePosBadge.textContent = (raceSideSetting === "right" ? "Справа" : "Слева");
  }

  const wallsBtn = document.getElementById("wallsToggle");
  const wallsBadge = document.getElementById("wallsBadge");
  if(wallsBtn && wallsBadge){
    wallsBtn.style.display = (gameMode === "race" ? "flex" : "none");
    wallsBadge.textContent = raceWallsSetting;
  }

  const modeLabel = document.getElementById("modeLabel");
  if(modeLabel) modeLabel.textContent = (gameMode === "race" ? "Гонка 9×13" : "Дуэль 9×9");
  
  const finishBar = document.getElementById("finishBar");
  if(finishBar) finishBar.classList.toggle("visible", gameMode === "race");

  const isMyTurn = (state.turn === "me");
  document.getElementById("apply").disabled = !(isMyTurn && engineMove && !state.gameOver);
  document.querySelectorAll(".wall-tool").forEach(b => b.classList.toggle("active", b.dataset.orient === selectedWall));
}

function onCell(r,c){
  if(state.gameOver) return;
  if(legalMoves(state.turn).some(p => p.r === r && p.c === c)){
    save(); state[state.turn].r = r; state[state.turn].c = c; playMoveSound(); finishTurn();
  }
}

function placeWall(r,c,o){
  if(state.gameOver || state[state.turn].walls <= 0 || !legalWall(r,c,o)) return false;
  save(); state.walls.add(wallKey(r,c,o)); state[state.turn].walls--; playWallSound(); selectedWall = null; engineMove = null; finishTurn(); return true;
}

function finishTurn(){
  const myGoal = getGoalRow("me");
  const oppGoal = getGoalRow("opp");
  const won = (state.me.r === myGoal) || (state.opp.r === oppGoal);
  
  if(won){
    state.gameOver = true;
    render(true);
    setTimeout(()=>alert(state.me.r === myGoal ? "Ты победил!" : "Противник победил!"), 20);
    return;
  }
  state.turn = (state.turn === "me" ? "opp" : "me");
  computeEngine();
}

function computeEngine(){
  if(state.gameOver){ render(true); return; }
  if(state.turn === "me"){
    engineMove = calculateBestMove(state.turn);
  } else {
    engineMove = null;
  }
  render(true);
}

function applyEngine(){
  if(!engineMove || state.gameOver || state.turn !== "me") return;
  save();
  if(engineMove.type === "step"){
    state[state.turn].r = engineMove.r; state[state.turn].c = engineMove.c; playMoveSound();
  } else {
    state.walls.add(wallKey(engineMove.r, engineMove.c, engineMove.o)); state[state.turn].walls--; playWallSound();
  }
  engineMove = null; finishTurn();
}

document.getElementById("apply").onclick = applyEngine;

document.getElementById("undo").onclick = ()=>{
  if(history.length) restore(history.pop());
};

document.getElementById("resign").onclick = ()=>{
  if(confirm("Сбросить партию и начать заново?")){
    state = initialState(); history = []; engineMove = null; selectedWall = null; computeEngine();
  }
};

function isPointerInsideBoard(pnt){
  const rect = document.getElementById("boardShell").getBoundingClientRect();
  return pnt.x >= rect.left - 15 && 
         pnt.x <= rect.right + 15 && 
         pnt.y >= rect.top - 15 && 
         pnt.y <= rect.bottom + 15;
}

function boardAnchorFromPointer(x,y,o){
  const rect = document.getElementById("boardShell").getBoundingClientRect();
  const rows = getBoardRows();
  const cellW = rect.width / 9;
  const cellH = rect.height / rows;
  
  let col = Math.round((x - rect.left) / cellW) - 1;
  let row = Math.round((y - rect.top) / cellH) - 1;
  
  col = Math.max(0, Math.min(7, col));
  row = Math.max(0, Math.min(rows - 2, row));
  return {r:row, c:col};
}

function dragPointer(x,y){
  return {x:x, y:y-65};
}

function updateGhost(x,y,o){
  const pnt = dragPointer(x,y);
  
  if(!isPointerInsideBoard(pnt)){
    if(ghostEl){ ghostEl.remove(); ghostEl = null; }
    ghostAnchor = null;
    return;
  }

  const a = boardAnchorFromPointer(pnt.x, pnt.y, o);
  
  if(!ghostEl){
    ghostEl = createWallPiece(a.r, a.c, o, "ghost");
    document.getElementById("wallLayer").appendChild(ghostEl);
  }
  
  const p = wallPosition(a.r, a.c, o);
  ghostEl.style.left = p.x + "px";
  ghostEl.style.top = p.y + "px";
  ghostEl.className = "wall-piece " + o + " ghost";
  
  const ok = state[state.turn].walls > 0 && legalWall(a.r, a.c, o);
  if(!ok) ghostEl.classList.add("bad");
  ghostAnchor = {...a, ok};
}

function endDrag(x,y){
  if(!dragging) return;
  const pnt = dragPointer(x,y);
  const inside = isPointerInsideBoard(pnt);
  
  dragging = false;
  if(ghostEl){ ghostEl.remove(); ghostEl = null; }
  
  if(inside){
    const a = boardAnchorFromPointer(pnt.x, pnt.y, dragOrient);
    const ok = state[state.turn].walls > 0 && legalWall(a.r, a.c, dragOrient);
    if(ok) placeWall(a.r, a.c, dragOrient);
  }
  
  ghostAnchor = null;
  dragOrient = null;
  selectedWall = null;
  render(true);
}

function bindWallDrag(btn){
  btn.addEventListener("pointerdown", e=>{
    if(state.gameOver || state[state.turn].walls <= 0) return;
    dragging = true; dragOrient = btn.dataset.orient; selectedWall = dragOrient;
    btn.setPointerCapture?.(e.pointerId);
    updateGhost(e.clientX, e.clientY, dragOrient);
    e.preventDefault(); e.stopPropagation();
  });
  btn.addEventListener("pointermove", e=>{
    if(dragging) updateGhost(e.clientX, e.clientY, dragOrient);
  });
  btn.addEventListener("pointerup", e=>endDrag(e.clientX, e.clientY));
  btn.addEventListener("pointercancel", ()=>endDrag(0,0));
}
bindWallDrag(document.getElementById("wallH"));
bindWallDrag(document.getElementById("wallV"));

document.getElementById("boardShell").addEventListener("pointermove", e=>{
  if(dragging) updateGhost(e.clientX, e.clientY, dragOrient);
});
document.getElementById("boardShell").addEventListener("pointerup", e=>{ if(dragging) endDrag(e.clientX, e.clientY); });

document.getElementById("boardShell").addEventListener("click", e=>{
  if(dragging || !selectedWall) return;
  const a = boardAnchorFromPointer(e.clientX, e.clientY, selectedWall);
  if(legalWall(a.r, a.c, selectedWall)) placeWall(a.r, a.c, selectedWall);
});

function sfx(freq,dur,type="sine",vol=.035){
  if(!soundOn) return;
  try{
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, audio.currentTime);
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + dur);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  }catch(e){}
}
function playMoveSound(){ sfx(430, .11, "sine", .035); setTimeout(()=>sfx(650, .08, "sine", .025), 35); }
function playWallSound(){ sfx(100, .07, "square", .03); }
